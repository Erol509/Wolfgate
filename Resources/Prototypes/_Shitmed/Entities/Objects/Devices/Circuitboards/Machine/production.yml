- type: entity
  parent: BaseMachineCircuitboard
  id: AutodocCircuitboard
  name: autodoc machine board
  description: A machine printed circuit board for an autodoc.
  components:
  - type: MachineBoard
    prototype: Autodoc
    # WOLFGATE: a machine part under stackRequirements can't be inserted; the frame reads parts from requirements
    requirements:
      Manipulator: 4
    stackRequirements:
      Cable: 3
      Steel: 10
    tagRequirements: # Mono
      ComponentBrickEconomy1:
        amount: 2
        defaultPrototype: ComponentBrickEconomy1
      MicroprocessorEconomy3:
        amount: 1
        defaultPrototype: MicroprocessorEconomy3
      MotorEconomy1:
        amount: 4
        defaultPrototype: MotorEconomy1

- type: entity
  parent: AutodocCircuitboard
  id: AutodocSyndieCircuitboard
  suffix: Syndie
  components:
  - type: MachineBoard
    prototype: AutodocSyndie

- type: entity
  parent: BaseMachineCircuitboard
  id: OperatingTableCircuitboard
  name: operating table machine board
  description: A machine printed circuit board for an operating table.
  components:
  - type: MachineBoard
    prototype: OperatingTable
    stackRequirements:
      Cable: 3
      Silver: 2
      Steel: 4
