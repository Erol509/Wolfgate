# WOLFGATE(Fauna) START: ported from Starlight (Funkystation)
- type: entity
  id: MobMeowl
  parent: [SimpleMobBase, FlyingMobBase]
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _Funkystation/Mobs/Animals/meowl.rsi
      state: meowl
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 10
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
     Alive:
       Base: meowl
     Critical:
       Base: dead
     Dead:
       Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 1
  - type: Speech
    speechSounds: Cat
    speechVerb: SmallMob
    allowedEmotes: ['Purr','Mew','Meow']
  - type: ReplacementAccent
    accent: cat
  - type: InteractionPopup
    successChance: 0.6
    interactSuccessString: petting-success-cat
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cat_meow.ogg
  - type: Bloodstream
    bloodReagent: Blood
    bloodMaxVolume: 75
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 5
        Piercing: 5
  - type: StaminaDamageOnHit
    damage: 8
  - type: Grammar
    attributes:
      gender: epicene
  - type: MobPrice
    price: 1000
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot
  - type: ThermalVision
  - type: NpcFactionMember
    factions:
    - PetsNT
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NPCRetaliation
  - type: GhostRole
    prob: 0.25
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-meowl-name
    description: ghost-role-information-meowl-description
    rules: ghost-role-information-nonantagonist-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
  - type: GhostTakeoverAvailable
# WOLFGATE END
