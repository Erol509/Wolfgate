# Opens a cyborg's built-in PDA.
- type: entity
  id: WGActionBorgOpenPda
  name: Open PDA
  description: Use the PDA built into your chassis.
  components:
  - type: InstantAction
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _WG/Resprites/Wizden/Objects/Devices/pda.rsi # WOLFGATE(Resprites): funky resprite
      state: pda
    event: !type:ToggleIntrinsicUIEvent { key: enum.PdaUiKey.Key }
    useDelay: 0.5
