    RFoot: MobArachnidRFoot

- type: humanoidBaseSprite
  id: MobArachnidEyes
  baseSprite:
    sprite: Mobs/Species/Arachnid/parts.rsi
    state: eyes

- type: markingPoints
  id: MobArachnidMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Tail:
      points: 1
      required: false # WOLFGATE(Species): tails are optional so players can go without one
      defaultMarkings: [ ArachnidAppendagesDefault ]
    HeadTop:
      points: 1
      required: false
    HeadSide:
      points: 1
      required: true
      defaultMarkings: [ ArachnidCheliceraeDownwards ]
    Chest:
      points: 8 # WOLFGATE(Species): was 1, more marking slots
      required: false
    Legs:
      points: 16 # imp 2<8 # WOLFGATE(Species): was 8, more marking slots
      required: false
    Arms:
      points: 16 # imp 2<8 # WOLFGATE(Species): was 8, more marking slots
      required: false

