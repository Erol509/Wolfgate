- type: species
  id: SlimePerson
  name: species-name-slime
  roundStart: true
  prototype: MobSlimePerson
  sprites: MobSlimeSprites
  defaultSkinTone: "#b8b8b8"
  markingLimits: MobSlimeMarkingLimits
  dollPrototype: MobSlimePersonDummy
  skinColoration: AnyColour #WOLFGATE(Species): Anycolor skin support for slimes

- type: speciesBaseSprites
  id: MobSlimeSprites
  sprites:
    Head: MobSlimeHead
    Hair: MobHumanoidAnyMarking # WOLFGATE(Species): was MobSlimeMarkingFollowSkin; hair colour is the player's pick
    FacialHair: MobHumanoidAnyMarking # WOLFGATE(Species): was MobSlimeMarkingFollowSkin; facial hair colour is the player's pick
    # WOLFGATE(Species) START: ported from HardLight, slimes take the head and tail marking slots of other species
    # Anthro ears, snouts and tails render on them.
    Snout: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    HeadTop: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    TailBehind: MobHumanoidAnyMarking
    TailOversuit: MobHumanoidAnyMarking
    # WOLFGATE END
    Chest: MobSlimeTorso
    UndergarmentTop: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    UndergarmentBottom: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Genital: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Penis: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Breasts: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Eyes: MobHumanoidEyes
    LArm: MobSlimeLArm
    RArm: MobSlimeRArm
    LHand: MobSlimeLHand
    RHand: MobSlimeRHand
    LLeg: MobSlimeLLeg
    RLeg: MobSlimeRLeg
    LFoot: MobSlimeLFoot
    RFoot: MobSlimeRFoot

- type: markingPoints
  id: MobSlimeMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Chest:
      points: 4 # imp 1<4
      required: false
    Legs:
      points: 8 # imp 4<8
      required: false
    Arms:
      points: 8 # imp 4<8
      required: false

- type: humanoidBaseSprite
  id: MobSlimeMarkingFollowSkin
  markingsMatchSkin: true
  layerAlpha: 0.75 # imp 0.5<0.75

