- type: species
  id: Vox
  name: species-name-vox
  roundStart: true
  prototype: MobVox
  sprites: MobVoxSprites
  markingLimits: MobVoxMarkingLimits
  dollPrototype: MobVoxDummy
  skinColoration: Hues # imp VoxFeathers<Hues
  defaultSkinTone: "#6c741d"
  maleFirstNames: names_vox
  femaleFirstNames: names_vox
  naming: First
  sexes:
  - Unsexed

- type: speciesBaseSprites
  id: MobVoxSprites
  sprites:
    Head: MobVoxHead
    Snout: MobHumanoidAnyMarking
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Chest: MobVoxTorso
    UndergarmentTop: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    UndergarmentBottom: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Genital: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Penis: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Breasts: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Eyes: MobVoxEyes
    LArm: MobVoxLArm
    RArm: MobVoxRArm
    LHand: MobVoxLHand
    RHand: MobVoxRHand
    LLeg: MobVoxLLeg
    RLeg: MobVoxRLeg
    LFoot: MobVoxLFoot
    RFoot: MobVoxRFoot
    Tail: MobHumanoidAnyMarking
    TailBehind: MobHumanoidAnyMarking # WOLFGATE(Genitals): split tail layers ported from HardLight/Floof
    TailOversuit: MobHumanoidAnyMarking # WOLFGATE(Genitals): split tail layers ported from HardLight/Floof

- type: markingPoints
  id: MobVoxMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Head:
      # WOLFGATE(Species): was 3, more marking slots
      points: 4 # Mono 1<3
      required: true
    Snout:
      points: 1
      required: true
      defaultMarkings: [ VoxBeak ]
    Arms:
      # WOLFGATE(Species): was 6, more marking slots
      points: 16 # Mono 4<6
      required: true
      defaultMarkings: [ VoxLArmScales, VoxRArmScales, VoxRHandScales, VoxLHandScales ]
    Legs:
      # WOLFGATE(Species): was 6, more marking slots
      points: 16 # Mono 4<6
      required: true
      defaultMarkings: [ VoxLLegScales, VoxRLegScales, VoxRFootScales, VoxLFootScales ]
    Chest:
      points: 8 # Mono 1<4 # WOLFGATE(Species): was 4, more marking slots
      required: false
    Overlay: # imp
      points: 4
      required: false
    Tail:
      points: 1
      required: false # WOLFGATE(Species): tails are optional so players can go without one
      defaultMarkings: [ VoxTail ]

