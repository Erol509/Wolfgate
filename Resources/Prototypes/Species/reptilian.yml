- type: species
  id: Reptilian
  name: species-name-reptilian
  roundStart: true
  prototype: MobReptilian
  sprites: MobReptilianSprites
  defaultSkinTone: "#34a223"
  markingLimits: MobReptilianMarkingLimits
  dollPrototype: MobReptilianDummy
  skinColoration: Hues
  maleFirstNames: names_reptilian_male
  femaleFirstNames: names_reptilian_female
  naming: FirstDashFirst

- type: speciesBaseSprites
  id: MobReptilianSprites
  sprites:
    Head: MobReptilianHead
    Hair: MobHumanoidAnyMarking # WOLFGATE(Species): hair layer so reptilian hair is drawn
    FacialHair: MobHumanoidAnyMarking # WOLFGATE(Species): facial hair layer so reptilian facial hair is drawn
    Snout: MobHumanoidAnyMarking
    Chest: MobReptilianTorso
    UndergarmentTop: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    UndergarmentBottom: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Genital: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Penis: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Breasts: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    TailBehind: MobHumanoidAnyMarking # WOLFGATE(Genitals): split tail layers ported from HardLight/Floof
    TailOversuit: MobHumanoidAnyMarking # WOLFGATE(Genitals): split tail layers ported from HardLight/Floof
    Eyes: MobHumanoidEyes
    LArm: MobReptilianLArm
    RArm: MobReptilianRArm
    LHand: MobReptilianLHand
    RHand: MobReptilianRHand
    LLeg: MobReptilianLLegDigi # WWDP-Edit
    RLeg: MobReptilianRLegDigi # WWDP-Edit
    LFoot: MobReptilianLFootDigi # WWDP-Edit
    RFoot: MobReptilianRFootDigi # WWDP-Edit

- type: markingPoints
  id: MobReptilianMarkingLimits
  onlyWhitelisted: false # WOLFGATE(Species): was true, which hid the shared hair styles from reptilians
  points:
    Hair:
      points: 1 # WOLFGATE(Species): was 0, reptilians can wear hair
      required: false
    FacialHair:
      points: 1 # WOLFGATE(Species): was 0, reptilians can wear facial hair
      required: false
    Tail:
      points: 1
      required: false # WOLFGATE(Species): tails are optional so players can go without one
      defaultMarkings: [ LizardTailSmooth ]
    Snout:
      points: 1
      required: true
      defaultMarkings: [ LizardSnoutRound ]
    HeadTop:
      points: 2
      required: false
    HeadSide:
      points: 2 # WWDP-Edit
      required: false
    Chest:
      points: 8 # WOLFGATE(Species): was 3, more marking slots
      required: false
    Legs:
      points: 16 # imp/mono 2<8 # WOLFGATE(Species): was 8, more marking slots
      required: false
    Arms:
      points: 16 # imp/mono 2<8 # WOLFGATE(Species): was 8, more marking slots
      required: false

