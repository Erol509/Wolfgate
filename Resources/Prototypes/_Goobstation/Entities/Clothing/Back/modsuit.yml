# Mono - modsuits cleanup - see #3733

# BASE
- type: entity
  abstract: true
  parent: [ Clothing, ContentsExplosionResistanceBase ]
  id: ClothingModsuitBase
  name: modsuit hardsuit unit
  description: A special modular suit contol unit containing all necessary modular hardsuit parts.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Clothing/Back/Modsuits/standard.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealed" ]
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Storage # satchel
    grid:
    - 0,0,1,3
    - 3,0,6,3
    - 8,0,9,3
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      toggleable-clothing: !type:Container
      cell_slot: !type:ContainerSlot
      # WOLFGATE(Modsuits) START: module and part containers
      mod-parts: !type:Container
        ents: []
      mod-modules: !type:Container
        ents: []
      # WOLFGATE END
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      # WOLFGATE(Modsuits) START: the module UI replaces the toggleable clothing UI
      # enum.ToggleClothingUiKey.Key:
      #   type: ToggleableClothingBoundUserInterface
      enum.ModSuitUiKey.Key:
        type: ModSuitBoundUserInterface
      # WOLFGATE END
  - type: UseDelay
    delay: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.9
  # WOLFGATE(Modsuits) START: the native module system spawns and seals the suit parts
  # - type: ToggleableClothing
  #   requiredSlot: back
  #   blockUnequipWhenAttached: true
  #   replaceCurrentClothing: true
  - type: ModSuit
    theme: ModThemeStandard
    coreSlotId: cell_slot
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed
  # WOLFGATE END
  - type: WiresPanel
  # WOLFGATE(Modsuits) START: the core slot replaces the power cell slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: modsuit-core-slot-name
        startingItem: ModsuitCoreStandard
        whitelist:
          components:
            - ModCore
  - type: ItemSlotsRequirePanel
    slots:
      cell_slot: true
  # - type: PowerCellDraw
  #   drawRate: 0.1 # Sealed draw rate
  #   useRate: 0.5 # Draw rate for sealing
  # - type: PowerCellSlot
  #   cellSlotId: cell_slot
  #   fitsInCharger: false
  - type: DoAfter
  # - type: SealableClothingControl
  # - type: SealableClothingRequiresPower
  # - type: SealableClothingVisuals
  #   spriteLayer: sealed
  #   clothingVisuals:
  #     back:
  #     - state: equipped-BACKPACK-sealed
  # WOLFGATE END

- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitStandard
  name: standard modsuit hardsuit unit
  description: A special modular suit contol unit containing all necessary modular hardsuit parts.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Back/Modsuits/standard.rsi
  # WOLFGATE(Modsuits) START: the module system owns the suit parts
  - type: ModSuit
    theme: ModThemeStandard
    parts:
      head: ClothingModsuitHelmetStandard
      gloves: ClothingModsuitGauntletsStandard
      outerClothing: ClothingModsuitChestplateStandard
      shoes: ClothingModsuitBootsStandard
  # WOLFGATE END
  - type: Construction
    graph: Modsuit
    node: standard

- type: entity
  parent: ClothingModsuitStandard
  id: ClothingModsuitStandartPowerCell
  suffix: High-Capacity Battery
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        # WOLFGATE(Modsuits): a MOD core replaces the power cell
        startingItem: ModsuitCoreStandardHighCapacity
        whitelist:
          components:
            - ModCore # WOLFGATE(Modsuits)

