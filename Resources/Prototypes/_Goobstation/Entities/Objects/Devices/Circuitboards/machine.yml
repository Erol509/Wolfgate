  description: A machine printed circuit board for a constructor.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: Constructor
    requirements:
      Manipulator: 3
      MatterBin: 2
    stackRequirements:
      Steel: 10
      Cable: 5

- type: entity
