- type: entity
  parent: BaseMachineCircuitboard
  id: VinylPlayerCircuitboard
  name: vinyl player machine board
  description: A machine printed circuit board for a vinyl player.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: VinylPlayer
    # WOLFGATE: a machine part under stackRequirements can't be inserted; the frame reads parts from requirements
    requirements:
      Manipulator: 1
    stackRequirements:
      Steel: 5
      WoodPlank: 10 #Forge-Change
      Plastic: 5 #Forge-Change

