- type: reagent
  id: Smoke
  name: es-reagent-name-smoke
  desc: es-reagent-desc-smoke
  physicalDesc: es-reagent-physical-desc-smoky
  flavor: smokey
  color: "#2e2e2e"
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        # WOLFGATE(WolfChem) START: thin haze from smoking is harmless; fire-thick smoke still chokes
        conditions:
        - !type:ReagentThreshold
          min: 0.25
        # WOLFGATE END
        ignoreResistances: true
        damage:
          types:
            Asphyxiation:
              1
    Gas:
      effects:
      - !type:HealthChange
        # WOLFGATE(WolfChem) START: thin haze from smoking is harmless; fire-thick smoke still chokes
        conditions:
        - !type:ReagentThreshold
          min: 0.25
        # WOLFGATE END
        ignoreResistances: true
        damage:
          types:
            Asphyxiation:
              2.5 #1.25 - Mono
            Poison: # Mono
              2.5
