# WOLFGATE(Fauna) START: ported from Goob Station
- type: entity
  id: MobLavalandGoliath
  parent: MobGoliath
  suffix: Lavaland
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/goliath.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath
      Dead:
        Base: goliath_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      350: Dead
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    range: 1.3
    angle: 0
    attackRate: 0.4
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 10
        Slash: 15
  - type: HTN
    constantlyReplan: true
    rootTask:
      task: GoliathCompound
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 3
    - id: MaterialGoliathHide1
      amount: 1
    - id: MaterialBones1
      maxAmount: 2

- type: entity
  id: MobLavalandGoliathAncient
  parent: MobLavalandGoliath
  suffix: Lavaland
  components:
  - type: Sprite
    sprite: _Lavaland/Mobs/goliath.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath_ancient
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath_ancient
      Dead:
        Base: goliath_ancient_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 10
        Slash: 15
  - type: HTN
    constantlyReplan: true
    rootTask:
      task: GoliathCompound
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        10
      NavSmash: !type:Bool
        true
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 3
    - id: MaterialGoliathHide1
      amount: 3
    - id: MaterialBones1
      amount: 3
# WOLFGATE END
