- type: smugglingReportMessageSet
  id: Nfsd
  channel: Nfsd
  messageSets:
  - prob: 0.8
    messages:
    - hourlyThreshold: 1
      type: General
      message: smuggling-report-nfsd-general
    - hourlyThreshold: 2
      type: DeadDropStationWithRandomAlt
      message: smuggling-report-nfsd-alternative
    - type: DeadDropStation
      message: smuggling-report-nfsd-specific
  - prob: 0.8
    minDelay: 10 # WOLFGATE: PDV pack, TSF pod report 2 min later
    maxDelay: 14 # WOLFGATE: PDV pack, TSF pod report 2 min later
    messages:
    - type: PodLocation
      message: smuggling-report-nfsd-pod
      maxError: 1250 # Mono

- type: smugglingReportMessageSet
  id: Pirate
  channel: Freelance
  messageSets:
  - prob: 0.7 # Mono 0.333->0.7
    minDelay: 4 # Mono
    maxDelay: 8 # Mono
    messages:
    - type: PodLocation
      message: smuggling-report-pirate
      maxError: 600 # WOLFGATE: PDV pack, tighter PDV pod coordinates
