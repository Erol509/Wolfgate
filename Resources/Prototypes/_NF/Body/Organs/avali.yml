# WOLFGATE(Species): ported from HardLight
- type: entity
  id: OrganAvaliStomach
  parent: OrganAnimalStomach
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Meat
      - Pill
      - Crayon
      - Paper
      - AvianFood
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Sprite # WOLFGATE(AvaliAddons): Avali organ sprites
    sprite: _WF/Mobs/Species/Avali/organs.rsi
    state: stomach

- type: entity
  id: OrganAvaliBrain
  parent: OrganHumanBrain
  name: avali brain
  suffix: Avali
  description: "Where Avali think evil thoughts."
  components:
  - type: Sprite
    sprite: _WF/Mobs/Species/Avali/organs.rsi
    state: brain


- type: entity
  id: OrganAvaliHeart
  parent: OrganHumanHeart
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Avali]
    groups:
    - id: Cryogenic # Frontier
    - id: Medicine
    - id: Poison
    - id: Narcotic
  - type: Sprite # WOLFGATE(AvaliAddons): Avali organ sprites
    sprite: _WF/Mobs/Species/Avali/organs.rsi
    state: heart-on

- type: entity
  id: OrganAvaliLiver
  parent: OrganHumanLiver
  components:
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    updateInterval: 1.5
    maxReagents: 1
    metabolizerTypes: [Avali]
    groups:
    - id: Alcohol
      rateModifier: 0.1 # removes alcohol very slowly along with the stomach removing it as a drink
  - type: Sprite # WOLFGATE(AvaliAddons): Avali organ sprites
    sprite: _WF/Mobs/Species/Avali/organs.rsi
    state: liver

- type: entity
  id: OrganAvaliKidneys
  parent: OrganHumanKidneys
  suffix: Avali
  description: "The kidneys of an avali."
  components:
  - type: Sprite # WOLFGATE(AvaliAddons): Avali organ sprites
    sprite: _WF/Mobs/Species/Avali/organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r

- type: entity
  id: OrganAvaliLungs
  parent: OrganHumanLungs
  suffix: Avali
  description: "The lungs of an avali."
  components:
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Resomi, Human ] #They get both so they can still breathe oxygen without us needing to add Resomi everywhere Human is listed
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: Sprite # WOLFGATE(AvaliAddons): Avali organ sprites
    sprite: _WF/Mobs/Species/Avali/organs.rsi
    layers:
      - state: lung-l
      - state: lung-r
