# Crates for the freight manifests that no catalog crate covers. None is a cargo product, so none can be ordered and
# resold. Guns are kept to a few per crate, and anything TSF-issue sits in a TSF-branded crate.

- type: entity
  id: WFCrateFoodRations
  parent: CratePlasticBiodegradable
  name: bulk ration crate
  description: A flimsy crate stacked with boxes of military meal rations.
  components:
  - type: StorageFill
    contents:
    - id: BoxMRE
      amount: 12

- type: entity
  id: WFCrateShipSystems
  parent: CrateEngineering
  name: ship systems crate
  description: Flatpacked IFF console, generators, cell charger and docking airlocks for fitting out a ship.
