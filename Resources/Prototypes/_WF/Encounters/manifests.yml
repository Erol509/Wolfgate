# What a freight run may be carrying. One is picked per run; the captain names it and the hold is filled from it.
# A crate listed twice is twice as likely. Most crates sell for about a thousand to fifteen hundred spesos at a
# pallet, with a rare dearer one; the crates that no catalog has are in crates.yml.

- type: wfEncounterManifest
  id: WFManifestGeneral
  name: wf-encounter-cargo-general
  crates:
  - WFCrateLotTools
  - WFCrateLotTools
  - WFCrateLotSurvival
  - WFCrateLotSurvival
  - WFCrateLotMedical
  - WFCrateLotParts
  - WFCrateLotLuxury
  - WFCrateLotSalvage
  - CrateMaterialPlastic
  - CrateMaterialGlass
  - CrateAirlockKit
