# The Lupercal: the admin station-ship, spawned only with the admin Spawn Vessel command (never sold).
# See Content.Server/_WF/AdminVessels/README.md.

- type: vessel
  id: WFLupercal
  parent: BaseVessel
  name: Lupercal
  description: A ring-docked station-ship for the sector's administration, spawned by admins only.
  price: 80000000 # never sold; kept above its appraisal for the arbitrage test
  purchasable: false
  category: Large
  group: Custom
  mapchecker_group_override: PointOfInterest # allows its indestructible plastitanium walls
  shuttlePath: /SharedMaps/_WF/AdminVessels/lupercal.yml
  guidebookPage: null
  class:
  - Capital
  engine:
  - Plasma
  addComponents:
  - type: WFFtlUnrestricted
  # Floors that can't be pried, laid over, taken by an RCD or broken by a blast; the walls and windows are
  # indestructible kinds in the map itself.
  - type: ProtectedGrid
    preventFloorRemoval: true
    preventFloorPlacement: true
    preventRCDUse: true
  - type: WFBlastproofFloors
  # Only the staff list and up open maintenance panels or use an emag aboard: no hacking its doors and machines.
  - type: WFShipCommand
    staffOnlyWires: true
  # Stay put and defend: marines walk the posts, gunners answer attacks on the ship and whoever is docked to it, and
  # the pilot holds station with the best armed side to the attacker.
  - type: WFShipRoster
    callsign: Lupercal
    marineOrders: Rounds
    gunnerPolicy: DefendDocked
    pilotStance: FaceThreats
  # Mother Base manners (CrewBarks): the crew salute the Boss, take a punch with thanks and talk among themselves.
  - type: WFCrewBarks
    voices:
      WFLupercalDockmaster: dockmaster
      WFLupercalQuartermaster: quartermaster
      WFLupercalApothecary: apothecary
  - type: WFShipFitting
  # Every job starts closed (the gameMap below); a player who takes one relieves the NPC at the matching post and
  # stands on the command list named here while they hold it.
  - type: WFShipJobs
    jobs:
      WFLupercalPilot: { role: WFCrewPilot, standing: Officers }
      WFLupercalRadioOperator: { role: WFCrewRadioOperator, standing: Officers }
      WFLupercalGunner: { role: WFCrewGunner, standing: Officers }
      WFLupercalDockmaster: { counter: WFLupercalDockmaster, standing: Officers }
      WFLupercalMarine: { role: WFCrewMarine, standing: Staff }
      WFLupercalEngineer: { role: WFCrewEngineer, standing: Staff }
      WFLupercalDeckhand: { role: WFCrewDeckhand, standing: Staff }
      WFLupercalParamedic: { role: WFCrewParamedic, standing: Staff }
      WFLupercalSurgeon: { role: WFCrewSurgeon, standing: Staff }
      WFLupercalAi: {}
      WFLupercalCyborg: {}

- type: gameMap
  id: WFLupercal
  mapName: 'Lupercal'
  mapPath: /SharedMaps/_WF/AdminVessels/lupercal.yml
  minPlayers: 0
  stations:
    WFLupercal:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Lupercal'
        # What the cargo order and bounty consoles read; a plain vessel station has neither.
        - type: StationCargoOrderDatabase
        - type: StationCargoBountyDatabase
          availableBounties:
          - CCBountyAmanitaJelly
          - CCBountyBun
          - CCBountyBread
          - CCBountyBoiledRice
          - CCBountyBoiledSnail
          - CCBountyCarrotFries
          - CCBountyCookedSausage
          - CCBountyOatmeal
          - CCBountyOnionRings
          - CCBountyPickle
          - CCBountyPopcorn
          - CCBountyRatBurger
          - CCBountySpaceFries
          - CCBountyBagel
          - CCBountyBaguette
          - CCBountyCookedSpaceshroom
          - CCBountyCottonBagel
          - CCBountyCottonBread
          - CCBountyRaisinBag
          - CCBountyRicePudding
          - CCBountyCottonCroissant
          - CCBountyBasicNoodles
          - CCBountyBoiledPasta
        - type: StationJobs
          availableJobs:
            WFLupercalPilot: [ 0, 0 ]
            WFLupercalRadioOperator: [ 0, 0 ]
            WFLupercalGunner: [ 0, 0 ]
            WFLupercalDockmaster: [ 0, 0 ]
            WFLupercalMarine: [ 0, 0 ]
            WFLupercalEngineer: [ 0, 0 ]
            WFLupercalDeckhand: [ 0, 0 ]
            WFLupercalParamedic: [ 0, 0 ]
            WFLupercalSurgeon: [ 0, 0 ]
            WFLupercalAi: [ 0, 0 ]
            WFLupercalCyborg: [ 0, 0 ]
