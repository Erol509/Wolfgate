# The Lupercal's own people besides its NpcCrew roster: the counter staff its roster puts behind the counters
# (WFShipCounterPost* markers), and its silicons, which serve under the WFLupercalLawset.

# Torvald Deepkeel, the Lupercal's dockmaster: answers hails and books the ring's berths from his desk.
- type: humanoidProfile
  id: WFLupercalDockmasterProfile
  profile:
    name: Torvald Deepkeel
    species: Dwarf
    age: 142
    sex: Male
    gender: Male
    appearance:
      hair: HumanHairBraid
      hairColor: "#9C9C9C"
      facialHair: HumanFacialHairLongbeard
      facialHairColor: "#9C9C9C"
      eyeColor: "#3B5B4A"
      skinColor: "#B98563"

- type: startingGear
  id: WFLupercalDockmasterTraderGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    outerClothing: ClothingOuterVestHazard
    head: ClothingHeadHatHardhatWhite
    ears: ClothingHeadsetGrey
    shoes: ClothingShoesBootsWork
    gloves: ClothingHandsGlovesColorBlack

- type: traderDialogue
  id: WFLupercalDockmasterDialogue
  greeting: wf-lupercal-dockmaster-greeting
  farewell: wf-lupercal-dockmaster-farewell
  options:
  - prompt: wf-lupercal-dockmaster-prompt-how
    response: wf-lupercal-dockmaster-response-how
  - prompt: wf-lupercal-dockmaster-prompt-hail
    response: wf-lupercal-dockmaster-response-hail
  - prompt: wf-lupercal-dockmaster-prompt-who
    response: wf-lupercal-dockmaster-response-who

- type: entity
  id: WFLupercalDockmaster
  parent: WFDrydockDockmasterBase
  name: Torvald Deepkeel
  description: The Lupercal's dockmaster, his beard braided into the cable of a crane remote.
  suffix: Lupercal, Dockmaster
  components:
  - type: HumanoidAppearance
    species: Dwarf
    initial: WFLupercalDockmasterProfile
  - type: Loadout
    prototypes: [ WFLupercalDockmasterTraderGear ]
  - type: Trader
    dialogue: WFLupercalDockmasterDialogue
  # Every console aboard rings on a hail: the bridge gets a few seconds to take it first.
  - type: HailResponder
    answerDelay: 8
    greetings:
    - wf-lupercal-dockmaster-hail-1
    - wf-lupercal-dockmaster-hail-2
    - wf-lupercal-dockmaster-hail-3

# His desk beside the counter. A hail only rings at a helm, and this one stands in a public lobby, so only officers and
# up may sit at it. The booking service is the desk's, so it stays when a player takes the dockmaster's job.
- type: entity
  parent: WFComputerDrydockTraffic
  id: WFComputerLupercalDockDesk
  name: dockmaster's desk
  description: Where the Lupercal's dockmaster takes hails and books berths. On a call, a button in the hail window offers the caller the drydock. Officers and up may sit at it.
  components:
  - type: WFOfficerHelm
  - type: WFDrydockOperator
  # The operator adds the drydock window if it's missing; declared here so spawning changes nothing.
  - type: UserInterface
    interfaces:
      enum.ShuttleConsoleUiKey.Key:
        type: ShuttleConsoleBoundUserInterface
      enum.IntercomUiKey.Key:
        type: IntercomBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
      enum.WFDrydockConsoleUiKey.Key:
        type: WFDrydockConsoleBoundUserInterface
  - type: HailService
    name: drydock-hail-service
    key: enum.WFDrydockConsoleUiKey.Key
    perCaller: true

# Imre Kast, quartermaster at the Exchange dock: fuel, and refuelling for ships with a deed.
- type: humanoidProfile
  id: WFLupercalQuartermasterProfile
  profile:
    name: Imre Kast
    species: Human
    age: 51
    sex: Male
    gender: Male
    appearance:
      hair: HumanHairCrewcut
      hairColor: "#2E2620"
      facialHair: HumanFacialHairChinlessbeard
      facialHairColor: "#2E2620"
      eyeColor: "#5A4632"
      skinColor: "#C79A76"

- type: startingGear
  id: WFLupercalQuartermasterGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitEngineeringHazard
    head: ClothingHeadHatHardhatBlue
    ears: ClothingHeadsetGrey
    shoes: ClothingShoesBootsWork
    gloves: ClothingHandsGlovesColorBlack
    belt: ClothingBeltUtility

- type: traderDialogue
  id: WFLupercalQuartermasterDialogue
  greeting: wf-lupercal-quartermaster-greeting
  farewell: wf-lupercal-quartermaster-farewell
  options:
  - prompt: wf-lupercal-quartermaster-prompt-shop
    response: wf-lupercal-quartermaster-response-shop
    action: OpenShop
  - prompt: wf-lupercal-quartermaster-prompt-refuel
    response: wf-lupercal-quartermaster-response-refuel
    action: Refuel
    requires: DeedId
  - prompt: wf-lupercal-quartermaster-prompt-who
    response: wf-lupercal-quartermaster-response-who
    action: None

- type: entity
  id: WFLupercalQuartermaster
  parent: WFTraderFuelTechnician
  name: Imre Kast
  description: The Exchange dock's quartermaster, who counts every litre twice.
  suffix: Lupercal, Fuel
  components:
  - type: HumanoidAppearance
    species: Human
    initial: WFLupercalQuartermasterProfile
  - type: Loadout
    prototypes: [ WFLupercalQuartermasterGear ]
  - type: Trader
    dialogue: WFLupercalQuartermasterDialogue

# Sister Agathe Lowe, apothecary at the Medical dock: clinic supplies and medical equipment.
- type: humanoidProfile
  id: WFLupercalApothecaryProfile
  profile:
    name: Agathe Lowe
    species: Human
    age: 63
    sex: Female
    gender: Female
    appearance:
      hair: HumanHairTightbun
      hairColor: "#D8D2C8"
      eyeColor: "#4E6A80"
      skinColor: "#E9C7A8"

- type: startingGear
  id: WFLupercalApothecaryGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorWhite
    outerClothing: ClothingOuterCoatLab
    neck: ClothingNeckStethoscope
    ears: ClothingHeadsetGrey
    shoes: ClothingShoesColorWhite
    gloves: ClothingHandsGlovesNitrile

- type: traderDialogue
  id: WFLupercalApothecaryDialogue
  greeting: wf-lupercal-apothecary-greeting
  farewell: wf-lupercal-apothecary-farewell
  options:
  - prompt: wf-lupercal-apothecary-prompt-shop
    response: wf-lupercal-apothecary-response-shop
    action: OpenShop
  - prompt: wf-lupercal-apothecary-prompt-who
    response: wf-lupercal-apothecary-response-who
    action: None

- type: entity
  id: WFLupercalApothecary
  parent: WFBaseTrader
  name: Agathe Lowe
  description: The Medical dock's apothecary, who calls everyone "dear" and means nothing by it.
  suffix: Lupercal, Medical
  components:
  - type: HumanoidAppearance
    species: Human
    initial: WFLupercalApothecaryProfile
  - type: Loadout
    prototypes: [ WFLupercalApothecaryGear ]
  - type: Trader
    dialogue: WFLupercalApothecaryDialogue
  - type: TraderShop
    vendors:
    - WFTraderStockMedic
    - WFTraderStockMedicEquipment

# Counter posts: the roster puts each trader on his marker, facing the counter in front of it.
- type: entity
  parent: WFShipCounterPostBase
  id: WFShipCounterPostLupercalDockmaster
  name: counter post (Lupercal dockmaster)
  components:
  - type: WFShipCounterPost
    trader: WFLupercalDockmaster

- type: entity
  parent: WFShipCounterPostBase
  id: WFShipCounterPostLupercalQuartermaster
  name: counter post (Lupercal quartermaster)
  components:
  - type: WFShipCounterPost
    trader: WFLupercalQuartermaster

- type: entity
  parent: WFShipCounterPostBase
  id: WFShipCounterPostLupercalApothecary
  name: counter post (Lupercal apothecary)
  components:
  - type: WFShipCounterPost
    trader: WFLupercalApothecary

# The WFLupercalLawset (code plan section 8d): the owner and command first, then the people aboard, then the rules
# set from the bridge, then the ship and the silicon itself.
- type: siliconLaw
  id: WFLupercalLaw1
  order: 1
  lawString: law-lupercal-1

- type: siliconLaw
  id: WFLupercalLaw2
  order: 2
  lawString: law-lupercal-2

- type: siliconLaw
  id: WFLupercalLaw3
  order: 3
  lawString: law-lupercal-3

- type: siliconLaw
  id: WFLupercalLaw4
  order: 4
  lawString: law-lupercal-4

- type: siliconLawset
  id: WFLupercalLawset
  laws:
  - WFLupercalLaw1
  - WFLupercalLaw2
  - WFLupercalLaw3
  - WFLupercalLaw4
  obeysTo: laws-owner-lupercal

- type: entity
  id: WFLupercalAiBrain
  parent: StationAiBrain
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: SiliconLawProvider
    laws: WFLupercalLawset

# The AI core in the admin machines room, empty until a player takes the AI job.
- type: entity
  id: WFLupercalAiCore
  parent: PlayerStationAiEmpty
  suffix: Lupercal, Job spawn
  components:
  - type: ContainerSpawnPoint
    containerId: station_ai_mind_slot
    job: WFLupercalAi

- type: entity
  id: WFLupercalBorg
  parent: PlayerBorgBattery
  categories: [ HideSpawnMenu ]
  suffix: Lupercal
  components:
  - type: SiliconLawProvider
    laws: WFLupercalLawset

- type: entity
  id: WFLupercalCyborgSpawnPoint
  parent: SpawnPointBorg
  name: cyborg (Lupercal)
  components:
  - type: SpawnPoint
    job_id: WFLupercalCyborg
