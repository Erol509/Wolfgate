# The Lupercal's admin gas stock: canisters that can't be destroyed, each holding a thousand times the usual gas at the
# usual pressure. Not for sale: one of these is worth more than most ships.

- type: entity
  abstract: true
  id: WFLupercalCanisterBase
  suffix: Admin, Lupercal
  description: An admin-grade canister that can't be destroyed and holds a thousand times what a normal one does. It can be attached to connector ports using a wrench.
  components:
  - type: CargoSellBlacklist

- type: entity
  parent: [ WFLupercalCanisterBase, BaseStructureIndestructible, OxygenCanister ]
  id: WFLupercalCanisterOxygen
  name: admin oxygen canister
  components:
  - type: GasCanister
    gasMixture:
      volume: 1500000
      moles:
        Oxygen: 2769360
      temperature: 293.15

