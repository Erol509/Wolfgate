# The Lupercal's vehicle bay: heavy vehicles to the apron's pad, and the licence and parts over the counter. Prices
# match the military outfitter's, and sit above what each vehicle appraises for, so nothing here sells at a profit.

- type: wfVehicleCatalog
  id: WFVehicleCatalogLupercal
  vehicles:
  - vehicle: WFHeavyVehicleLicence
    price: 25000
  - vehicle: WFMilitaryChassisHumvee
    price: 38000
    licence: true
  - vehicle: VehicleAPC
    price: 60000
    licence: true
  - vehicle: VehicleAPCPMC
    price: 62000
    licence: true
  - vehicle: VehicleAPCMed
    price: 65000
    licence: true
  - vehicle: VehicleAev
    price: 95000
    licence: true
  - vehicle: VehicleTankTWE
    price: 120000
    licence: true
  - vehicle: WFMilitaryChassisTank
    price: 135000
    licence: true
  - vehicle: WFMilitaryChassisTankPMC
    price: 145000
    licence: true

- type: entity
  parent: WFComputerVehicleShopExpeditionary
  id: WFComputerVehicleShopLupercal
  name: heavy vehicle terminal
  description: Sells tanks, armed APCs and engineering vehicles to the apron's pad. Heavy vehicles need a licence, sold here too. Park a vehicle on the pad to repair or sell it. Fit parts with a crowbar on the vehicle.
  suffix: Lupercal
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      state: shipyard_security
    - map: [ "computerLayerKeys" ]
      state: generic_keys
  - type: WFVehicleShop
    catalog: WFVehicleCatalogLupercal
    extraCatalogs:
    - WFMilitaryCatalogParts
