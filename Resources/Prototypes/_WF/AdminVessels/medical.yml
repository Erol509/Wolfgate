# The Lupercal's medical machines (ShipCommand phase 8): an autodoc that knows every program and comes with both of
# its modules, and a cloning pod that never runs out of biomass. The surgeon keeps the autodoc's reservoirs full.

- type: entity
  parent: WFMachineAutodoc
  id: WFLupercalAutodoc
  suffix: Lupercal, every program
  description: A surgical pod running S.A.M., the Surgical Automation Module, with every program disk's work in its own library and both modules fitted. It operates. It does not explain.
  components:
  - type: Autodoc
    basePrograms:
    - WFWolfmedAutodocProgramBase
    - WFWolfmedAutodocProgramTransplant
    - WFWolfmedAutodocProgramLimb
    - WFWolfmedAutodocProgramNeuro
    - WFWolfmedAutodocProgramCavity
  - type: ContainerFill
    containers:
      autodoc_module:
      - WFAutodocDefibModule
      autodoc_autofix:
      - WFAutodocAutofixModule
      autodoc_beaker1:
      - WFWolfmedOpiateChemistryBottle
      autodoc_beaker2:
      - WFSpaceacillinChemistryBottle
      autodoc_blood:
      - Bloodpack

- type: entity
  parent: CloningPod
  id: WFLupercalCloningPod
  suffix: Lupercal, bottomless
  components:
  - type: WFBottomlessMaterials
    amount: 10000
