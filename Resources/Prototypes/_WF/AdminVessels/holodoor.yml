# A hard-light field in a doorway: it parts for whoever its reader admits and stops everyone else. It can't be pried,
# hacked, welded or broken, so a zone's access holds; the Lupercal's staff zones are bounded by these.
- type: entity
  id: WFHoloDoor
  parent: BaseStructureIndestructible
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _WF/AdminVessels/holodoor.rsi
    drawdepth: Doors
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
      shader: unshaded
  - type: AnimationPlayer
  - type: Appearance
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: InteractionOutline
  - type: Door
    occludes: false
    bumpOpen: true
    clickOpen: true
    canPry: false
    closeTimeOne: 0.3
    closeTimeTwo: 0.1
    openTimeOne: 0.1
    openTimeTwo: 0.1
    openingAnimationTime: 0.2
    closingAnimationTime: 0.2
    crushDamage:
      types:
        Shock: 5
    openSound:
      path: /Audio/Machines/airlock_open.ogg
      params:
        pitch: 1.4
        volume: -4
    closeSound:
      path: /Audio/Machines/airlock_close.ogg
      params:
        pitch: 1.4
        volume: -4
    denySound:
      path: /Audio/Machines/airlock_deny.ogg
  - type: AccessReader
  - type: Airtight
  - type: NavMapDoor
  - type: PointLight
    radius: 1.5
    energy: 0.8
    color: "#4FA8E8"
  - type: Tag
    tags:
    - ForceNoFixRotations
