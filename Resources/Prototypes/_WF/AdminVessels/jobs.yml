# The Lupercal's player jobs. Each starts closed (0 slots in the gameMap): the owner opens them (the command console,
# or wf_shipjobs), and a player who takes one relieves the NPC at the matching post (WFShipJobs on the vessel). They
# are the Lupercal's own ids, so no other station's join path offers them, and they stay out of character preferences.
# The station AI goes into the core in the admin machines room and cyborgs come aboard in Robotics, both under the
# WFLupercalLawset. Written by gen_jobs.py (job prototypes can't inherit).

- type: job
  id: WFLupercalPilot
  name: wf-lupercal-job-pilot
  description: wf-lupercal-job-pilot-desc
  playTimeTracker: JobWFLupercalPilot
  supervisors: wf-lupercal-job-supervisors
  icon: JobIconPilot
  setPreference: false
  canBeAntag: false
  weight: 1
  displayWeight: 5
  startingGear: WFLupercalPilotGear
  accessGroups:
  - GeneralAccess

