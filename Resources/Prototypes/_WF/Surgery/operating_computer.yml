- type: entity
  parent: BaseComputer
  id: WFOperatingComputer
  name: operating computer
  description: Monitors patient vitals and displays surgery steps. Automatically syncs to operating tables within its line of sight.
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: crew
    - map: ["computerLayerKeys"]
      state: med_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#006400"
  - type: OperatingComputer
  - type: UserInterface
    interfaces:
      enum.OperatingComputerUiKey.Key:
        type: OperatingComputerBui

- type: entity
  parent: BaseComputerCircuitboard
  id: WFOperatingComputerCircuitboard
  name: operating computer board
  description: A computer printed circuit board for an operating computer.
  components:
  - type: Sprite
    state: cpu_medical
  - type: ComputerBoard
    prototype: WFOperatingComputer
