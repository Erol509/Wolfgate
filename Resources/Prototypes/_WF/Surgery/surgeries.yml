# Surgeries that exist only to carry a generic state-changing step. The state-driven engine treats each
# step as its own operation, so these surgeries never appear in the old step window.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryInciseSkin
  categories: [ HideSpawnMenu ]
