# State-driven surgical operations. These mirror /tg/station's surgery operation datums; the heavy lifting of
# each step is still performed by the referenced legacy step prototype.

- type: surgicalOperation
  id: WFInciseSkin
  name: wf-surgery-op-incise-skin
  description: wf-surgery-op-incise-skin-desc
  rndName: wf-surgery-op-incise-skin
  surgery: WFSurgeryInciseSkin
  step: WFSurgeryStepInciseSkin
  requirePreviousSteps: false
  time: 1.6
  blockedStates: [SkinCut, SkinOpen]
  priority: 0
  flags: [Organic, NoPatient]
  tools:
  - component: Scalpel
  - quality: Slicing
    speed: 2.25
  - anyItem: true
    requiresSharp: true
    speed: 3.33

