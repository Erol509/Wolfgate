# Drug chemistry. Recipes are invented for the game. Each wfReactionPurity entry shares its reaction's ID and sets the
# temperature that gives full grade; the product's grade falls off linearly to the floor outside the tolerance.

- type: reaction
  id: WFCocaine
  minTemp: 310
  reactants:
    WFCocaAlkaloid:
      amount: 3
    SodiumCarbonate:
      amount: 1
    Acetone:
      amount: 1
  products:
    WFCocaine: 3

- type: wfReactionPurity
  id: WFCocaine
  optimalTemp: 330
  tolerance: 40
  drift: 8

# Cooked cocaine sets into rocks, one per 5 u.
- type: reaction
  id: WFCrackRock
  minTemp: 370
  reactants:
    WFCocaine:
      amount: 5
    SodiumCarbonate:
      amount: 1
    Water:
      amount: 1
  effects:
  - !type:WFCreateGradedEntity
    entity: WFCrackRock

- type: wfReactionPurity
  id: WFCrackRock
  optimalTemp: 385
  tolerance: 30
  drift: 8

- type: reaction
  id: WFHeroin
  minTemp: 330
  reactants:
    WFOpium:
      amount: 2
    Vinegar:
      amount: 1
    Ammonia:
      amount: 1
  products:
    WFHeroin: 2

- type: wfReactionPurity
  id: WFHeroin
  optimalTemp: 350
  tolerance: 30
  drift: 8

# Chilled opium sets into resin, one lump per 5 u, once water touches it. The water is a catalyst, so it can go in
# last at the right temperature and doesn't count towards the grade.
- type: reaction
  id: WFOpiumResin
  maxTemp: 270
  reactants:
    WFOpium:
      amount: 5
    Water:
      amount: 1
      catalyst: true
  effects:
  - !type:WFCreateGradedEntity
    entity: WFOpiumResin

- type: wfReactionPurity
  id: WFOpiumResin
  optimalTemp: 250
  tolerance: 30
  drift: 8

# Chilled Desoxyephedrine sets into crystal shards, one per 5 u, once acetone touches it. The acetone is a catalyst,
# like the water for resin.
- type: reaction
  id: WFCrystalShard
  maxTemp: 240
  reactants:
    Desoxyephedrine:
      amount: 5
    Acetone:
      amount: 1
      catalyst: true
  effects:
  - !type:WFCreateGradedEntity
    entity: WFCrystalShard

- type: wfReactionPurity
  id: WFCrystalShard
  optimalTemp: 220
  tolerance: 25
  drift: 8

