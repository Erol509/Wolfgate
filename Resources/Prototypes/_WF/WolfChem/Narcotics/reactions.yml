# Cutting: flour stretches a powder a unit for a unit, and the grade drops to match, so the batch holds the same drug
# in more doses. Only a tester, an analyzer or the buyer's nose tells.
- type: reaction
  id: WFCutCocaine
  reactants:
    WFCocaine:
      amount: 1
    Flour:
      amount: 1
  products:
    WFCocaine: 2

- type: wfReactionPurity
  id: WFCutCocaine
  fillers: [ Flour ]

- type: reaction
  id: WFCutHeroin
  reactants:
    WFHeroin:
      amount: 1
    Flour:
      amount: 1
  products:
    WFHeroin: 2

- type: wfReactionPurity
  id: WFCutHeroin
  fillers: [ Flour ]
