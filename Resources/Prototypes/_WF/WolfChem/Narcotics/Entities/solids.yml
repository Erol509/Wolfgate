# Solid drugs. Each keeps its solution's grade, is a narcotic at the market (WFNarcoticMarks), and can be ground
# back down.

- type: entity
  abstract: true
  parent: [ BaseItem, WFNarcoticMarks ]
  id: WFBaseDrugSolid
  components:
  - type: Item
    size: Tiny
  - type: Food
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Extractable
    grindableSolutionName: food
  - type: ExaminableSolution
    solution: food
  # Fits pipe and bong bowls, and baggies.
  - type: Tag
    tags:
    - Smokable
    - WFNarcotic
    - WFBaggable

- type: entity
  parent: WFBaseDrugSolid
  id: WFCrackRock
  components:
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Objects/solids.rsi
    state: crack
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: WFCrack
          Quantity: 5

- type: entity
  parent: WFBaseDrugSolid
  id: WFCrystalShard
  components:
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Objects/solids.rsi
    state: crystal
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Desoxyephedrine
          Quantity: 5

- type: entity
  parent: WFBaseDrugSolid
  id: WFOpiumResin
  components:
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Objects/solids.rsi
    state: resin
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: WFOpium
          Quantity: 5

- type: entity
  parent: WFBaseDrugSolid
  id: WFHashBrick
  components:
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Objects/solids.rsi
    state: hash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: THC
          Quantity: 30
  - type: Construction
    graph: WFHash
    node: brick
  # THC carries no price of its own.
  - type: StaticPrice
    price: 450

# Baggies. Craft an empty one from plastic, pour powder in from a beaker or put solid drugs in; filled ones are dealer
# stock.
- type: entity
  parent: BaseStorageItem
  id: WFBaggie
  components:
  - type: Item
    size: Tiny
  # The powder inside takes the colour of what was poured in.
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Objects/baggie.rsi
    layers:
    - state: icon
    - state: solid-0
      map: [ "enum.StorageFillLayers.Fill" ]
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: fill-
  # Solids go in with a click and come out one at a time on use (WFBaggieSystem); the window stays on the verb.
  - type: Storage
    grid:
    - 0,0,1,1
    maxItemSize: Small
    openOnActivate: false
    whitelist:
      tags:
      - WFBaggable
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: solid
  - type: SolutionContainerManager
    solutions:
      baggie:
        maxVol: 10
  - type: RefillableSolution
    solution: baggie
  - type: DrainableSolution
    solution: baggie
  - type: ExaminableSolution
    solution: baggie
  # Examine lists the solids; the held baggie shows its powder here.
  - type: SolutionItemStatus
    solution: baggie
  - type: SolutionTransfer
    transferAmount: 5
  - type: Construction
    graph: WFBaggie
    node: baggie
    minTransferAmount: 1
    maxTransferAmount: 10
  - type: Extractable
    grindableSolutionName: baggie
  - type: WFBaggie
    reagents:
    - WFCocaine
    - WFHeroin
    - Desoxyephedrine
    - Ephedrine

- type: entity
  parent: [ WFBaggie, WFNarcoticMarks ]
  id: WFBaggieCocaine
  components:
  - type: SolutionContainerManager
    solutions:
      baggie:
        maxVol: 10
        reagents:
        - ReagentId: WFCocaine
          Quantity: 10
  - type: Tag
    tags:
    - WFNarcotic

- type: entity
  parent: [ WFBaggie, WFNarcoticMarks ]
  id: WFBaggieHeroin
  components:
  - type: SolutionContainerManager
    solutions:
      baggie:
        maxVol: 10
        reagents:
        - ReagentId: WFHeroin
          Quantity: 10
  - type: Tag
    tags:
    - WFNarcotic
