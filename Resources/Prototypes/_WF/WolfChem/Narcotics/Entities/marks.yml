# What makes a thing a narcotic at the market: Class 3 contraband, and a sale that moves money to the black market
# and tips off security. The ready-made products inherit it, and WFNarcoticGoodsSystem copies it onto any item that
# holds a street drug and onto a blank stick that takes a copy. Each also carries the WFNarcotic tag.
- type: entity
  id: WFNarcoticMarks
  categories: [ HideSpawnMenu ]
  components:
  - type: Contraband
    severity: Class3Chem
    turnInValues:
      FederationMilitaryCredit: 5
  - type: ItemTax
    taxAccounts:
      Medical: -0.05
      nfsd: -0.1
      BlackMarket: 0.25
  - type: SoldAlert
    groupId: WFNarcotics
    maxPerSale: 100
    channels:
    - Security
