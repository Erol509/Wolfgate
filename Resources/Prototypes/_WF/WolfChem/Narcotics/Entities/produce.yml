# Drug crops. Seeds come from the exotic seeds crate and dealers, never the public seed vendor.

- type: seed
  id: WFCoca
  name: wf-seeds-coca-name
  noun: seeds-noun-seeds
  displayName: wf-seeds-coca-display-name
  plantRsi: _WF/WolfChem/Narcotics/Hydroponics/coca.rsi
  packetPrototype: WFCocaSeeds
  productPrototypes:
  - WFLeavesCoca
  harvestRepeat: Repeat
  lifespan: 60
  maturation: 9
  production: 10
  yield: 2
  potency: 20
  growthStages: 3
  waterConsumption: 0.5
  idealLight: 9
  idealHeat: 300
  chemicals:
    WFCocaAlkaloid:
      Min: 1
      Max: 10
      PotencyDivisor: 10

- type: entity
  parent: SeedBase
  id: WFCocaSeeds
  components:
  - type: Seed
    seedId: WFCoca
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Hydroponics/coca.rsi

- type: entity
  parent: ProduceBase
  id: WFLeavesCoca
  components:
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Hydroponics/coca.rsi
  - type: Produce
    seedId: WFCoca
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: WFCocaAlkaloid
          Quantity: 10
  - type: WFProducePurity

- type: seed
  id: WFOpiumPoppy
  name: wf-seeds-opium-poppy-name
  noun: seeds-noun-seeds
  displayName: wf-seeds-opium-poppy-display-name
  plantRsi: _WF/WolfChem/Narcotics/Hydroponics/opium_poppy.rsi
  packetPrototype: WFOpiumPoppySeeds
  productPrototypes:
  - WFOpiumPoppyPod
  lifespan: 30
  maturation: 12
  production: 4
  yield: 2
  potency: 15
  growthStages: 3
  waterConsumption: 0.6
  chemicals:
    WFOpium:
      Min: 2
      Max: 10
      PotencyDivisor: 10

- type: entity
  parent: SeedBase
  id: WFOpiumPoppySeeds
  components:
  - type: Seed
    seedId: WFOpiumPoppy
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Hydroponics/opium_poppy.rsi

# The pod holds opium; grind it, chill the opium and add water to set it into resin.
- type: entity
  parent: FoodProduceBase
  id: WFOpiumPoppyPod
  components:
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Hydroponics/opium_poppy.rsi
  - type: FlavorProfile
    flavors:
    - bitter
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: WFOpium
          Quantity: 6
  - type: Produce
    seedId: WFOpiumPoppy
  - type: WFProducePurity
