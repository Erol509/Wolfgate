# Small sealable vials for the liquid drugs. Crafted empty from glass and left open to fill; a sealed one won't pour,
# spill or let anyone drink from it, though a syringe still draws through the cap.

- type: entity
  parent: BaseChemistryEmptyVial
  id: WFVial
  components:
  - type: Sprite
    sprite: _WF/WolfChem/Narcotics/Objects/vial.rsi
    layers:
    - state: icon_open
      map: [ "enum.OpenableVisuals.Layer" ]
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: { state: icon_open }
          False: { state: icon }
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
    # The sprite has no in-hand fill states.
    inHandsMaxFillLevels: 0
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 10
  - type: SolutionTransfer
    maxTransferAmount: 10
  - type: Construction
    graph: WFVial
    node: vial
  - type: Openable
    opened: true
    closeable: true
    sound:
      collection: bottleOpenSounds
    closeSound:
      collection: bottleCloseSounds

# Prefilled: sealed, full grade, a narcotic at the market like the other street drugs.
- type: entity
  abstract: true
  parent: [ WFVial, WFNarcoticMarks ]
  id: WFVialNarcoticBase
  components:
  - type: Openable
    opened: false
  - type: Tag
    tags:
    - CentrifugeCompatible
    - WFNarcotic

- type: entity
  parent: WFVialNarcoticBase
  id: WFVialRedline
  suffix: Redline
  components:
  - type: Label
    currentLabel: wf-reagent-name-redline
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 10
        reagents:
        - ReagentId: WFRedline
          Quantity: 10

