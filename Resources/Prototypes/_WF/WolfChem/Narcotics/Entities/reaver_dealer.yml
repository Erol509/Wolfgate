# The Reaver dealer: full-grade product, seeds, kit and pristine sticks at twice their appraisal, out of a Reaver
# runner's hold. He can be killed and the stock runs out. He sells only; nothing on the counter pays the bill.
- type: vendingMachineInventory
  id: WFReaverDealerInventory
  startingInventory:
    WFBaggieCocaine: 12
    WFBaggieHeroin: 12
    WFCrackRock: 16
    WFCrystalShard: 16
    WFOpiumResin: 12
    WFHashBrick: 6
    Joint: 12
    WFVialRedline: 6
    WFVialAnvil: 6
    WFVialHalo: 6
    WFCocaSeeds: 8
    WFOpiumPoppySeeds: 8
    WFBaggie: 20
    WFVial: 12
    WFBongFilled: 4
    WFPurityTester: 3
    WFNeurowareStick: 12
    WFNeurowareStickWhiteline: 6
    WFNeurowareStickNullLoop: 6
    WFNeurowareStickBurst: 6
    WFNeurowareStickRedline: 4
    WFNeurowareStickDamper: 4
    WFNeurowareStickChoir: 4
    WFNeurowareStickHalo: 4
    WFNeurowareStickIdle: 6

- type: entity
  id: WFReaverDealerStock
  parent: VendingMachineAmmo
  categories: [ HideSpawnMenu ]
  components:
  - type: VendingMachine
    pack: WFReaverDealerInventory
    requiresCash: true
  - type: MarketModifier
    mod: 2

- type: startingGear
  id: WFReaverDealerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    outerClothing: ClothingOuterCoatPirate
    head: ClothingHeadBandRed
    eyes: ClothingEyesEyepatch
    mask: ClothingMaskNeckGaiter
    shoes: ClothingShoesBootsJack
    gloves: ClothingHandsGlovesFingerless

- type: traderDialogue
  id: WFReaverDealerDialogue
  greeting: wf-reaver-dealer-greeting
  farewell: wf-reaver-dealer-farewell
  options:
  - prompt: wf-reaver-dealer-prompt-shop
    response: wf-reaver-dealer-response-shop
    action: OpenShop
  - prompt: wf-reaver-dealer-prompt-who
    response: wf-reaver-dealer-response-who

- type: entity
  id: WFReaverDealer
  parent: WFTraderWanderer
  name: Reaver dealer
  description: Sells clean product off an Ashfall runner. The red band says who he flies for.
  suffix: Trader, Narcotics
  components:
  - type: PirateAccent
  - type: Loadout
    prototypes: [ WFReaverDealerGear ]
  - type: Trader
    dialogue: WFReaverDealerDialogue
    killable: true
  - type: TraderShop
    vendors: [ WFReaverDealerStock ]
    randomStock: 18
    stockMin: 3
    stockMax: 12
    lootItems: 5
