# Drug profiles. Level is in effective units (units x grade x perUnit). The first tier is the light phase, the last
# the overdose, and any between are heavy; the screen look and a popup mark each step.
# A street drug's level follows the units in the blood (its reagent has a WFDose), so the reagent's
# metabolismRate sets how long the high lasts, and overdoseHalfLife flushes the blood above the overdose tier faster.
# Level fed directly, by a neuroware program, decays by decay, which matches the reagent's metabolismRate so the twin
# lasts as long as the drug.
# rushGain is the peak of a fresh dose: extra level per level added to the blood, halving every rushHalfLife (45 s),
# so one line hits heavy for a moment and settles. It never reaches the overdose tier; only the blood does.
# Numbers are starting values to tune in playtests.

# Cocaine: a short social stimulant.
- type: wfDrugProfile
  id: WFCocaine
  family: Stimulant
  decay: 0.01
  rushGain: 3
  overdoseHalfLife: 120
  dependenceGain: 0.015
  tiers:
  - min: 1
    speed: 1.1
    overlay: 0.35
    effects:
    - !type:TakeStaminaDamage
      amount: -2
    - !type:WolfmedPainRelief
      tier: Weak
      strength: 10
      identifier: WFCocaine
    - !type:PopupMessage
      probability: 0.05
      messages: [ wf-drug-popup-cocaine-1, wf-drug-popup-cocaine-2, wf-drug-popup-cocaine-3 ]
  - min: 8
    speed: 1.1
    overlay: 0.6
    effects:
    - !type:TakeStaminaDamage
      amount: -2
    - !type:WolfmedPainRelief
      tier: Weak
      strength: 10
      identifier: WFCocaine
    - !type:PopupMessage
      probability: 0.08
      visualType: SmallCaution
      messages: [ wf-drug-popup-anxious-1, wf-drug-popup-anxious-2 ]
  - min: 16
    overlay: 0.9
    effects:
    # A fine, fast tremor: the engine's smallest jitter.
    - !type:Jitter
      amplitude: 1
      frequency: 10
    - !type:WFStrainHeart
      amount: 0.1
    - !type:HealthChange
      damage:
        types:
          Asphyxiation: 1
  crash:
    after: 30
    duration: 45
    perSecondAbove: 0.25
    speed: 0.9
    statusEffects:
    - key: Drowsiness
      component: Drowsiness
    effects:
    - !type:TakeStaminaDamage
      amount: 1
  neuroware:
    program: wf-neuroware-whiteline
    banner: wf-neuroware-whiteline-banner
    faults: [ wf-neuroware-whiteline-fault-1, wf-neuroware-whiteline-fault-2 ]

