      probability: 0.05
      key: Pacified
      component: Pacified
      time: 5
  neuroware:
    program: wf-neuroware-choir
    banner: wf-neuroware-choir-banner
    faults: [ wf-neuroware-choir-fault-1, wf-neuroware-choir-fault-2 ]

