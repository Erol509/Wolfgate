# Heroin: the hard downer. Its sedation sits on the reagent, since it follows the units in the blood; the relief and
# the nod are on the profile, so they last the whole high. Only the overdose puts you to sleep.
- type: wfDrugProfile
  id: WFHeroin
  family: Opioid
  decay: 0.01
  rushGain: 3
  overdoseHalfLife: 120
  dependenceGain: 0.03
  tiers:
  - min: 1
    speed: 0.85
    overlay: 0.5
    effects:
    - !type:WolfmedPainRelief
      tier: Strong
      strength: 70
      identifier: WFHeroinHigh
    - !type:PopupMessage
      probability: 0.05
      messages: [ wf-drug-popup-euphoria-1, wf-drug-popup-euphoria-2, wf-drug-popup-euphoria-3 ]
  - min: 8
    speed: 0.75
    overlay: 0.75
    effects:
    - !type:WolfmedPainRelief
      tier: Strong
      strength: 70
      identifier: WFHeroinHigh
  - min: 14
    speed: 0.7
    overlay: 1
    statusEffects:
    - key: Drowsiness
      component: Drowsiness
    effects:
    - !type:WolfmedPainRelief
      tier: Strong
      strength: 70
      identifier: WFHeroinHigh
    - !type:GenericStatusEffect
      probability: 0.15
      key: ForcedSleep
      component: ForcedSleeping
      time: 4
    - !type:HealthChange
      damage:
        types:
          Asphyxiation: 1
  crash:
    after: 30
    duration: 90
    perSecondAbove: 0.3
    speed: 0.9
    effects:
    - !type:TakeStaminaDamage
      amount: 1
    - !type:PopupMessage
      probability: 0.04
      messages: [ wf-drug-popup-comedown-1, wf-drug-popup-comedown-2 ]
  neuroware:
    program: wf-neuroware-null-loop
    banner: wf-neuroware-null-loop-banner
    faults: [ wf-neuroware-null-loop-fault-1, wf-neuroware-null-loop-fault-2 ]

# Crystal: the speed and the heavy dose's stun, stamina-crit and slowdown resistance are here, so tolerance blunts
# them and the Burst twin has them; Desoxyephedrine keeps its damage, jitter and pain relief. Meth clears at 0.01
# (the heart removes one group's amount), so a 5 u shard lasts about eight minutes.
- type: wfDrugProfile
  id: WFCrystal
  family: Stimulant
  decay: 0.01
  overdoseHalfLife: 120
  dependenceGain: 0.02
  tiers:
  - min: 1
    speed: 1.25
    overlay: 0.4
  - min: 8
    speed: 1.25
    overlay: 0.6
    traits: [ StunResistance, StaminaCritResistance, IgnoreDamageSlowdown ]
  - min: 15
    speed: 1.25
    overlay: 0.8
    traits: [ StunResistance, StaminaCritResistance, IgnoreDamageSlowdown ]
  crash:
    after: 60
    duration: 120
    perSecondAbove: 0.5
    speed: 0.8
    overlay: 0.7
    statusEffects:
    - key: Drowsiness
      component: Drowsiness
    effects:
    - !type:TakeStaminaDamage
      amount: 2
  neuroware:
    program: wf-neuroware-burst
    banner: wf-neuroware-burst-banner
    faults: [ wf-neuroware-burst-fault-1, wf-neuroware-burst-fault-2 ]

# Redline: offence. A light dose gives part of the speed; the full speed and stun resistance need a heavy one. Every
# second high strains the heart, and when it ends the body collapses for a minute plus half the time spent high.
- type: wfDrugProfile
  id: WFRedline
  family: Combat
  decay: 0.02
  overdoseHalfLife: 120
  dependenceGain: 0.02
  tiers:
  - min: 1
    speed: 1.15
    overlay: 0.6
    traits: [ IgnoreDamageSlowdown ]
    effects:
    - !type:WolfmedPainRelief
      tier: Stimulant
      identifier: WFRedline
    - !type:WolfmedPainRelief
      tier: Weak
      strength: 60
      identifier: WFRedlineRelief
    - !type:WFStrainHeart
      amount: 0.02
    - !type:Jitter
      amplitude: 3
  - min: 7
    speed: 1.3
    overlay: 0.75
    traits: [ StunResistance, IgnoreDamageSlowdown ]
    effects:
    - !type:WolfmedPainRelief
      tier: Stimulant
      identifier: WFRedline
    - !type:WolfmedPainRelief
      tier: Weak
      strength: 60
      identifier: WFRedlineRelief
    - !type:WFStrainHeart
      amount: 0.05
    - !type:Jitter
      amplitude: 5
  - min: 12
    speed: 1.3
    overlay: 0.9
    traits: [ StunResistance, IgnoreDamageSlowdown ]
    effects:
    - !type:WolfmedPainRelief
      tier: Stimulant
      identifier: WFRedline
    - !type:WFStrainHeart
      amount: 0.5
    - !type:Jitter
  crash:
    after: 5
    duration: 60
    perSecondAbove: 0.5
    maxDuration: 180
    speed: 0.5
    overlay: 0.8
    effects:
    - !type:TakeStaminaDamage
      amount: 5
  neuroware:
    program: wf-neuroware-redline
    banner: wf-neuroware-redline-banner
    faults: [ wf-neuroware-redline-fault-1, wf-neuroware-redline-fault-2 ]

# Anvil: endurance. It holds off damage and hides the user's own readout; the damage comes back during the crash,
# which grows with the time spent high. Stamina-crit resistance needs a heavy dose.
- type: wfDrugProfile
  id: WFAnvil
  family: Combat
  decay: 0.02
  overdoseHalfLife: 120
  dependenceGain: 0.02
  tiers:
  - min: 1
    speed: 0.85
    overlay: 0.5
    traits: [ Damper, HideDamage ]
    effects:
    - !type:WolfmedPainRelief
      tier: Stimulant
      identifier: WFAnvil
  - min: 7
    speed: 0.85
    overlay: 0.7
    traits: [ Damper, StaminaCritResistance, HideDamage ]
    effects:
    - !type:WolfmedPainRelief
      tier: Stimulant
      identifier: WFAnvil
  - min: 12
    speed: 0.85
    overlay: 0.9
    traits: [ Damper, StaminaCritResistance, HideDamage ]
    effects:
    - !type:WFStrainHeart
      amount: 0.15
    - !type:HealthChange
      damage:
        types:
          Poison: 1
  crash:
    after: 5
    duration: 45
    perSecondAbove: 0.25
    maxDuration: 120
    speed: 0.9
    overlay: 0.6
  neuroware:
    program: wf-neuroware-damper
    banner: wf-neuroware-damper-banner
    faults: [ wf-neuroware-damper-fault-1, wf-neuroware-damper-fault-2 ]

# Chorus: Lattice hallucinations that deepen with the tier, and a sense for exotic matter that reaches further with it.
- type: wfDrugProfile
  id: WFChorus
  family: Psychedelic
  decay: 0.01
  rushGain: 2
  overdoseHalfLife: 120
  dependenceGain: 0.005
  tiers:
  - min: 1
    overlay: 0.4
    hallucinationChance: 0.05
    hallucinations: [ Whisper, Blip, Sound ]
    traits: [ ExoticSense ]
  - min: 6
    overlay: 0.65
    hallucinationChance: 0.08
    hallucinations: [ Whisper, Blip, Sound, Glimpse, Phantom, Echo ]
    traits: [ ExoticSense ]
  - min: 12
    overlay: 0.9
    hallucinationChance: 0.12
