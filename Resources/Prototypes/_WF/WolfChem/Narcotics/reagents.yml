- type: reagent
  id: WFHeroin
  name: wf-reagent-name-heroin
  group: Narcotics
  desc: wf-reagent-desc-heroin
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#c9b79c"
  pricePerUnit: 180
  metabolisms:
    Narcotic:
      metabolismRate: 0.01
      effects:
      - !type:WFDose
        profile: WFHeroin
        perUnit: 1
      # Sedation follows the units in the blood, so the overdose is Wolfmed's sedation airloss and Naloxone reverses
      # it. 0.045 a graded, tolerance-blunted unit puts the airloss threshold (0.6) at level 13.3, just under the
      # overdose tier. The relief itself is on the profile.
      - !type:WFSedation
        profile: WFHeroin
        sedationPerUnit: 0.045

