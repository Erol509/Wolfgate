  announceOnRadio: true
  announcementSender: wf-encounter-sender-traffic
  start: Scheduled
  category: Traffic
  icon: Coins
  cost: 1
  weight: 0.5
  cooldown: 3600
  duration: 3600
  minDistance: 2000
  maxDistance: 3500
  ships:
  - key: trader
    navigation: WFCrewNavigationFreight
    vessel: Scallywag
    retrofit: WFPirateRetrofitGrime
    side: trader
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    captain: false
    deckhands: 0
    guards: 3
    roles: [ WFCrewPilot, WFCrewGunner, WFCrewDeckhand ]
    passengers: [ WFReaverDealer ]
    skill: Veteran
    wander: 4
    wanderRadius: 2500
    wanderPause: 300
