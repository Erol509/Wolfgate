# The deflector: a Sentinel-sized field on a fifth of the power. It slows solid shot instead of stopping it.

- type: entity
  id: WFShieldGeneratorDeflector
  parent: ShieldGeneratorSmall
  name: MD-10 "Parasol" Deflector Generator
  description: A micrometeorite reflector for long hauls with a low power consumption to save costs while providing minimum protection. In a pinch its field can absorb some kinetic damage off incoming projectiles, and still stops missiles and energy fire outright.
  components:
  - type: ShipShieldEmitter
    # Same capacity as the MS-100: the draw limits and the power modifier shrink together.
    baseDraw: 4000
    maxDraw: 12000
    powerModifier: 0.1
    shieldColor: "#FFFFFF"
  - type: WFShipShieldDeflector
    reduction: 0.5
    maxArc: 180
    stopped:
    # Missiles, rockets and anything else with a fuze of its own.
    - ShipMissileBase
    - ShipMissileASM19
    - RocketMk248
    - 280mmRocket
    - WFHackDart
    # Energy bolts.
    - ShipMediumPlasmaProjectile
    - ShipCerberusPlasma
    - ShipAutopulserPlasmaProjectile
    - ShipPlasmaProjectileScylla
    - ShipGlassingBeamPlasmaProjectile
    - ShipM25Projectile
    - ShipRubiconProjectile
    - ShipDymereProjectile
    - ShipNeutronProjectile
    - ShipIonProjectile
    - ShipAntiMatterProjectile
    - MechMediumPlasmaProjectile
    - WFIonDisruptorBolt
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/shield.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#FFFFFF"
  - type: ApcPowerReceiver
    powerLoad: 4000
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#FFFFFF"
  - type: Machine
    board: WFMachineShieldDeflectorCircuitboard

- type: entity
  id: WFMachineShieldDeflectorCircuitboard
  parent: BaseMachineCircuitboard
  name: MD-10 deflector generator board
  description: A machine board for a deflector generator.
  components:
  - type: Sprite
    state: security
  - type: MachineBoard
    prototype: WFShieldGeneratorDeflector
    flatpackable: false
    stackRequirements:
      Glass: 10
      Steel: 10
      Plasma: 15
    tagRequirements:
      ComponentBrickEconomy1:
        amount: 1
        defaultPrototype: ComponentBrickEconomy1
      ElectromagnetEconomy1:
        amount: 2
        defaultPrototype: ElectromagnetEconomy1
      MicroprocessorEconomy1:
        amount: 1
        defaultPrototype: MicroprocessorEconomy1

- type: entity
  parent: BaseFlatpack
  id: WFFlatpackShieldDeflector
  name: MD-10 Parasol deflector generator flatpack
  description: A flatpack used for constructing an MD-10 Parasol deflector generator.
  components:
  - type: Flatpack
    entity: WFShieldGeneratorDeflector
  - type: StaticPrice
    price: 8000
    vendPrice: 30000

# The systems broker's copy, priced off the static price like the rest of its stock.
- type: entity
  parent: WFFlatpackShieldDeflector
  id: WFFlatpackShieldDeflectorBroker
  categories: [ HideSpawnMenu ]
  components:
  - type: StaticPrice
    vendPrice: 0
