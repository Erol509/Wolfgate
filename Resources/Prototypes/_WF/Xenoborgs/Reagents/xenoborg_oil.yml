# Fired in ampoules by the oil gun xenoborg module (wizden#44389), in Mono's reagent effect format.
- type: reagent
  parent: BasePyrotechnic
  id: XenoborgOil
  name: reagent-name-xenoborg-oil
  desc: reagent-desc-xenoborg-oil
  physicalDesc: reagent-physical-desc-oily
  evaporationSpeed: 0.2
  slipData:
    requiredSlipSpeed: 3.5
  flavor: bitter
  flavorMinimum: 0.01
  color: "#3d5cff"
  boilingPoint: -84.7 # Acetylene. Close enough.
  meltingPoint: -80.7
  friction: 0.4
  tileReactions:
  - !type:FlammableTileReaction {}
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:FlammableReaction
        multiplier: 0.2
  metabolisms:
    Food:
      effects:
      - !type:SatiateThirst
        factor: 1
        conditions:
        - !type:OrganType
          type: Vox
    Poison:
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Vox
          shouldHave: false
        damage:
          types:
            Poison: 1
      - !type:FlammableReaction
        multiplier: 0.4
