# Xenoborg modules ported from wizden, on Mono's per-chassis module bases. IDs are wizden's.

# Heavy

- type: entity
  id: XenoborgModuleLaser
  parent: [ BorgModuleXenoborgHeavy, BaseProviderBorgModule, BaseFactionGearOtherFactionT3 ]
  name: laser xenoborg module
  description: Module with a laser gun.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: xenoborg_heavy
    - state: icon-xenoborg-laser
  - type: BorgModuleWhitelist
    whitelistInfo: borg-module-whitelist-primary-weapon
    moduleBlacklist: &primaryWeapon
      tags:
      - XenoborgModulePrimaryWeapon
  - type: ItemBorgModule
    moduleId: Xenoborg_HeavyLaserGun
    items:
    - WeaponLaserGunXenoborg
  - type: BorgModuleIcon
    icon: { sprite: _Mono/Interface/Action/actions_borg.rsi, state: xenoborg-laser-module }
  - type: Tag
    tags:
    - BorgModuleXenoborgHeavy
    - XenoborgModulePrimaryWeapon

- type: entity
  id: XenoborgModuleBurstFireLaser
  parent: [ BorgModuleXenoborgHeavy, BaseProviderBorgModule, BaseFactionGearOtherFactionT3 ]
  name: burst fire laser xenoborg module
