  - type: BorgModuleWhitelist
    whitelistInfo: borg-module-whitelist-primary-weapon
    moduleBlacklist: *primaryWeapon
  - type: ItemBorgModule
    moduleId: Xenoborg_HeavyBurstFireLaser
    items:
    - WeaponBurstFireLaserXenoborg
  - type: BorgModuleIcon
    icon: { sprite: _WF/Xenoborgs/Interface/Actions/actions_borg.rsi, state: xenoborg-laser3-module }
  - type: Tag
    tags:
    - BorgModuleXenoborgHeavy
    - XenoborgModulePrimaryWeapon

- type: entity
  id: XenoborgModuleGuidedMissileLauncher
  parent: [ BorgModuleXenoborgHeavy, BaseProviderBorgModule, BaseFactionGearOtherFactionT3 ]
  name: guided missile launcher xenoborg module
  description: Module with guided missile launcher and a range finder to set targets.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: xenoborg_heavy
    - sprite: _WF/Xenoborgs/Objects/Specific/Robotics/borgmodule.rsi
      state: icon-xenoborg-guided-missile
  - type: BorgModuleWhitelist
    whitelistInfo: borg-module-whitelist-secondary-weapon
    moduleBlacklist: &secondaryWeaponOrOverlay
      tags:
      - XenoborgModuleSecondaryWeapon
      - XenoborgModuleWithSimpleOverlay
  - type: ComponentBorgModule
    components:
    - type: SimpleSpriteOverlay
      overlaySprite:
        sprite: _WF/Xenoborgs/Mobs/Silicon/chassis.rsi
        state: xenoborg_heavy_missile_launcher
  - type: ItemBorgModule
    moduleId: Xenoborg_HeavyGuidedMissile
    items:
    - WeaponGuidedMissileLauncherXenoborg
    - WeaponRangeFinderXenoborg
  - type: BorgModuleIcon
    icon: { sprite: _WF/Xenoborgs/Interface/Actions/actions_borg.rsi, state: xenoborg-guided-missile-module }
  - type: Tag
    tags:
    - BorgModuleXenoborgHeavy
    - XenoborgModuleSecondaryWeapon
    - XenoborgModuleWithSimpleOverlay

- type: entity
  id: XenoborgModuleRocket
  parent: [ BorgModuleXenoborgHeavy, BaseProviderBorgModule, BaseFactionGearOtherFactionT3 ]
  name: rocket xenoborg module
  description: A module with a rocket launcher designed to destroy structures.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: xenoborg_heavy
    - sprite: _WF/Xenoborgs/Objects/Specific/Robotics/borgmodule.rsi
      state: icon-xenoborg-rocket
  - type: BorgModuleWhitelist
    whitelistInfo: borg-module-whitelist-secondary-weapon
    moduleBlacklist: *secondaryWeaponOrOverlay
  - type: ItemBorgModule
    moduleId: Xenoborg_HeavyRocket
    items:
    - WeaponRocketLauncherXenoborg
  - type: BorgModuleIcon
    icon: { sprite: _WF/Xenoborgs/Interface/Actions/actions_borg.rsi, state: xenoborg-rocket-module }
  - type: ComponentBorgModule
    components:
    - type: SimpleSpriteOverlay
      overlaySprite:
        sprite: _WF/Xenoborgs/Mobs/Silicon/rockets.rsi
        state: heavy_xenoborg_rockets
  - type: Tag
    tags:
    - BorgModuleXenoborgHeavy
    - XenoborgModuleSecondaryWeapon
    - XenoborgModuleWithSimpleOverlay

- type: entity
  id: XenoborgModuleHeavyRadioactive
  parent: [ BorgModuleXenoborgHeavy, BaseFactionGearOtherFactionT3 ]
  name: radioactive xenoborg module
  description: Module that causes a xenoborg to emanate radioactive energy.
  components:
  - type: PointLight
    color: green
    radius: 5
    energy: 1
  - type: Sprite
    sprite: _Mono/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: xenoborg_heavy
    - sprite: _WF/Xenoborgs/Objects/Specific/Robotics/borgmodule.rsi
      state: icon-xenoborg-radioactive
  - type: BorgModuleWhitelist
    moduleBlacklist:
      tags:
      - XenoborgModuleWithSimpleOverlay
  - type: ComponentBorgModule
    components:
    - type: SimpleSpriteOverlay
      overlaySprite:
        sprite: _WF/Xenoborgs/Mobs/Silicon/chassis.rsi
        state: xenoborg_heavy_rad
      shader: unshaded
    - type: RadiationSource
      intensity: 4
      slope: 1
    - type: AmbientSound
      range: 6
      volume: -3
      sound:
        path: /Audio/_WF/Xenoborgs/Ambience/Objects/xenoborg_radioactive.ogg
  - type: Tag
    tags:
    - BorgModuleXenoborgHeavy
    - XenoborgModuleWithSimpleOverlay

