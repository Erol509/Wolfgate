- type: entity
  id: XenoborgModuleConstruction
  parent: [ BorgModuleXenoborgEngineer, BaseProviderBorgModule, BaseFactionGearOtherFactionT3 ]
  name: construction xenoborg module
  description: Holds building materials, cables, tiles, boards and flatpacks, with a bag that pulls in materials.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: xenoborg_engi
    - sprite: _WF/Xenoborgs/Objects/Specific/Robotics/borgmodule.rsi
      state: icon-xenoborg-construction
  - type: ItemBorgModule
    moduleId: Xenoborg_EngineerConstruction
    items:
    - XenoborgMaterialBag
  - type: DroppableBorgModule
    moduleId: Xenoborg_EngineerConstruction
    items:
    - id: SheetSteel1
      whitelist:
        tags:
        - Sheet
    - id: CableApcStack10
      whitelist:
        tags:
        - CableCoil
    - id: FloorTileItemXenoborg
      whitelist:
        components:
        - FloorTile
    - id: DoorElectronics
      whitelist:
        components:
        - Circuitboard
    - id: SpaceHeaterFlatpack
      whitelist:
        components:
        - Flatpack
  - type: BorgModuleIcon
    icon: { sprite: _WF/Xenoborgs/Interface/Actions/actions_borg.rsi, state: xenoborg-construction-module }

# Scout

- type: entity
  id: XenoborgModuleJump
  parent: [ BorgModuleXenoborgScout, BaseFactionGearOtherFactionT3 ]
  name: xenoborg jump module
  description: Module that allows a xenoborg to jump forward.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: xenoborg_scout
    - state: icon-xenoborg-jump
  - type: ComponentBorgModule
    components:
    - type: JumpAbility
