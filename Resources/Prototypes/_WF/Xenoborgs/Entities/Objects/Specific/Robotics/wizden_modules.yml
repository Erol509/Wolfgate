  parent: [ BorgModuleXenoborgEngineer, BaseFactionGearOtherFactionT3 ]
  name: zap xenoborg module
  description: Module that disables the grounding of the xenoborg, making them electrified. Shocking!
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: xenoborg_engi
    - sprite: _WF/Xenoborgs/Objects/Specific/Robotics/borgmodule.rsi
      state: icon-xenoborg-zap
  - type: ComponentBorgModule
    components:
    - type: Electrified
      requirePower: false
      shockDamage: 15
      shockDelay: 6
      shockTime: 0.25

