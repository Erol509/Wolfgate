# Pose actions, given to a borg for each pose its skin lists under wfBorgSkin.poses.
- type: entity
  id: WFActionBorgPoseRest
  name: Rest
  description: Settle down where you are. Use it again or move to get up.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/BorgSkins/Actions/poses.rsi
      state: rest
    event: !type:WFBorgPoseActionEvent
      pose: Rest

- type: entity
  id: WFActionBorgPoseSit
  name: Sit
  description: Sit where you are. Use it again or move to get up.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/BorgSkins/Actions/poses.rsi
      state: sit
    event: !type:WFBorgPoseActionEvent
      pose: Sit

- type: entity
  id: WFActionBorgPoseBellyUp
  name: Belly up
  description: Roll onto your back. Use it again or move to get up.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/BorgSkins/Actions/poses.rsi
      state: bellyup
    event: !type:WFBorgPoseActionEvent
      pose: BellyUp
