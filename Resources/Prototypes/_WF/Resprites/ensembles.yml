# Command ensembles from GoobStation's cloak and mantle resprites.

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckEnsembleChiefEngineerWhite
  components:
  - type: Item
    size: Small
    heldPrefix: both
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Sprite
    sprite: _WF/Resprites/Goobstation/Clothing/Neck/Ensembles/ChiefEngineer/whitece.rsi
  - type: Clothing
    sprite: _WF/Resprites/Goobstation/Clothing/Neck/Ensembles/ChiefEngineer/whitece.rsi
    equippedPrefix: both
    slots:
    - Neck
  - type: StealTarget
    stealGroup:
    - HeadCloak
  - type: ItemSwitch
    state: both
    showLabel: true
    states:
      both: !type:ItemSwitchState
        verb: both
        sprite:
          sprite: _WF/Resprites/Goobstation/Clothing/Neck/Ensembles/ChiefEngineer/whitece.rsi
          state: icon
      mantle: !type:ItemSwitchState
        verb: mantle
        sprite:
          sprite: _WF/Resprites/Goobstation/Clothing/Neck/Ensembles/ChiefEngineer/whitece.rsi
          state: mantle-icon
      cloak: !type:ItemSwitchState
        verb: cloak
        sprite:
          sprite: _WF/Resprites/Goobstation/Clothing/Neck/Ensembles/ChiefEngineer/whitece.rsi
          state: cloak-icon

