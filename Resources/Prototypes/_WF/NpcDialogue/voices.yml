# How each encounter faction talks and how readily its beaten ships give up. Matched by the zone lines a ship uses;
# a ship whose lines have no voice here surrenders at 10% and runs when badly hurt.

# Reavers and other raiders: cowards once the odds turn.
- type: wfNpcVoice
  id: WFVoicePirate
  lines: wf-encounter-pirate-zone
  surrender: 0.15

# The Automated Defense System has no directive for surrender, and holds its ground.
- type: wfNpcVoice
  id: WFVoiceAds
  lines: wf-ads-zone
  surrender: 0
  retreats: false

- type: wfNpcVoice
  id: WFVoiceBlackmarket
  lines: wf-encounter-blackmarket-zone
  surrender: 0.25

- type: wfNpcVoice
  id: WFVoiceBlockade
  lines: wf-encounter-blockade-zone
  surrender: 0.1
  retreats: false

- type: wfNpcVoice
  id: WFVoicePdv
  lines: wf-encounter-pdv-zone
  surrender: 0.08

# The Union remnant says it has never surrendered, and nearly means it.
- type: wfNpcVoice
  id: WFVoiceUssp
  lines: wf-encounter-ussp-zone
  surrender: 0.03
  retreats: false

- type: wfNpcVoice
  id: WFVoiceChoir
  lines: wf-remade-choir-zone
  surrender: 0
  retreats: false
