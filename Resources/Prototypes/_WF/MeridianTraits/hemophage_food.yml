# Hemophage cuisine, ported from Meridian Rift: blood dishes a hemophage's tumor keeps down, the Bloodshot cocktail,
# and Taste Suppressor, which stops the tumor rejecting ordinary food for a while.

- type: entity
  parent: FoodInjectableBase
  id: WFFoodHemophageBase
  abstract: true
  components:
  - type: Sprite
    sprite: _WF/MeridianTraits/hemophage_food.rsi
  - type: Item
    size: Small
  - type: Tag
    tags:
    - WFBloodyFood
    - Meat

- type: entity
  parent: WFFoodHemophageBase
  id: WFFoodBloodRiceRaw
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/bowl.rsi
    state: rice
    color: "#810000"
  - type: FlavorProfile
    flavors:
    - rice
    - metallic
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Blood
          Quantity: 10

- type: entity
  parent: WFFoodHemophageBase
  id: WFFoodBloodRicePearl
  components:
  - type: Sprite
    state: blood_rice_pearl
  - type: FlavorProfile
    flavors:
    - rice
    - metallic
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Blood
          Quantity: 10
        - ReagentId: Flavorol
          Quantity: 4

- type: entity
  parent: WFFoodHemophageBase
  id: WFFoodBloodNoodles
  components:
  - type: Sprite
    state: bloodles
  - type: FlavorProfile
    flavors:
    - metallic
    - pasta
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Blood
          Quantity: 20
        - ReagentId: Flavorol
          Quantity: 4

- type: entity
  parent: WFFoodHemophageBase
  id: WFFoodBoatNoodles
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
    state: meatball
    color: "#d10000"
  - type: FlavorProfile
    flavors:
    - metallic
    - WFCongealedBlood
    - pasta
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 80
        reagents:
        - ReagentId: Protein
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 10
        - ReagentId: Blood
          Quantity: 50
        - ReagentId: Flavorol
          Quantity: 10

- type: entity
  parent: WFFoodHemophageBase
  id: WFFoodBloodCurd
  components:
  - type: Sprite
    state: blood_curd
  - type: FlavorProfile
    flavors:
    - WFCongealedBlood
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Protein
          Quantity: 5
        - ReagentId: Blood
          Quantity: 15

- type: entity
  parent: WFFoodHemophageBase
  id: WFFoodBloodCake
  components:
  - type: Sprite
    state: blood_cake
  - type: FlavorProfile
    flavors:
    - metallic
    - rice
    - nutty
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: Blood
          Quantity: 25
        - ReagentId: Flavorol
          Quantity: 8

- type: entity
  parent: FoodBowlBase
  id: WFFoodBloodSoup
  components:
  - type: Sprite
    sprite: _WF/MeridianTraits/hemophage_food.rsi
    layers:
    - state: blood_soup
  - type: FlavorProfile
    flavors:
    - metallic
    - WFCongealedBlood
    - spicy
    - sour
    - garlic
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 90
        reagents:
        - ReagentId: Protein
          Quantity: 10
        - ReagentId: Blood
          Quantity: 60
        - ReagentId: Flavorol
          Quantity: 12
  - type: Tag
    tags:
    - WFBloodyFood
    - Soup

- type: flavor
  id: WFCongealedBlood
  flavorType: Complex
  description: wf-flavor-complex-congealed-blood

- type: flavor
  id: WFBloodshot
  flavorType: Complex
  description: wf-flavor-complex-bloodshot

- type: flavor
  id: WFBloodshotBase
  flavorType: Complex
  description: wf-flavor-complex-bloodshot-base

# Reagents

- type: reagent
  id: WFBloodshotBase
  name: reagent-name-wf-bloodshot-base
  parent: BaseAlcohol
  desc: reagent-desc-wf-bloodshot-base
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: WFBloodshotBase
  color: "#c29ca1"
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.07

- type: reagent
  id: WFBloodshot
  name: reagent-name-wf-bloodshot
  parent: BaseAlcohol
  desc: reagent-desc-wf-bloodshot
  physicalDesc: reagent-physical-desc-ferrous
  flavor: WFBloodshot
  color: "#a30000"
  metamorphicSprite:
    sprite: _WF/MeridianTraits/bloodshot_glass.rsi
    state: icon
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.06
      - !type:ModifyBloodLevel
        amount: 1.8

- type: reagent
  id: WFTasteSuppressor
  name: reagent-name-wf-taste-suppressor
  group: Medicine
  desc: reagent-desc-wf-taste-suppressor
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#c8c8c8"
  metabolisms:
    Medicine:
      metabolismRate: 0.25
      effects:
      - !type:WFSuppressTaste

# Reactions

- type: reaction
  id: WFBloodshotBase
  requiredMixerCategories:
  - Stir
  reactants:
    BloodyMary:
      amount: 1
    Sugar:
      amount: 1
  products:
    WFBloodshotBase: 2

- type: reaction
  id: WFBloodshot
  requiredMixerCategories:
  - Stir
  reactants:
    Blood:
      amount: 3
    WFBloodshotBase:
      amount: 2
  products:
    WFBloodshot: 5

- type: reaction
  id: WFTasteSuppressor
  reactants:
    Sodium:
      amount: 1
    Sulfur:
      amount: 1
    Water:
      amount: 1
  products:
    WFTasteSuppressor: 3

- type: reaction
  id: WFTasteSuppressorSalt
  minTemp: 300
  reactants:
    Sulfur:
      amount: 1
    TableSalt:
      amount: 1
  products:
    WFTasteSuppressor: 3
    Chlorine: 1

- type: reaction
  id: WFUncookedBloodRice
  impact: Low
  quantized: true
  conserveEnergy: false
  reactants:
    Rice:
      amount: 10
    Blood:
      amount: 20
  effects:
  - !type:CreateEntityReactionEffect
    entity: WFFoodBloodRiceRaw

# Recipes

- type: microwaveMealRecipe
  id: WFRecipeBloodRicePearl
  name: wf-recipe-blood-rice-pearl
  result: WFFoodBloodRicePearl
  time: 5
  group: Savory
  solids:
    WFFoodBloodRiceRaw: 1
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WFRecipeBloodCurd
  name: wf-recipe-blood-curd
  result: WFFoodBloodCurd
  time: 5
  group: Savory
  reagents:
    Blood: 20
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WFRecipeBloodNoodles
  name: wf-recipe-blood-noodles
  result: WFFoodBloodNoodles
  time: 5
  group: Pasta
  solids:
    FoodNoodlesBoiled: 1
  reagents:
    Blood: 20
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WFRecipeBoatNoodles
  name: wf-recipe-boat-noodles
  result: WFFoodBoatNoodles
  time: 10
  group: Pasta
  solids:
    WFFoodBloodNoodles: 1
    WFFoodBloodCurd: 1
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WFRecipeBloodCake
  name: wf-recipe-blood-cake
  result: WFFoodBloodCake
  time: 10
  group: Dessert
  solids:
    FoodRiceBoiled: 1
  reagents:
    Blood: 20
    Sugar: 5
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: WFRecipeBloodSoup
  name: wf-recipe-blood-soup
  result: WFFoodBloodSoup
  time: 15
  group: Soup
  solids:
    FoodBowlBig: 1
    WFFoodBloodCurd: 1
    FoodChiliPepper: 1
    FoodGarlic: 1
  reagents:
    Blood: 20
    Vinegar: 10
  recipeType:
  - Oven
  - Microwave
