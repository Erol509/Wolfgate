# A counter post: the roster stands the named trader here, facing the way the marker faces (the counter table).
- type: entity
  abstract: true
  parent: MarkerBase
  id: WFShipCounterPostBase
  categories: [ HideSpawnMenu ]
  description: A commanded ship's counter. The roster stands its trader here, facing the counter; nothing spawns here on its own.
  components:
  # Its facing is the trader's, so it keeps its rotation (no ForceFixRotations, unlike other markers).
  - type: Tag
    tags: []
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green

# Where restaffed crew come aboard and relieved crew leave: one per ship.
- type: entity
  parent: MarkerBase
  id: WFShipCrewBay
  name: crew bay
  description: A commanded ship's crew bay. Restaffed crew come aboard here and walk to their posts; relieved crew leave from here.
  components:
  - type: WFShipCrewBay
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
