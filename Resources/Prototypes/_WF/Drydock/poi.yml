# Drydock POI. Loads from gridPath only, so it has no station jobs or bounties.

- type: pointOfInterest
  id: WFDrydock
  parent: BasePOI
  name: 'Anvilhold Drydock'
  minimumDistance: 8000
  maximumDistance: 9500
  spawnGroup: Required
  gridPath: /Maps/_WF/Drydock/drydock.yml
  addComponents:
  - type: IFF
    color: "#E0782A"
  - type: WorldGenDistanceCarver
    distanceThresholds:
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3
  # Has a shuttle console for the dockmaster's hails, but is not a ship: no piloting or FTL.
  - type: PreventPilot
  # Loaded from a bare grid path, it has no station, so the drydocks can't tell it from a ship.
  - type: WFDrydockUnbreakable

# Illegal drydock on Anvilhold's layout: break-only berths and a fence instead of a dockmaster. See chopshop.yml.
- type: pointOfInterest
  id: WFChopShop
  parent: BasePOI
  name: 'Blackanvil Chop-Shop'
  minimumDistance: 11000
  maximumDistance: 13000
  spawnGroup: Required
  gridPath: /Maps/_WF/Drydock/chopshop.yml
  addComponents:
  - type: IFF
    color: "#8E2A1E"
  - type: WorldGenDistanceCarver
    distanceThresholds:
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3
  - type: PreventPilot
  # Loaded from a bare grid path, it has no station, so the drydocks can't tell it from a ship.
  - type: WFDrydockUnbreakable
