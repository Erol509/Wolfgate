# Multitool links between a drydock console and its cranes. A console's berth is its linked cranes.

- type: sourcePort
  id: WFDrydockCraneSender
  name: drydock-port-name-crane-sender
  description: drydock-port-description-crane-sender

- type: sinkPort
  id: WFDrydockCraneReceiver
  name: drydock-port-name-crane-receiver
  description: drydock-port-description-crane-receiver

# Multitool links between a drydock terminal and the berth consoles it works.

- type: sourcePort
  id: WFDrydockBerthSender
  name: drydock-port-name-berth-sender
  description: drydock-port-description-berth-sender

- type: sinkPort
  id: WFDrydockBerthReceiver
  name: drydock-port-name-berth-receiver
  description: drydock-port-description-berth-receiver
