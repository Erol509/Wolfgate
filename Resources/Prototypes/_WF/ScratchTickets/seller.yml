# Scratches-to-Win, who sells scratch tickets in the Caelestinus Central bar lounge.

- type: humanoidProfile
  id: WFScratchTicketSellerProfile
  profile:
    name: Scratches-to-Win
    species: Reptilian
    age: 41
    sex: Male
    gender: Male
    appearance:
      eyeColor: "#E8B923"
      skinColor: "#2E8B57"
      markings:
      - markingId: LizardSnoutRound
        markingColor: [ "#2E8B57" ]
      - markingId: LizardHornsCurled
        markingColor: [ "#E6DCC0", "#E6DCC0" ]
      - markingId: LizardFrillsShort
        markingColor: [ "#D9B54A" ]
      - markingId: LizardTailSmooth
        markingColor: [ "#2E8B57", "#D9B54A", "#2E8B57", "#D9B54A" ]

- type: startingGear
  id: WFScratchTicketSellerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitHawaiRed
    outerClothing: ClothingOuterVest
    neck: ClothingNeckBling
    shoes: ClothingShoesColorBlack

- type: traderDialogue
  id: WFScratchTicketSellerDialogue
  greeting: wf-scratch-seller-greeting
  farewell: wf-scratch-seller-farewell
  options:
  - prompt: wf-scratch-seller-prompt-shop
    response: wf-scratch-seller-response-shop
    action: OpenShop
  - prompt: wf-scratch-seller-prompt-how
    response: wf-scratch-seller-response-how
  - prompt: wf-scratch-seller-prompt-who
    response: wf-scratch-seller-response-who

- type: entity
  id: WFScratchTicketSeller
  parent: WFBaseTrader
  name: Scratches-to-Win
  description: A lizard in a loud shirt with a roll of lottery tickets and one worn-down claw.
  suffix: Trader, Scratch Tickets
  components:
  - type: HumanoidAppearance
    species: Reptilian
    initial: WFScratchTicketSellerProfile
    hideLayersOnEquip:
    - Snout
    - HeadSide
  # Reptilian parts over the human trader base, as in BaseMobReptilian.
  - type: Body
    prototype: Reptilian
    requiredLegs: 2
  - type: Inventory
    speciesId: reptilian
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
  - type: Vocal
    sounds:
      Male: MaleReptilian
      Female: FemaleReptilian
      Unsexed: MaleReptilian
  - type: LizardAccent
  - type: TypingIndicator
    proto: lizard
  - type: Loadout
    prototypes: [ WFScratchTicketSellerGear ]
  - type: Trader
    dialogue: WFScratchTicketSellerDialogue
  - type: TraderShop
    vendors: [ WFScratchTicketStock ]

- type: vendingMachineInventory
  id: WFScratchTicketInventory
  startingInventory:
    WFScratchTicket: 50
    WFScratchTicket10: 20
    WFScratchTicket20: 20
    WFScratchTicketFoundry: 50
    WFScratchTicketFoundry10: 20
    WFScratchTicketFoundry20: 20
    WFScratchTicketTycoon: 50
    WFScratchTicketTycoon10: 20
    WFScratchTicketTycoon20: 20

# Carries the seller's stock list and is never placed. A ticket's vendPrice is what it costs.
- type: entity
  id: WFScratchTicketStock
  parent: VendingMachineAmmo
  categories: [ HideSpawnMenu ]
  components:
  - type: VendingMachine
    pack: WFScratchTicketInventory
    requiresCash: true
