- type: constructionGraph
  id: WFPictureFrameGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity { }
    edges:
    - to: PictureFrameNode
      completed:
      - !type:SnapToGrid { }
      steps:
      - material: WoodPlank
        amount: 1
        doAfter: 1
  - node: PictureFrameNode
    entity: WFPictureFrame
    edges:
    - to: start
      completed:
      - !type:EmptyAllContainers { }
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
      steps:
      - tool: Screwing
        doAfter: 3
    - to: start
      completed:
      - !type:EmptyAllContainers { }
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
      steps:
      - tool: Anchoring
        doAfter: 3

- type: construction
  id: WFPictureFrameConstruction
  name: picture frame
  description: A wooden frame for a photo, hung on a wall.
  graph: WFPictureFrameGraph
  startNode: start
  targetNode: PictureFrameNode
  category: construction-category-misc
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: true
  icon:
    sprite: _WF/Photography/frame.rsi
    state: overlay
