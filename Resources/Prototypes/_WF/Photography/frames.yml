- type: entity
  abstract: true
  parent: BaseSign
  id: WFBasePictureFrame
  components:
  - type: Sprite
    sprite: _WF/Photography/frame.rsi
    layers:
    - state: overlay
      map: ["enum.PhotoVisualLayers.Base"]
    - sprite: _WF/Photography/photo.rsi
      state: photo
      map: ["enum.PhotoVisualLayers.Photo"]
      visible: false
    - sprite: _WF/Photography/photo.rsi
      state: photo
      map: ["enum.PhotoVisualLayers.Thumbnail"]
      visible: false
  - type: PhotoFrame
  - type: ContainerContainer
    containers:
      photo: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.PhotoUiKey.Viewer
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PhotoUiKey.Viewer:
        type: PhotoBoundUserInterface
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: WFBasePictureFrame
  id: WFPictureFrame
  components:
  - type: Construction
    graph: WFPictureFrameGraph
    node: PictureFrameNode

- type: entity
  parent: WFBasePictureFrame
  id: WFPictureFrameShowroom

- type: entity
  parent: WFBasePictureFrame
  id: WFPictureFrameMonkey
  components:
  - type: Sprite
    layers:
    - state: monkey
      map: ["enum.PhotoVisualLayers.Base"]
    - sprite: _WF/Photography/photo.rsi
      state: photo
      map: ["enum.PhotoVisualLayers.Photo"]
      visible: false
    - sprite: _WF/Photography/photo.rsi
      state: photo
      map: ["enum.PhotoVisualLayers.Thumbnail"]
      visible: false
  - type: PhotoFrame
    portraitState: monkey
    portraitName: wf-photo-portrait-monkey-name
    portraitDescription: wf-photo-portrait-monkey-description

