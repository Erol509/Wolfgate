# NPC medics (WFCrewMedicSystem): the paramedic answers the downed and the bleeding aboard and on docked ships, does
# the lifesaving where they lie, patches minor injuries and brings anyone worse to a bed in Medical; the surgeon works
# the beds there without the paramedic's limits. Their supplies never run out. Neither carries a weapon, and neither
# fights unless struck.

- type: entity
  id: WFCrewKitMedic
  categories: [ HideSpawnMenu ]
  components:
  - type: NPCRetaliation
    attackMemoryLength: 60

- type: entity
  parent: [ WFCrewKitMedic, WFMobCrewBase ]
  id: WFMobCrewParamedic
  name: paramedic
  description: First on the scene, with gauze in every pocket.
  components:
  - type: Loadout
    prototypes: [ WFCrewParamedicGear ]

- type: entity
  parent: [ WFCrewKitMedic, WFMobCrewBase ]
  id: WFMobCrewSurgeon
  name: surgeon
  description: Steady hands and a short temper about it.
  components:
  - type: Loadout
    prototypes: [ WFCrewSurgeonGear ]
  # He scrubs in: without this every hand step at a table would poison the patient for unsterile surgery.
  - type: Sanitized

# What a surgeon works from at an operating table, held off the map: a pod's library, triage, tools, tray and
# reservoirs. It never holds a patient, and it says nothing.
- type: entity
  parent: WFMachineAutodoc
  id: WFCrewSurgeonInstruments
  name: surgeon's instruments
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Autodoc
    voice: WFCrewSurgeonSilent
    basePrograms:
    - WFWolfmedAutodocProgramBase
    - WFWolfmedAutodocProgramTransplant
    - WFWolfmedAutodocProgramLimb
    - WFWolfmedAutodocProgramNeuro
    - WFWolfmedAutodocProgramCavity

- type: autodocVoice
  id: WFCrewSurgeonSilent
  lines: {}
  events: {}

- type: startingGear
  id: WFCrewParamedicGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitParamedic
    shoes: ClothingShoesColorWhite
    ears: WFCrewHeadset
    gloves: ClothingHandsGlovesNitrile
    belt: ClothingBeltMedicalFilled

- type: startingGear
  id: WFCrewSurgeonGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitMedicalDoctor
    outerClothing: ClothingOuterCoatLab
    shoes: ClothingShoesColorWhite
    ears: WFCrewHeadset
    gloves: ClothingHandsGlovesNitrile
    neck: ClothingNeckStethoscope

- type: wfCrewRole
  id: WFCrewParamedic
  kit: WFCrewKitMedic
  mob: WFMobCrewParamedic
  duty: Guard
  engagement: WhenAttacked
  title: wf-crew-role-paramedic
  order: 40
  components:
  - type: WFCrewMedic
    rank: Paramedic

- type: wfCrewRole
  id: WFCrewSurgeon
  kit: WFCrewKitMedic
  mob: WFMobCrewSurgeon
  duty: Guard
  engagement: WhenAttacked
  title: wf-crew-role-surgeon
  order: 41
  components:
  - type: WFCrewMedic
    rank: Surgeon
