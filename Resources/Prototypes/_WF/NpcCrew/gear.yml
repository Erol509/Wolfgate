# Crew loadouts. Weapons and ammunition sit in equipment slots and pockets, never in a bag: the crew draws from
# slots. What a crewman carries is what a boarder loots.

- type: startingGear
  id: WFCrewDeckhandGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack
    ears: WFCrewHeadset
    outerClothing: ClothingOuterHardsuitSpatio
    head: ClothingHeadHelmetHardsuitSpatio
    mask: ClothingMaskBreath
    suitstorage: OxygenTankFilled
    belt: WeaponPistolMk58
    pocket1: Magazine45_ACPPistolFMJ
    pocket2: Magazine45_ACPPistolFMJ

- type: startingGear
  id: WFCrewMarineGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack
    ears: WFCrewHeadset
    outerClothing: ClothingOuterHardsuitSpatio
    head: ClothingHeadHelmetHardsuitSpatio
    mask: ClothingMaskBreath
    suitstorage: OxygenTankFilled
    back: WeaponRifleLecter
    belt: WeaponPistolMk58
    pocket1: Magazine68x52mmCaseless
    pocket2: Magazine45_ACPPistolFMJ

- type: startingGear
  id: WFCrewOfficerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlue
    shoes: ClothingShoesColorBlack
    ears: WFCrewHeadset
    outerClothing: ClothingOuterHardsuitSpatio
    head: ClothingHeadHelmetHardsuitSpatio
    mask: ClothingMaskBreath
    suitstorage: OxygenTankFilled
    belt: WeaponPistolMk58
    pocket1: Magazine45_ACPPistolFMJ

- type: entity
  parent: ClothingHeadsetGrey
  id: WFCrewHeadset
  suffix: NPC crew
  components:
  - type: WFCrewRadio
  - type: TelecomExempt
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTraffic
      - WFEncryptionKeyCrewIntercom

# The navies' crews wear their own services' headsets, with the faction channel's key beside the common ones.
- type: entity
  parent: ClothingHeadsetTsfmc
  id: WFCrewHeadsetTsf
  suffix: NPC crew
  components:
  - type: WFCrewRadio
  - type: TelecomExempt
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTraffic
      - EncryptionKeyNfsd
      - WFEncryptionKeyCrewIntercom

- type: entity
  parent: ClothingHeadsetFreelance
  id: WFCrewHeadsetPdv
  suffix: NPC crew
  components:
  - type: WFCrewRadio
  - type: TelecomExempt
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTraffic
      - EncryptionKeyFreelance
      - WFEncryptionKeyCrewIntercom

- type: entity
  parent: ClothingHeadsetUSSP
  id: WFCrewHeadsetUssp
  suffix: NPC crew
  components:
  - type: WFCrewRadio
  - type: TelecomExempt
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTraffic
      - EncryptionKeyUssp
      - WFEncryptionKeyCrewIntercom

# The crews' own channel, for what they tell each other. Short ranged, and no player kit carries its key.
- type: radioChannel
  id: WFCrewIntercom
  name: wf-crew-radio-channel-intercom
  keycode: '6'
  frequency: 1027
  color: "#8a8f7a"
  maxRange: 400

- type: entity
  parent: EncryptionKeyTraffic
  id: WFEncryptionKeyCrewIntercom
  name: crew intercom encryption key
  description: An encryption key for a ship's crew intercom. Good for a few hundred metres.
  components:
  - type: EncryptionKey
    channels:
    - WFCrewIntercom
    defaultChannel: WFCrewIntercom
