# Flight profiles. The crew setup default is deliberately cautious (10 m/s); a ship flown for a purpose picks one of
# these. Thruster power and the engine's speed limit still cap what a hull can actually do.
# Cruise and follow speeds stay at or under 30 m/s: thrust falls off past the shuttle's 20 m/s soft cap
# (ShuttleComponent.BaseMaxLinearVelocity), and a travel order's time budget assumes the hull reaches its cruise speed.

- type: wfCrewNavigation
  id: WFCrewNavigationFreight
  name: wf-crew-navigation-freight
  settings:
    cruiseSpeed: 17
    followSpeed: 19
    loiterSpeed: 10
    circleSpeed: 8
    attackSpeed: 10
    nearTargetSpeed: 5
    maximumTurnRate: 0.25
    thrustMultiplier: 0.8
    angularThrustMultiplier: 0.7
    dockApproachSpeed: 6
    dockCreepSpeed: 2
    undockSpeed: 5

- type: wfCrewNavigation
  id: WFCrewNavigationWarship
  name: wf-crew-navigation-warship
  settings:
    cruiseSpeed: 23
    followSpeed: 26
    loiterSpeed: 14
    circleSpeed: 12
    attackSpeed: 16
    nearTargetSpeed: 6
    maximumTurnRate: 0.4
    thrustMultiplier: 1
    angularThrustMultiplier: 1
    dockApproachSpeed: 9
    dockCreepSpeed: 2.5
    undockSpeed: 7
    attackRange: 300

- type: wfCrewNavigation
  id: WFCrewNavigationRaider
  name: wf-crew-navigation-raider
  settings:
    cruiseSpeed: 27
    followSpeed: 30
    loiterSpeed: 18
    circleSpeed: 14
    attackSpeed: 20
    nearTargetSpeed: 8
    maximumTurnRate: 0.5
    thrustMultiplier: 1
    angularThrustMultiplier: 1
    dockApproachSpeed: 14
    dockCreepSpeed: 3.5
    undockSpeed: 10
    attackRange: 250
