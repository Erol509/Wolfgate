# Flight profiles. The crew setup default is deliberately cautious (10 m/s); a ship flown for a purpose picks one of
# these. Thruster power and the engine's speed limit still cap what a hull can actually do.
# Cruise and follow speeds stay at or under 30 m/s: thrust falls off past the shuttle's 20 m/s soft cap
# (ShuttleComponent.BaseMaxLinearVelocity), and a travel order's time budget assumes the hull reaches its cruise speed.

- type: wfCrewNavigation
  id: WFCrewNavigationFreight
  name: wf-crew-navigation-freight
  settings:
    cruiseSpeed: 17
    followSpeed: 19
    loiterSpeed: 10
    circleSpeed: 8
    attackSpeed: 10
    nearTargetSpeed: 5
    maximumTurnRate: 0.25
    thrustMultiplier: 0.8
    angularThrustMultiplier: 0.7
    dockApproachSpeed: 6
    dockCreepSpeed: 2
    undockSpeed: 5

- type: wfCrewNavigation
  id: WFCrewNavigationWarship
  name: wf-crew-navigation-warship
  settings:
    cruiseSpeed: 23
    followSpeed: 26
    loiterSpeed: 14
    circleSpeed: 12
    attackSpeed: 16
    nearTargetSpeed: 6
    maximumTurnRate: 0.4
    thrustMultiplier: 1
    angularThrustMultiplier: 1
    dockApproachSpeed: 9
    dockCreepSpeed: 2.5
    undockSpeed: 7
    attackRange: 300

# Raiders fly flat out, at the ceiling the travel budgets allow, and the docking run is quick and forgiving, to board a
# ship that is trying to shake them off. The run in is braked along a curve from cruise to the approach speed, so the
# approach speed here is what the last stretch is flown at, and the creep speed what the port is closed at.
- type: wfCrewNavigation
  id: WFCrewNavigationRaider
  name: wf-crew-navigation-raider
  settings:
    cruiseSpeed: 30
    followSpeed: 30
    loiterSpeed: 20
    circleSpeed: 16
    attackSpeed: 30
    nearTargetSpeed: 10
    maximumTurnRate: 0.7
    thrustMultiplier: 1
    angularThrustMultiplier: 1
    dockApproachSpeed: 16
    dockCreepSpeed: 3
    undockSpeed: 14
    dockStandoff: 30
    dockAlignmentRange: 100
    dockCreepRange: 0.4
    dockSettleSpeed: 0.8
    dockSettleTurnRate: 0.12
    dockSettleTimeout: 15
    dockCreepTimeout: 45
    attackRange: 250
