# Mapper-placed crew. Each marker spawns its role at map init and is that crewman's post.

- type: entity
  abstract: true
  parent: MarkerBase
  id: WFCrewSpawnPointBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green

- type: entity
  parent: WFCrewSpawnPointBase
  id: WFCrewSpawnPointDeckhand
  name: crew spawn point (deckhand)
  description: An NPC deckhand spawns here at round start and treats this spot as their post.
  components:
  - type: WFCrewSpawnPoint
    role: WFCrewDeckhand
  - type: Sprite
    layers:
    - state: green
    - state: cargo_tech

- type: entity
  parent: WFCrewSpawnPointBase
  id: WFCrewSpawnPointMarine
  name: crew spawn point (marine)
  description: An NPC marine spawns here at round start and treats this spot as their post.
  components:
  - type: WFCrewSpawnPoint
    role: WFCrewMarine
  - type: Sprite
    layers:
    - state: green
    - state: ertsecurity

- type: entity
  parent: WFCrewSpawnPointBase
  id: WFCrewSpawnPointPilot
  name: crew spawn point (pilot)
  description: An NPC first officer spawns here at round start and treats this spot as their post.
  components:
  - type: WFCrewSpawnPoint
    role: WFCrewPilot
  - type: Sprite
    layers:
    - state: green
    - state: hop

- type: entity
  parent: WFCrewSpawnPointBase
  id: WFCrewSpawnPointRadioOperator
  name: crew spawn point (radio operator)
  description: An NPC radio officer spawns here at round start and treats this spot as their post.
  components:
  - type: WFCrewSpawnPoint
    role: WFCrewRadioOperator
  - type: Sprite
    layers:
    - state: green
    - state: curator

- type: entity
  parent: WFCrewSpawnPointBase
  id: WFCrewSpawnPointCaptain
  name: crew spawn point (captain)
  description: An NPC captain spawns here at round start and treats this spot as their post.
  components:
  - type: WFCrewSpawnPoint
    role: WFCrewCaptain
  - type: Sprite
    layers:
    - state: green
    - state: captain

- type: entity
  parent: WFCrewSpawnPointBase
  id: WFCrewSpawnPointGunner
  components:
  - type: WFCrewSpawnPoint
    role: WFCrewGunner
  - type: Sprite
    layers:
    - state: green
    - state: ertsecurity
