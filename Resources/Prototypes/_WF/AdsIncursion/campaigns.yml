# One ADS campaign per votable storyteller preset. Lists by tier run 0 (dormant) to 5 (overrun). Credits use the Reaver
# grant: its stronghold amount is paid for a node, its patrol amount for a sweep, sentinel, interdictor or picket.

- type: wfAdsCampaign
  id: WFAdsCampaignQuiet
  preset: WFEncounterPresetQuiet
  faction: WFSectorFactionAds
  firstNodeDelay: 70m
  regroupDelay: 45m
  spreadInterval: 25m
  quietMinutes: 15
  deployInterval: 100m
  cellsPerNode: 8
  maxNodes: 2
  supportRange: 2
  sweeps: [ 0, 1, 1, 1, 1, 2 ]
  sweepInterval: 18m
  interdictDwell: 90s
  interdictCooldown: 10m
  interdicts: [ 0, 1, 1, 1, 1, 2 ]
  sentinelInterval: 25m
  maxSentinelsByTier: [ 0, 0, 1, 1, 1, 2 ]
  challengeTier: 2
  challengeInterval: 35m
  challengeDeadline: 10m
  maxChallenges: 1
  maxPickets: 3
  tierThresholds: [ 10, 22, 40, 60, 80 ]
  nodeBounty: [ 150000, 225000, 300000, 375000, 450000, 550000 ]
  sweepBounty: 45000
  interdictorBounty: 70000
  # Each paid attacking ship past the first adds half the bounty, to at most two and a half times it.
  shipBountyScale: 0.5
  maxShipBountyScale: 2.5
  # What more living players on the sector map multiply every bounty by; the highest bracket reached applies.
  population:
  - minPlayers: 25
    bountyScale: 1.15
  - minPlayers: 40
    bountyScale: 1.3
  - minPlayers: 55
    bountyScale: 1.5
  # Each ship that helps also gets a free repair at the Anvilhold Drydock, bound to it, one unused at a time.
  nodeVoucher: WFDrydockRepairVoucher
  sweepVoucher: WFDrydockRepairVoucher
  retakeBounty: [ 16000, 20000, 24000, 28000, 32000, 40000 ]
  credits:
  - entity: FederationMilitaryCredit1
    companies: [ TSF ]
    stronghold: 60
    patrol: 20
  - entity: Doubloon1
    companies: [ PDV, PDVCivilian ]
    stronghold: 60
    patrol: 20
  dreadnought: WFAdsDreadnought
  dreadnoughtDelay: 20m
  dreadnoughtBounty: 1200000
  risingSound:
    path: /Audio/_WF/AdsIncursion/aimalf.ogg
  fallingSound:
    path: /Audio/Misc/notice1.ogg
  capitalSound:
    path: /Audio/Misc/gamma.ogg
  risingColor: "#9B4DFF"
  fallingColor: "#3FB8AF"

