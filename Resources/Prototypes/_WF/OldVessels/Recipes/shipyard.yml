# Faction lathe recipes for the classic ship LPCs, restored from before Monolith#4624. The TSF ones unlock with
# TsfTierThreeVouchers, the Sulak and Remontnik ones with UsspMediumShips, and the Ledokol ones with UsspLedokol.

- type: latheRecipe
  parent: BaseVoucherRecipe
  id: AltairVoucherTSF
  result: ShipVoucherAltair
  completetime: 100
  materials:
    Steel: 40000
    Plasteel: 20000
    Plastic: 30000
    Glass: 10000
    Plasma: 5000
    Plastitanium: 2500 # TSF Balance Pack: halving the price from 4000 -> 2000 so it needs only 4 exotic crates, but gaining a plastitanium requirement
    UraniumFissile: 600
    UraniumDepleted: 2000 # TSF Balance Pack: halving the price from 4000 -> 2000 so it needs only 4 exotic crates, but gaining a plastitanium requirement
    Silver: 10000
    Gold: 5000

