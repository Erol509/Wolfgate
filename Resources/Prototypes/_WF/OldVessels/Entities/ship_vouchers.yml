# Ship LPCs removed upstream by Monolith#4624. The Taser and Balor ones are mapped on the Ravager and Balor, which
# fail to load without them. The single-ship LPCs below cover classic ships at tiers with no general tier voucher;
# their tier labels follow the scorecard placement, not the old one.

- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherTaser
  name: taser LPC
  description: A small card that contains the data for the procurement of a taser class drone.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_fighter
    - state: screen
      color: "#eb0023"
    - state: screen7
      color: "#eb0023"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Custom
    companyName: Colonial
    vessels:
    - Taser
  - type: StaticPrice
    vendPrice: 15000

