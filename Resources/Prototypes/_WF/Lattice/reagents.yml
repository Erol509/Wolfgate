# Lodestar: holds a mind to where it is. Keeps half the Drift a person feels off them while it lasts and clears what a
# Monolith or the Unmooring put in their head, at the cost of a little drowsiness.
- type: reagent
  id: WFLodestar
  name: reagent-name-wf-lodestar
  group: Medicine
  desc: reagent-desc-wf-lodestar
  physicalDesc: reagent-physical-desc-metallic
  flavor: metallic
  color: "#8a7fd6"
  metabolisms:
    Medicine:
      metabolismRate: 0.1
      effects:
      - !type:WFGround
      - !type:GenericStatusEffect
        key: Drowsiness
        component: Drowsiness
        time: 2
        type: Add
        refresh: false
        probability: 0.2

- type: reaction
  id: WFLodestar
  reactants:
    Haloperidol:
      amount: 1
    Silver:
      amount: 1
    Iron:
      amount: 1
  products:
    WFLodestar: 2
