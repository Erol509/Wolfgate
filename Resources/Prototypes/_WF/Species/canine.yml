# Canine. Vulpkanin in every respect except the head, which is the human one so the muzzle is a
# marking you pick rather than art baked into the species. Everything else - torso, limbs, body, names,
# marking budget - is Vulpkanin's (vulpkanin.yml beside this file).
- type: species
  id: WFCanine
  name: species-name-canine
  roundStart: true
  prototype: WFMobCanine
  sprites: WFMobCanineSprites
  defaultSkinTone: "#985629"
  markingLimits: WFMobCanineMarkingLimits
  dollPrototype: WFMobCanineDummy
  skinColoration: Hues
  maleFirstNames: names_vulpkanin_male
  femaleFirstNames: names_vulpkanin_female
  lastNames: names_vulpkanin_last

- type: speciesBaseSprites
  id: WFMobCanineSprites
  sprites:
    Head: WFMobCanineHead # the only difference from Vulpkanin: a snoutless head
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: WFMobVulpkaninTorso
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Genital: MobHumanoidAnyMarking
    Penis: MobHumanoidAnyMarking
    Breasts: MobHumanoidAnyMarking
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    TailBehind: MobHumanoidAnyMarking
    TailOversuit: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: WFMobVulpkaninLArm
    RArm: WFMobVulpkaninRArm
    LHand: WFMobVulpkaninLHand
    RHand: WFMobVulpkaninRHand
    LLeg: WFMobVulpkaninLLegDigi
    RLeg: WFMobVulpkaninRLegDigi
    LFoot: WFMobVulpkaninLFootDigi
    RFoot: WFMobVulpkaninRFootDigi

- type: humanoidBaseSprite
  id: WFMobCanineHead
  baseSprite:
    sprite: _WF/Species/Mobs/Species/Canine/parts.rsi
    state: head_m

- type: humanoidBaseSprite
  id: WFMobCanineHeadMale
  baseSprite:
    sprite: _WF/Species/Mobs/Species/Canine/parts.rsi
    state: head_m

- type: humanoidBaseSprite
  id: WFMobCanineHeadFemale
  baseSprite:
    sprite: _WF/Species/Mobs/Species/Canine/parts.rsi
    state: head_f

- type: markingPoints
  id: WFMobCanineMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Tail:
      points: 1
      required: false
      defaultMarkings: [ FoxTail ]
    Head:
      points: 4
      required: false
    Legs:
      points: 16
      required: false
    Arms:
      points: 16
      required: false
    Snout:
      # Unlike Vulpkanin this is a real slot: the head has no muzzle of its own, so the snout marking is
      # the whole muzzle and swapping it actually changes the face.
      points: 1
      required: true
      defaultMarkings: [ SnoutLCanid ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ FoxEar ]
