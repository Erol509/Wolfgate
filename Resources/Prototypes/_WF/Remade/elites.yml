# Divider and its parts

- type: entity
  parent: WFRemadeBase
  id: WFRemadeDivider
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Remade/Mobs/divider.rsi
    noRot: true
    offset: 0,0.5
    layers:
    - map: [ "l_leg" ]
      state: divider_l_leg
    - map: [ "r_leg" ]
      state: divider_r_leg
    - map: [ "chest" ]
      state: divider_chest
    - map: [ "l_arm" ]
      state: divider_l_arm
    - map: [ "r_arm" ]
      state: divider_r_arm
    - map: [ "head" ]
      state: divider_head
    # What's left lying when the rest has crawled away.
    # Centred on the body: the chest piece sits off to one side of its own image.
    - map: [ "dead" ]
      state: divider_chest
      rotation: 90
      offset: 0.43,-0.5
      visible: false
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WFRemadeDivider
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 250
        mask:
        - MobMask
        layer:
        - MobLayer
  # DS13: speedmod 1.4, and slowdown 3 in 1.0. It's meant to be slow.
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.4
    baseSprintSpeed: 2.4
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 0.6
    animation: WeaponArcClaw
    soundSwing:
      collection: WFRemadeDividerAttack
    soundHit:
      path: /Audio/Weapons/slash.ogg
    damage:
      types:
        Slash: 22
  - type: WFRemadeVoice
    speech:
      collection: WFRemadeDividerShoutLong
    pain:
      collection: WFRemadeDividerPain
    death:
      collection: WFRemadeDividerDeath
    shout:
      collection: WFRemadeDividerShoutLong
  - type: WFDivider
    splitSound:
      collection: WFRemadeDividerSplit
    parts:
      head: WFRemadeDividerHead
      l_arm: WFRemadeDividerArm
      r_arm: WFRemadeDividerArm
      l_leg: WFRemadeDividerLeg
      r_leg: WFRemadeDividerLeg
  # No severed limb drops: each limb that comes off crawls away as a mob.
  - type: WFRemadeLimbs
    rsi: _WF/Remade/Mobs/divider.rsi
    floors: { Melee: 0.2, Speed: 0.2, Sight: 0.4 }
    limbs:
    - id: l_leg
      name: wf-remade-limb-leg-left
      health: 35
      weight: 1.5
      loss: 10
      zones: [ LeftLeg, LeftFoot ]
      provides: { Speed: 0.5 }
    - id: r_leg
      name: wf-remade-limb-leg-right
      health: 35
      weight: 1.5
      loss: 10
      zones: [ RightLeg, RightFoot ]
      provides: { Speed: 0.5 }
    # It has a hole through it, so it's harder to land a bullet on.
    - id: chest
      health: 250
      weight: 3
      scale: 0.5
      severable: false
      zones: [ Torso, Groin ]
    - id: l_arm
      name: wf-remade-limb-arm-left
      health: 35
      weight: 1.5
      loss: 10
      zones: [ LeftArm, LeftHand ]
      provides: { Melee: 0.5 }
    - id: r_arm
      name: wf-remade-limb-arm-right
      health: 35
      weight: 1.5
      loss: 10
      zones: [ RightArm, RightHand ]
      provides: { Melee: 0.5 }
    - id: head
      name: wf-remade-limb-head
      health: 40
      weight: 1
      loss: 15
      zones: [ Head ]
      provides: { Voice: 1, Sight: 1 }
  - type: WFRemadeAbilities
    abilities:
    - !type:WFShoutAbility
      cooldown: 12
      range: 20
      sound:
        collection: WFRemadeDividerShout
    # Swipe.
    - !type:WFSwingAbility
      cooldown: 3.5
      range: 3
      windUp: 0.25
      arc: 130
      reach: 3
      damage:
        types:
          Slash: 20
      sound:
        collection: WFRemadeDividerAttack
      hitSound:
        path: /Audio/Weapons/slash.ogg

