    speech:
      collection: WFRemadeUndyingSpeech
    pain:
      collection: WFRemadeUndyingPain
    death:
      collection: WFRemadeUndyingPain
    shout:
      collection: WFRemadeUndyingShoutLong
  - type: WFUndying
  # DS13: it regenerates 4 a second and nothing keeps it down. Here, damage past its limit or losing every limb folds it up
  # for a minute and it forms again whole.
  - type: WFRegen
    healPerSecond: 4
    heatFactor: 0.5
    limbInterval: 8
    sound:
      collection: WFRemadeUndyingRegen
  - type: WFRises
    riseDelay: 60
    cooldown: 0
    collapseSevered: 5
    riseHealth: 1
    regrow: 99
    # It can't get back up on a powered stasis bed, and fire while it lies there ends it.
    stasisRange: 0.9
    burnDown: 150
    riseSound:
      collection: WFRemadeUndyingRegen
  - type: WFRemadeLimbs
    rsi: _WF/Remade/Mobs/undying.rsi
    floors: { Melee: 0.3, Speed: 0.3, Sight: 0.4 }
    limbs:
    - id: l_leg
      name: wf-remade-limb-leg-left
      health: 100
      weight: 1.5
      loss: 20
      zones: [ LeftLeg, LeftFoot ]
      provides: { Speed: 0.5 }
      lying: l_leg_lying
      regen: l_leg_regen
    - id: r_leg
      name: wf-remade-limb-leg-right
      health: 100
      weight: 1.5
      loss: 20
      zones: [ RightLeg, RightFoot ]
      provides: { Speed: 0.5 }
      lying: r_leg_lying
      regen: r_leg_regen
    - id: chest
      health: 500
      weight: 3
      scale: 0.6
      severable: false
      zones: [ Torso, Groin ]
      lying: torso_lying
    - id: l_arm
      name: wf-remade-limb-arm-left
      health: 80
      weight: 1.5
      loss: 15
      zones: [ LeftArm, LeftHand ]
      provides: { Melee: 0.5 }
      lying: l_arm_lying
      regen: l_arm_regen
    - id: r_arm
      name: wf-remade-limb-arm-right
      health: 80
      weight: 1.5
      loss: 15
      zones: [ RightArm, RightHand ]
      provides: { Melee: 0.5 }
      lying: r_arm_lying
      regen: r_arm_regen
    - id: head
      name: wf-remade-limb-head
      layers: [ head, eyes ]
      health: 100
      weight: 1
      loss: 25
      zones: [ Head ]
      provides: { Voice: 1, Sight: 1 }
      lying: head_lying
      regen: head_regen
  - type: WFRemadeAbilities
    abilities:
    - !type:WFShoutAbility
      cooldown: 12
      range: 20
      sound:
        collection: WFRemadeUndyingShout
    # Lunge: a short stab forward through whatever is in the way, doors included.
    - !type:WFSwingAbility
      cooldown: 5
      range: 4
