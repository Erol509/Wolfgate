# Hunter

- type: entity
  parent: WFRemadeBase
  id: WFRemadeHunter
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Remade/Mobs/hunter.rsi
    noRot: true
    offset: 0,0.5
    layers:
    - map: [ "l_leg" ]
      state: hunter_l_leg
    - map: [ "r_leg" ]
      state: hunter_r_leg
    - map: [ "chest" ]
      state: hunter_chest
    - map: [ "l_arm" ]
      state: hunter_l_arm
    - map: [ "r_arm" ]
      state: hunter_r_arm
    - map: [ "head" ]
      state: hunter_head
    - map: [ "eyes" ]
      state: eyes
      shader: unshaded
    # No dead sprite: the standing one on its back.
    # Lowered so it lies on the floor, not half a tile above it.
    - map: [ "dead" ]
      state: full
      rotation: 90
      offset: 0,-0.3
      visible: false
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WFRemadeHunter
  # No gibbing: the 400 blunt that gibs an animal would end this one for good.
  - type: Destructible
    thresholds: []
  - type: MobThresholds
    thresholds:
      0: Alive
      275: Dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 220
        mask:
        - MobMask
        layer:
        - MobLayer
  # DS13: speedmod 1.6.
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.2
    baseSprintSpeed: 3.2
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 0.8
    animation: WeaponArcClaw
    soundSwing:
      collection: WFRemadeUndyingAttack
    soundHit:
      path: /Audio/Weapons/slash.ogg
    damage:
      types:
        Slash: 28
  - type: FootstepModifier
    footstepSoundCollection:
      collection: WFRemadeUndyingFootstep
  - type: WFRemadeVoice
    speech:
      collection: WFRemadeUndyingSpeech
    pain:
      collection: WFRemadeUndyingPain
    death:
      collection: WFRemadeUndyingPain
    shout:
      collection: WFRemadeUndyingShoutLong
  # DS13-1.0: healing 2 a second, burns at a third of that; false death for 15 seconds, then up with 100 healed and two
  # limbs back, once every two minutes. Fire past half its health, a missing head or most limbs gone, or dying again
  # too soon, keeps it down.
  - type: WFRegen
    healPerSecond: 2
    heatFactor: 0.33
    limbInterval: 20
    sound:
      collection: WFRemadeUndyingRegen
  - type: WFRises
    riseDelay: 15
    cooldown: 120
    burnKill: 0.5
    severedKill: 4
    headKills: true
    riseHealth: 0.55
    regrow: 3
    riseSound:
      collection: WFRemadeUndyingRegen
  - type: WFRemadeLimbs
    rsi: _WF/Remade/Mobs/hunter.rsi
    floors: { Melee: 0.2, Speed: 0.2, Sight: 0.4 }
    limbs:
    - id: l_leg
      name: wf-remade-limb-leg-left
      health: 60
      weight: 1.5
      loss: 20
      zones: [ LeftLeg, LeftFoot ]
      provides: { Speed: 0.5 }
      regen: l_leg_regen
    - id: r_leg
      name: wf-remade-limb-leg-right
      health: 60
      weight: 1.5
      loss: 20
      zones: [ RightLeg, RightFoot ]
      provides: { Speed: 0.5 }
      regen: r_leg_regen
    - id: chest
      health: 250
      weight: 3
      scale: 0.5
      severable: false
      zones: [ Torso, Groin ]
    - id: l_arm
      name: wf-remade-limb-blade-left
      health: 50
      weight: 1.5
      loss: 16
      zones: [ LeftArm, LeftHand ]
      provides: { Melee: 0.5 }
      regen: l_arm_regen
    - id: r_arm
      name: wf-remade-limb-blade-right
      health: 50
      weight: 1.5
      loss: 16
      zones: [ RightArm, RightHand ]
      provides: { Melee: 0.5 }
      regen: r_arm_regen
    - id: head
      name: wf-remade-limb-head
      layers: [ head, eyes ]
      health: 60
      weight: 1
      loss: 35
      zones: [ Head ]
      provides: { Voice: 1, Sight: 1 }
      regen: head_regen
  - type: WFRemadeAbilities
    abilities:
    - !type:WFShoutAbility
      cooldown: 10
      range: 20
      sound:
        collection: WFRemadeUndyingShout
    - !type:WFTauntAbility
      cooldown: 30
      range: 12
      duration: 20
      radius: 10
      selfMultiplier: 0.85
      allyMultiplier: 0.7
      speed: 1.2
      sound:
        collection: WFRemadeUndyingShoutLong
    # Hookblade: a short lunge and a wide swing that pulls everyone in.
    - !type:WFSwingAbility
      cooldown: 6
      range: 5
      windUp: 0.25
      lunge: 2
      lungeSpeed: 8
      arc: 150
      reach: 3
      pull: 2.5
      damage:
        types:
          Slash: 15
      sound:
        collection: WFRemadeUndyingAttack
      hitSound:
        path: /Audio/Weapons/slash.ogg

# Mender: the hunter's body, bleached. It doesn't grow limbs back; down with three off, it drags the severed ones back onto
# itself with tentacles and gets up once whole. Burn a limb, blow it apart, or carry it out of reach and it stays down.

- type: entity
  parent: WFRemadeHunter
  id: WFRemadeMender
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Remade/Mobs/mender.rsi
    noRot: true
    offset: 0,0.5
    layers:
    - map: [ "l_leg" ]
      state: hunter_l_leg
    - map: [ "r_leg" ]
      state: hunter_r_leg
    - map: [ "chest" ]
      state: hunter_chest
    - map: [ "l_arm" ]
      state: hunter_l_arm
    - map: [ "r_arm" ]
      state: hunter_r_arm
    - map: [ "head" ]
      state: hunter_head
    - map: [ "eyes" ]
      state: eyes
      shader: unshaded
    - map: [ "dead" ]
      state: full
      rotation: 90
      offset: 0,-0.3
      visible: false
  # Heals as it walks, but grows nothing back: what comes off has to be dragged back on.
  - type: WFRegen
    healPerSecond: 2
    heatFactor: 0.33
    limbInterval: 100000
  - type: WFRises
