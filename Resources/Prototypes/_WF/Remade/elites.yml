# The elite Remade: brute, twitcher, oracle twitcher, hunter, divider (and its parts), tripod, the Undying and the
# enhanced infector. Health, speed, armour and costs from DS13-2.0's subtypes, the divider, tripod, hunter and Undying
# rules from DS13-1.0. Armour is 1 - the DS percentage, softened where DS13's would make a gun useless.

- type: damageModifierSet
  id: WFRemadeBrute
  coefficients:
    Blunt: 0.65
    Piercing: 0.4
    Slash: 0.55
    Heat: 0.7
    Caustic: 0.2
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

- type: damageModifierSet
  id: WFRemadeTwitcher
  coefficients:
    Blunt: 0.55
    Piercing: 0.45
    Slash: 0.7
    Heat: 1
    Caustic: 0.2
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

- type: damageModifierSet
  id: WFRemadeTwitcherOracle
  coefficients:
    Blunt: 0.5
    Piercing: 0.4
    Slash: 0.65
    Heat: 0.75
    Caustic: 0.05
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

# Blades barely cut the hunter and clubs barely bruise it. Fire is what it fears.
- type: damageModifierSet
  id: WFRemadeHunter
  coefficients:
    Blunt: 0.35
    Piercing: 0.5
    Slash: 0.85
    Heat: 1.3
    Caustic: 0.05
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

- type: damageModifierSet
  id: WFRemadeDivider
  coefficients:
    Blunt: 0.8
    Piercing: 0.75
    Slash: 0.9
    Heat: 1
    Caustic: 0.2
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

- type: damageModifierSet
  id: WFRemadeTripod
  coefficients:
    Blunt: 0.7
    Piercing: 0.65
    Slash: 0.8
    Heat: 1
    Caustic: 0.2
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

# Heat and lasers do little: the Undying is stopped by dismembering it, not by burning it.
- type: damageModifierSet
  id: WFRemadeUndying
  coefficients:
    Blunt: 0.35
    Piercing: 0.5
    Slash: 0.85
    Heat: 0.5
    Caustic: 0
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

# Projectiles and effects

- type: entity
  parent: BaseBullet
  id: WFRemadeBioBomb
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Remade/Effects/projectiles.rsi
    scale: 1.6, 1.6
    layers:
    - state: pukeshot
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Caustic: 14
  - type: Tracer
    color: "#7CA03CFF"
    length: 1.5
  - type: TimedDespawn
    lifetime: 2.5
  - type: WFRemadeProjectile

# The tripod's tongue: segments of a beam that fade after a moment.
- type: entity
  id: WFRemadeTongueBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    color: "#8a2323"
    layers:
    - state: lightning_1
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: Beam
  - type: TimedDespawn
    lifetime: 1

# Brute

- type: entity
  parent: WFRemadeBase
  id: WFRemadeBrute
  components:
  # A brute will go through a wall that is the only way to its prey.
  - type: WFStuckBreaker
    breaksWalls: true
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Remade/Mobs/brute.rsi
    noRot: true
    offset: 0,0.5
    layers:
    - map: [ "l_leg" ]
      state: brute_l_leg
    - map: [ "r_leg" ]
      state: brute_r_leg
    - map: [ "chest" ]
      state: brute_chest
    - map: [ "l_arm" ]
      state: brute_l_arm
    - map: [ "r_arm" ]
      state: brute_r_arm
    - map: [ "head" ]
      state: brute_head
    - map: [ "dead" ]
      state: dead
      visible: false
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WFRemadeBrute
  # No gibbing: the 400 blunt that gibs an animal would end this one for good.
  - type: Destructible
    thresholds: []
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        density: 350
        mask:
        - MobMask
        layer:
        - MobLayer
  # DS13: speedmod 4, with a charge that climbs to about twice that. Slower than a crewman at a run, even charging.
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 0.4
    animation: WeaponArcFist
    soundSwing:
      collection: WFRemadeBruteAttack
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
    damage:
      types:
        Blunt: 26
  - type: FootstepModifier
    footstepSoundCollection:
      collection: WFRemadeBruteStep
  - type: WFRemadeVoice
    speech:
      collection: WFRemadeBruteShout
    pain:
      collection: WFRemadeBrutePain
    death:
      collection: WFRemadeBruteDeath
    shout:
      collection: WFRemadeBruteShoutLong
  - type: WFBruteArmour
  - type: WFFlingOnHit
  - type: WFRemadeLimbs
    rsi: _WF/Remade/Mobs/brute.rsi
    floors: { Melee: 0.25, Speed: 0.2, Sight: 0.4 }
    limbs:
    - id: l_leg
      name: wf-remade-limb-leg-left
      health: 80
      weight: 1.5
      loss: 28
      zones: [ LeftLeg, LeftFoot ]
      provides: { Speed: 0.5, Leap: 0.5 }
      lying: brute_l_leg_lying
    - id: r_leg
      name: wf-remade-limb-leg-right
      health: 80
      weight: 1.5
      loss: 28
      zones: [ RightLeg, RightFoot ]
      provides: { Speed: 0.5, Leap: 0.5 }
      lying: brute_r_leg_lying
    - id: chest
      health: 400
      weight: 3
      scale: 0.35
      severable: false
      zones: [ Torso, Groin ]
      lying: brute_chest_lying
    - id: l_arm
      name: wf-remade-limb-arm-left
      health: 70
      weight: 1.5
      loss: 22
      zones: [ LeftArm, LeftHand ]
      provides: { Melee: 0.5 }
      lying: brute_l_arm_lying
    - id: r_arm
      name: wf-remade-limb-arm-right
      health: 70
      weight: 1.5
      loss: 22
      zones: [ RightArm, RightHand ]
      provides: { Melee: 0.5 }
      lying: brute_r_arm_lying
    - id: head
      name: wf-remade-limb-head
      health: 90
      weight: 1
      loss: 40
      zones: [ Head ]
      provides: { Voice: 1, Sight: 1, Fire: 1 }
      lying: brute_head_lying
  - type: WFRemadeAbilities
    abilities:
    - !type:WFShoutAbility
      cooldown: 10
      range: 20
      sound:
        collection: WFRemadeBruteShoutLong
    # Slam: a long rearing up, then everything around it is flattened.
    - !type:WFSwingAbility
      cooldown: 8
      range: 2.6
      windUp: 2
      arc: 360
      reach: 2.8
      knockdownTime: 3
      structureDamage: 250
      damage:
        types:
          Blunt: 15
      sound:
        collection: WFRemadeBruteShout
      strikeSound:
        collection: MetalThud
      hitSound:
        path: /Audio/Effects/hit_kick.ogg
    # Long charge: builds speed, breaks doors and windows, throws people aside.
    - !type:WFRamAbility
      cooldown: 18
      minRange: 5
      range: 14
      windUp: 1.2
      duration: 5
      topSpeed: 2
      rampTime: 3
      structureDamage: 600
      damage:
        types:
          Blunt: 20
      sound:
        collection: WFRemadeBruteShoutLong
      hitSound:
        path: /Audio/Effects/hit_kick.ogg
      smashSound:
        collection: MetalBreak
    # Bio-bomb: a slow lob of acid from range.
    - !type:WFShootAbility
      cooldown: 12
      minRange: 4
      range: 16
      windUp: 1.25
      projectile: WFRemadeBioBomb
      projectileSpeed: 9
      sound:
        collection: WFRemadeBruteShout
      fireSound:
        collection: WFRemadeBruteAttack

