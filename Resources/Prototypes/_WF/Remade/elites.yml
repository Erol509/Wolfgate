# The Undying

- type: entity
  parent: WFRemadeBase
  id: WFRemadeUndying
  components:
  - type: WFStuckBreaker
    breaksWalls: true
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Remade/Mobs/undying.rsi
    noRot: true
    offset: 0,0.55
    layers:
    - map: [ "l_leg" ]
      state: ubermorph_l_leg
    - map: [ "r_leg" ]
      state: ubermorph_r_leg
    - map: [ "chest" ]
      state: ubermorph_chest
    - map: [ "l_arm" ]
      state: ubermorph_l_arm
    - map: [ "r_arm" ]
      state: ubermorph_r_arm
    - map: [ "head" ]
      state: ubermorph_head
    - map: [ "eyes" ]
      state: eyes
      shader: unshaded
    - map: [ "dead" ]
      state: dead
      visible: false
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WFRemadeUndying
  # No gibbing: the 400 blunt that gibs an animal would end this one for good.
  - type: Destructible
    thresholds: []
  - type: MobThresholds
    thresholds:
      0: Alive
      1200: Dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 220
        mask:
        - MobMask
        layer:
        - MobLayer
  # DS13: speedmod 1.2. It never runs: walking and sprinting are the same.
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.4
    baseSprintSpeed: 3.4
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 0.8
    animation: WeaponArcThrust
    soundSwing:
      collection: WFRemadeUndyingAttack
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    damage:
      types:
        Piercing: 20
  - type: FootstepModifier
    footstepSoundCollection:
      collection: WFRemadeUndyingFootstep
