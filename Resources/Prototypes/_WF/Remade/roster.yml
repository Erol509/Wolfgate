      name: wf-remade-limb-tail-left
      health: 28
      weight: 1.5
      loss: 16
      zones: [ LeftLeg, LeftFoot ]
      provides: { Speed: 0.5, Leap: 0.5 }
      lying: leaper_l_leg_lying
    - id: r_leg
      name: wf-remade-limb-tail-right
