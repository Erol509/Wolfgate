      lying: leaper_r_leg_lying
    - id: chest
      health: 200
      weight: 3
      scale: 0.3
      severable: false
      zones: [ Torso, Groin ]
      lying: leaper_torso_lying
    - id: l_arm
      name: wf-remade-limb-claw-left
      health: 25
      weight: 1.5
      loss: 12
      zones: [ LeftArm, LeftHand ]
      provides: { Melee: 0.5 }
      lying: leaper_l_arm_lying
    - id: r_arm
      name: wf-remade-limb-claw-right
      health: 25
      weight: 1.5
      loss: 12
      zones: [ RightArm, RightHand ]
      provides: { Melee: 0.5 }
      lying: leaper_r_arm_lying
    - id: head
      name: wf-remade-limb-head
      health: 30
      weight: 1
      loss: 30
      zones: [ Head ]
      provides: { Voice: 1, Sight: 1 }
      lying: leaper_head_lying
  - type: WFRemadeAbilities
    abilities:
    - !type:WFShoutAbility
      cooldown: 8
      range: 20
      sound:
        collection: WFRemadeLeaperShout
    - !type:WFTailStabAbility
      cooldown: 9
      windUp: 0.6
      arc: 90
      reach: 1.8
      damage:
        types:
          Slash: 24
      sound:
        collection: WFRemadeLeaperTailswing
      hitSound:
        path: /Audio/Weapons/slash.ogg
    - !type:WFLeapAbility
      cooldown: 14
      minRange: 4
      range: 12
      windUp: 1.2
      # From against a wall: 4 tiles further, a faster crouch, harder landing.
      wallRange: 4
      wallWindUp: 0.6
      wallDamage: 1.25
      speed: 15
      knockdownTime: 2
      damage:
        types:
          Slash: 24
      sound:
        collection: WFRemadeLeaperShoutLong
      hitSound:
        path: /Audio/Effects/hit_kick.ogg

