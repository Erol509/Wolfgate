    altDisarm: false
    angle: 0
    attackRate: 1
    animation: WeaponArcClaw
    soundSwing:
      collection: WFRemadeExploderAttack
    soundHit:
      path: /Audio/Weapons/genhit1.ogg
    damage:
      types:
        Blunt: 6
  - type: FootstepModifier
    footstepSoundCollection:
      collection: WFRemadeExploderFootstep
  - type: WFRemadeVoice
    speech:
      collection: WFRemadeExploderSpeech
    pain:
      collection: WFRemadeExploderPain
    death:
      collection: WFRemadeExploderDeath
    shout:
      collection: WFRemadeExploderShoutLong
  # DS13: dev 0, heavy 2, light 3, flame 2. About a 2.7 tile blast.
  - type: WFRemadeExploder
    pustule: l_arm
    intensity: 80
    slope: 4
    maxIntensity: 12
