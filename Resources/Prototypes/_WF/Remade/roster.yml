# Lurker

- type: entity
  parent: WFRemadeBase
  id: WFRemadeLurker
  components:
  - type: Appearance
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Remade/Mobs/lurker.rsi
    noRot: true
    offset: 0,0.25
    layers:
    - map: [ "chest" ]
      state: lurker_chest
    - map: [ "tentacle_1" ]
      state: lurker_tentacle_1
    - map: [ "tentacle_2" ]
      state: lurker_tentacle_2
    - map: [ "tentacle_3" ]
      state: lurker_tentacle_3
    - map: [ "shell" ]
      state: lurker_lurker_shell
    - map: [ "dead" ]
      state: dead
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.WFRemadeShellVisuals.Open:
        shell:
          True: { visible: false }
          False: { visible: true }
  - type: HTN
    rootTask:
      task: WFRemadeSkirmishHuntCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      VisionRadius: !type:Single
        14
      AggroVisionRadius: !type:Single
        20
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WFRemadeLurkerShell
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  # DS13-2.0: speedmod 1.4. Open, the shell cuts it to a third.
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.6
    baseSprintSpeed: 3.6
  # A bite, only if something gets in close. The spines are its weapon.
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 0.8
    animation: WeaponArcBite
    soundSwing:
      collection: WFRemadeLurkerAttack
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    damage:
      types:
        Piercing: 4
  - type: FootstepModifier
    footstepSoundCollection:
      collection: WFRemadeLurkerFootstep
  - type: WFRemadeVoice
    speech:
      collection: WFRemadeLurkerSpeech
    pain:
      collection: WFRemadeLurkerPain
    death:
      collection: WFRemadeLurkerDeath
    shout:
      collection: WFRemadeLurkerShoutLong
  - type: WFRemadeShell
    covered: [ tentacle_1, tentacle_2, tentacle_3 ]
  # DS13: with all three tentacles gone it dies.
  - type: WFDiesWithoutLimbs
    limbs: [ tentacle_1, tentacle_2, tentacle_3 ]
  - type: WFRemadeLimbs
    rsi: _WF/Remade/Mobs/lurker.rsi
    floors: { Sight: 0.4 }
    limbs:
    - id: chest
      health: 150
      weight: 3
      scale: 0.5
      severable: false
      zones: [ Torso, Groin, LeftLeg, LeftFoot, RightLeg, RightFoot ]
      lying: lurker_chest_lying
    # The tentacles are the weak point: they fire the spines, and all three off kills it.
    - id: tentacle_1
      name: wf-remade-limb-tentacle
      health: 18
      weight: 1.5
      loss: 12
      zones: [ LeftArm, LeftHand ]
      provides: { Fire: 0.34 }
    - id: tentacle_2
      name: wf-remade-limb-tentacle
      health: 18
      weight: 1.5
      loss: 12
      zones: [ Head ]
      provides: { Fire: 0.33 }
    - id: tentacle_3
      name: wf-remade-limb-tentacle
      health: 18
      weight: 1.5
      loss: 12
      zones: [ RightArm, RightHand ]
      provides: { Fire: 0.33 }
  - type: WFRemadeAbilities
    abilities:
    - !type:WFShoutAbility
      cooldown: 8
      range: 20
      sound:
        collection: WFRemadeLurkerShout
    - !type:WFSpineAbility
      cooldown: 6
      minRange: 3
      range: 13
      projectile: WFRemadeSpine
      projectileSpeed: 18
      windUp: 0.85
      openTime: 1
      volleyCooldown: 3
      curlTime: 4
      giveUp: 5
      spread: 14
      openSpeed: 0.35
      spines: [ tentacle_1, tentacle_2, tentacle_3 ]
      sound:
        collection: WFRemadeLurkerAttack
      openSound:
        collection: WFRemadeLurkerShoutLong
      fireSound:
        collection: WFRemadeLurkerSpineFire

