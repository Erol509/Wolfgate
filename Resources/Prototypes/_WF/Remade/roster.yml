# AI

# Closes in until it sees the target from the hold range, then stands and lets its abilities fire, backing off when pressed.
- type: htnCompound
  id: WFRemadeSkirmishCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargets
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      operator: !type:WFSkirmishOperator
        targetKey: Target
        holdRange: 9
        backOffRange: 4
        retreatStep: 3
      services:
      - !type:UtilityService
        id: MeleeService
        proto: NearbyMeleeTargets
        key: Target

- type: htnCompound
  id: WFRemadeSkirmishHuntCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: WFRemadeSkirmishCompound
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WFRemadeHunt
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        targetKey: WFRemadeHunt
        shutdownState: PlanFinished
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound
