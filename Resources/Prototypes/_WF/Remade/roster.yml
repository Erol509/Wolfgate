      state: exploder_chest
    - map: [ "l_arm" ]
      state: exploder_l_arm
    - map: [ "r_arm" ]
      state: exploder_r_arm
    - map: [ "head" ]
      state: exploder_head
    - map: [ "dead" ]
      state: dead
      visible: false
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WFRemadeExploder
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
