# The common Remade: hopper, leaper, spitter, exploder, puker, lurker and the enhanced leaper and exploder.
# Health, speed, armour and costs from DS13-2.0's subtypes (the lurker from DS13-1.0). Armour is 1 - the DS percentage.

- type: damageModifierSet
  id: WFRemadeHopper
  coefficients:
    Blunt: 0.75
    Piercing: 0.7
    Slash: 0.9
    Heat: 1.2
    Caustic: 0.2
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

- type: damageModifierSet
  id: WFRemadeLeaper
  coefficients:
    Blunt: 0.5
    Piercing: 0.65
