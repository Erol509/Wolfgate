# Growths: structures the Director grows on corruption. Rules and numbers from DS13-2.0's corruption/structures.

# DS13 takes a quarter of brute and doubles burn; this is milder, since a crew has fewer tools.
- type: damageModifierSet
  id: WFRemadeGrowth
  coefficients:
    Blunt: 0.5
    Slash: 0.5
    Piercing: 0.5
    Heat: 2
    Cold: 0.5
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

- type: entity
  abstract: true
  id: WFRemadeGrowthBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  # Soft, like kudzu: walked over, but a body for the physics to keep.
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - MidImpassable
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: Damageable
    damageModifierSet: WFRemadeGrowth
  - type: Temperature
    heatDamage:
      types:
        Heat: 5
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Flammable
    damage:
      types:
        Heat: 3
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]

# Nodes. Each feeds corruption within its reach up to its capacity (WFCorruptionNode).
- type: entity
  parent: WFRemadeGrowthBase
  id: WFCorruptionBranch
  components:
  - type: Sprite
    sprite: _WF/Remade/Structures/growths.rsi
    noRot: true
    drawdepth: SmallObjects
    layers:
    - map: [ "base" ]
      state: minigrowth3
  - type: GenericVisualizer
    visuals:
      enum.WFGrowthVisuals.State:
        base:
          Growing: { state: minigrowth1 }
          Idle: { state: minigrowth3 }
          Active: { state: minigrowth3 }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: WFGrowth
    kind: WFCorruptionBranch
  - type: WFCorruptionNode
    capacity: 32
    reach: 5

- type: entity
  parent: WFRemadeGrowthBase
  id: WFCorruptionRoot
  components:
  - type: Sprite
    sprite: _WF/Remade/Structures/growths.rsi
    noRot: true
    drawdepth: SmallObjects
    layers:
    - map: [ "base" ]
      state: minigrowth1
  - type: GenericVisualizer
    visuals:
      enum.WFGrowthVisuals.State:
        base:
          Growing: { state: minigrowth2 }
          Idle: { state: minigrowth1 }
          Active: { state: minigrowth1 }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: WFGrowth
    kind: WFCorruptionRoot
  - type: WFCorruptionNode
    capacity: 24
    reach: 8

- type: entity
  parent: WFRemadeGrowthBase
  id: WFCorruptionPropagator
  components:
  - type: Sprite
    sprite: _WF/Remade/Structures/growths.rsi
    noRot: true
    drawdepth: SmallObjects
    layers:
    - map: [ "base" ]
      state: growth
  - type: GenericVisualizer
    visuals:
      enum.WFGrowthVisuals.State:
        base:
          Growing: { state: minigrowth4 }
          Idle: { state: growth }
          Active: { state: growth }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: WFGrowth
    kind: WFCorruptionPropagator
  - type: WFCorruptionNode
    capacity: 120
    reach: 12

