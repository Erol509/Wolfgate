# Signals: dead players a Monolith holds as unseen eyes. They fly near the stone, play tricks on the living and drive its Remade.

- type: entity
  parent: Incorporeal
  id: WFSignal
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    color: "#a8301f99"
    layers:
    - state: animated
      shader: unshaded
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: Eye
    drawFov: false
    drawLight: false
  - type: Input
    context: "ghost"
  - type: Examiner
    skipChecks: true
  - type: Actions
  - type: WFSignal

# The ghost role a Monolith offers. It is paused while the stone is full or can't take Signals.
- type: entity
  id: WFSignalGate
  categories: [ HideSpawnMenu ]
  components:
  - type: GhostRole
    name: wf-signal-role-name
    description: wf-signal-role-description
    rules: wf-signal-role-rules
    makeSentient: true
    allowSpeech: false
    allowMovement: true
  - type: GhostRoleMobSpawner
    prototype: WFSignal
    deleteOnSpawn: false
    availableTakeovers: 1000000
  - type: WFSignalGate

# Tricks: point at a thing. The cooldown comes from WFSignalMath.

- type: entity
  id: WFSignalActionFlicker
  components:
  - type: EntityTargetAction
    icon: { sprite: _WF/Remade/Interface/signal_actions.rsi, state: flicker }
    event: !type:WFSignalTrickEvent
      trick: Flicker
    canTargetSelf: false
    range: 14
    raiseOnUser: true
    checkCanAccess: false
    checkCanInteract: false
    checkConsciousness: false

