# PDV adamantite walls: plastitanium walls built from PDV composite. Full mount coverage, and every variant outlasts several heavy shells.

- type: entity
  parent: WallPlastitanium
  id: WFWallAdamantite
  name: adamantite wall
  description: Plastitanium plating laced with Phaethon adamantite. Soaks up the hits meant for what's mounted on it.
  components:
  - type: Sprite
    sprite: _WF/ShipArmor/adamantite.rsi
  - type: Icon
    sprite: _WF/ShipArmor/adamantite.rsi
  - type: Construction
    graph: WFAdamantiteWall
    node: adamantiteWall
  - type: ArmorThickness
    thickness: 13
    canBePierced: false
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 9500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 10450
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

