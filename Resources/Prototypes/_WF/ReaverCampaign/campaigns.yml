# One campaign per votable storyteller preset. Lists by tier run 0 (none) to 5 (overrun).

- type: wfReaverCampaign
  id: WFReaverCampaignQuiet
  preset: WFEncounterPresetQuiet
  faction: WFSectorFactionReavers
  firstStrongholdDelay: 60m
  regroupDelay: 45m
  spreadInterval: 20m
  quietMinutes: 15
  foundInterval: 90m
  cellsPerStronghold: 8
  maxStrongholds: 2
  supportRange: 2
  patrols: [ 0, 1, 1, 1, 1, 2 ]
  patrolInterval: 15m
  interceptDwell: 60s
  interceptCooldown: 10m
  intercepts: [ 0, 1, 1, 1, 1, 2 ]
  raidTier: 3
  raidInterval: [ 60m, 50m, 40m ]
  threatScale: [ 1, 1, 1, 1.1, 1.2, 1.3 ]
  maxThreatScale: 1.5
  tierThresholds: [ 10, 22, 40, 60, 80 ]
  strongholdBounty: [ 200000, 300000, 400000, 500000, 625000, 750000 ]
  patrolBounty: 75000
  batteryBounty: 40000
  # Each paid attacking ship past the first adds half the bounty, to at most two and a half times it.
  shipBountyScale: 0.5
  maxShipBountyScale: 2.5
  # Each ship that helps also gets a free repair at the Anvilhold Drydock, bound to it, one unused at a time.
  strongholdVoucher: WFDrydockRepairVoucher
  patrolVoucher: WFDrydockRepairVoucher
  # Spesos for retaking a held cell, by tier, split among the crews of the ships that held it through the countdown.
  retakeBounty: [ 16000, 20000, 24000, 28000, 32000, 40000 ]
  # Reinforcements dock to a stronghold hub one by one: the interval a hub stands before the next sets out, the level
  # cap by tier (0..5), and the convoy for each level from 1.
  reinforcementInterval: 20m
  maxLevelByTier: [ 0, 1, 1, 2, 2, 2 ]
  levelBountyScale: 0.5
  reinforcements: [ WFReaverReinforcementGunship, WFReaverReinforcementGunship, WFReaverReinforcementHeavy, WFReaverReinforcementHeavy ]
  # The citadel: sets out once the campaign has stood at tier 5 for the delay, claims more rings, grows past the
  # level cap, pays a scaled bounty, and leaves a lull of no founding, convoy or raid when it falls.
  citadel: WFReaverCitadel
  citadelDelay: 20m
  citadelExtraLevels: 2
  citadelBountyScale: 3
  citadelRings: 2
  # What more living players on the sector map add; the highest bracket reached applies. Gear raises the tier
  # ships are picked by, not the threat. Batteries ring the first stronghold, a regrouped one and the citadel.
  population:
  - minPlayers: 0
    batteries: 1
  - minPlayers: 25
    batteries: 2
    bountyScale: 1.15
  - minPlayers: 40
    gearTiers: 1
    batteries: 2
    patrols: 1
    reinforcementScale: 0.85
    bountyScale: 1.3
  - minPlayers: 55
    gearTiers: 1
    batteries: 3
    levels: 1
    patrols: 1
    intercepts: 1
    strongholds: 1
    reinforcementScale: 0.75
    bountyScale: 1.5
  credits:
  - entity: FederationMilitaryCredit1
    companies: [ TSF ]
    stronghold: 100
    patrol: 40
  - entity: Doubloon1
    companies: [ PDV, PDVCivilian ]
    stronghold: 100
    patrol: 40
  risingSound:
    path: /Audio/Misc/redalert.ogg
  fallingSound:
    path: /Audio/Misc/notice1.ogg
  capitalSound:
    path: /Audio/Misc/gamma.ogg
  risingColor: "#D84A3A"
  fallingColor: "#3FB8AF"

