# Blueshield Officer clothing ported from GoobStation.

# Back
- type: entity
  parent: [ClothingBackpack, BaseCentcommContraband]
  id: ClothingBackpackBlueshield
  components:
  - type: Sprite
    sprite: _WF/Blueshield/Clothing/Back/Backpacks/blueshield.rsi

- type: entity
  parent: [ClothingBackpackDuffel, BaseCentcommContraband]
  id: ClothingBackpackDuffelBlueshield
  components:
  - type: Sprite
    sprite: _WF/Blueshield/Clothing/Back/Duffels/blueshield.rsi

- type: entity
  parent: [ClothingBackpackSatchel, BaseCentcommContraband]
  id: ClothingBackpackSatchelBlueshield
  components:
  - type: Sprite
    sprite: _WF/Blueshield/Clothing/Back/Satchels/blueshield.rsi

- type: entity
  parent: [NFClothingMessenger, BaseCentcommContraband]
  id: ClothingBackpackMessengerBlueshield
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    layers:
    - state: icon-base
      color: "#404040"
    - state: icon-sling
      color: "#004281"
    - state: icon-clasp
      color: "#005DBF"
  - type: Clothing
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    clothingVisuals:
      back:
      - state: base-equipped-BACKPACK
        color: "#404040"
      - state: sling-equipped-BACKPACK
        color: "#004281"
      - state: clasp-equipped-BACKPACK
        color: "#005DBF"
  - type: Item
    inhandVisuals:
      left:
      - state: base-inhand-left
        color: "#404040"
      - state: clasp-inhand-left
        color: "#eca615"
      right:
      - state: base-inhand-right
        color: "#404040"
      - state: clasp-inhand-right
        color: "#eca615"

