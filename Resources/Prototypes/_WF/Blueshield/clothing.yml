# Neck
- type: entity
  parent: [ClothingNeckBase, BaseCentcommContraband]
  id: ClothingNeckMantleBlueshield
  components:
  - type: Sprite
    sprite: _WF/Blueshield/Clothing/Neck/Mantle/bsomantle.rsi
  - type: Clothing
    sprite: _WF/Blueshield/Clothing/Neck/Mantle/bsomantle.rsi

- type: entity
  parent: [ClothingNeckBase, BaseCentcommContraband]
  id: ClothingNeckEnsembleBlueshield
  components:
  - type: Item
    size: Small
    heldPrefix: cloakblackmantle
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Sprite
    sprite: _WF/Blueshield/Clothing/Neck/Ensembles/bso.rsi
  - type: Clothing
    sprite: _WF/Blueshield/Clothing/Neck/Ensembles/bso.rsi
    equippedPrefix: cloakblackmantle
    slots:
    - Neck
  - type: ItemSwitch
    state: cloakblackmantle
    showLabel: true
    states:
      cloakblackmantle: !type:ItemSwitchState
        verb: cloakblack&mantle
        sprite:
          sprite: _WF/Blueshield/Clothing/Neck/Ensembles/bso.rsi
          state: icon
      cloakwhitemantle: !type:ItemSwitchState
        verb: cloakwhite&mantle
        sprite:
          sprite: _WF/Blueshield/Clothing/Neck/Ensembles/bso.rsi
          state: cloakwhitemantle-icon
      cloakwhite: !type:ItemSwitchState
        verb: cloakwhite
        sprite:
          sprite: _WF/Blueshield/Clothing/Neck/Ensembles/bso.rsi
          state: cloakwhite-icon
      cloakblack: !type:ItemSwitchState
        verb: cloakblack
        sprite:
          sprite: _WF/Blueshield/Clothing/Neck/Ensembles/bso.rsi
          state: cloakblack-icon
      mantle: !type:ItemSwitchState
        verb: mantle
        sprite:
          sprite: _WF/Blueshield/Clothing/Neck/Ensembles/bso.rsi
          state: mantle-icon

