  - type: Sprite
    sprite: _WF/Blueshield/Clothing/Head/Hardsuits/bso.rsi
  - type: Clothing
    sprite: _WF/Blueshield/Clothing/Head/Hardsuits/bso.rsi
  - type: PointLight
    color: "#4d7ae3"
    rotation: 30
    energy: 10
    radius: 5
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: Armor
    coverage: [Head]
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.7
        Heat: 0.7

