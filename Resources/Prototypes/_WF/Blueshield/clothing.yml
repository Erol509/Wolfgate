  components:
  - type: Clothing
    sprite: _WF/Blueshield/Clothing/Head/Hats/blueshield_ushanka.rsi
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: up
    foldedHeldPrefix: up
  - type: Sprite
    sprite: _WF/Blueshield/Clothing/Head/Hats/blueshield_ushanka.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-up
      map: [ "foldedLayer" ]
      visible: false

- type: entity
  parent: ClothingHeadHatHoodWinterBase
  id: ClothingHeadHatHoodWinterBso
