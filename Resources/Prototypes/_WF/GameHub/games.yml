- type: wfGame
  id: WFGameFreedoom
  name: wf-gamehub-game-freedoom-name
  description: wf-gamehub-game-freedoom-description
  dataPath: /GameData/_WF/DoomArcade/freedoom1.wad
  dataFile: freedoom1.wad
  noisePack: /Textures/_WF/DoomArcade/freedoom1-noise.wad
  # Episode * 10 + map: E1M1 is 11, E4M9 is 49.
  minLevel: 11
  maxLevel: 49

- type: wfGame
  id: WFGameFreedoom2
  name: wf-gamehub-game-freedoom2-name
  description: wf-gamehub-game-freedoom2-description
  dataPath: /GameData/_WF/DoomArcade/freedoom2.wad
  dataFile: freedoom2.wad
  noisePack: /Textures/_WF/DoomArcade/freedoom2-noise.wad
  # The engine reports episode 1 and maps 1 to 32 as 10 + map.
  minLevel: 11
  maxLevel: 42

- type: entity
  parent: NFBasePDACartridge
  id: WFGameHubCartridge
  name: gamehub cartridge
  description: A program for downloading and playing games.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-y
  - type: UIFragment
    ui: !type:WFGameHubUi
  - type: Cartridge
    programName: wf-gamehub-program-name
    icon:
      sprite: Structures/Machines/arcade.rsi
      state: icon
