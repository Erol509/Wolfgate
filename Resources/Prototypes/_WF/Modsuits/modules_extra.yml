# WOLFGATE(Modsuits): additional tgstation MODsuit modules adapted to Wolfgate systems.


- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleLongfall
  name: MOD longfall module
  description: Useful for protecting both the suit and the wearer, utilizing commonplace systems to convert the possible damage from a fall into kinetic charge, as well as internal gyroscopes to ensure the user's safe falling. Useful for mining, monorail tracks, or even skydiving!
  components:
  - type: Sprite
    state: longfall
  - type: ModModule
    complexity: 1
    idlePower: 0.2
    requiredParts:
    - shoes
    incompatible:
      tags:
      - ModsuitModuleLongfall
  - type: ModLongfallModule
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleLongfall


- type: entity
  parent: ModsuitModuleDefibrillator
  id: ModsuitModuleCombatDefibrillator
  name: MOD combat defibrillator module
  description: A module built into the gauntlets of the suit; commonly known as the 'Healing Hands' by medical professionals. The user places their palms above the patient. Onboard computers in the suit calculate the necessary voltage, and a modded targeting computer determines the best position for the user to push. Twenty five pounds of force are applied to the patient's skin. Shocks travel from the suit's gloves and counter-shock the heart, and the wearer returns to Medical a hero. Interdyne Pharmaceutics marketed the domestic version of the Healing Hands as foolproof and unusable as a weapon. But when it came time to provide their operatives with usable medical equipment, they didn't hesitate to remove those in-built safeties. Operatives in the field can benefit from what they dub as 'Stun Gloves', able to apply shocks straight to a victims heart to disable them, or maybe even outright stop their heart with enough power.
  components:
  - type: ModModule
    moduleType: Active
    complexity: 3
    activePower: 1.8
    requiredParts:
    - gloves


- type: entity
  parent: ModsuitModuleDonkRecycler
  id: ModsuitModuleDonkSafeRecycler
  name: MOD foam dart recycler module
  description: A mod module that collects and repackages fired foam darts into half-sized ammo boxes. Activate on a nearby turf or storage to unload stored ammo boxes.
  components:
  - type: Sprite
    state: donk_safe_recycler
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.4
    requiredParts:
    - outerClothing


- type: entity
  parent: ModsuitModuleBalloonBlower
  id: ModsuitModuleAdvancedBalloonBlower
  name: MOD advanced balloon blower module
  description: A relatively new piece of technology developed by finest clown engineers to make long balloons and balloon animals at party-appropriate rate.
  components:
  - type: ModModule
    moduleType: Usable
    complexity: 2
    usePower: 3
    cooldown: 20
    requiredParts:
    - head


- type: entity
  parent: ModsuitModuleWelding
  id: ModsuitModuleSyndicateWelding
  name: MODsuit flash-protected optical suite
  description: A syndicate optical suite that protects against welding arcs, solar glare and flashbangs alike.
  components:
  - type: ModModule
    complexity: 0
    removable: false
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: EyeProtection
    - type: FlashImmunity


- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleNight
  name: MOD night vision module
  description: A night vision package that can be fitted alongside a visor module, brightening the world into a spooky green glow.
  components:
  - type: Sprite
    state: night_visor
  - type: ModModule
    moduleType: Toggle
    complexity: 2
    activePower: 0.4
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: NightVision
      relayOverlay: true
      enabled: true


- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleConstructor
  name: MOD constructor module
  description: A wrist-mounted rapid construction device, letting the wearer build and dismantle station structures without drawing a tool.
  components:
  - type: Sprite
    state: constructor
  - type: ModModule
    moduleType: Usable
    complexity: 3
    usePower: 1
    cooldown: 1
    requiredParts:
    - gloves
  - type: ModSpawnModule
    toHand: true
    prototype: RCD

- type: entity
  parent: ModsuitModuleHatStabilizer
  id: ModsuitModuleHatStabilizerElite
  name: MOD elite hat stabilizer module
  description: A simple set of deployable stands, directly atop one's head; these will deploy under a hat to keep it from falling off, allowing them to be worn atop the sealed helmet. You still need to take the hat off your head while the helmet deploys, though. This is a must-have for Syndicate Operatives and Agents alike, enabling them to continue to style on the opposition even while in their MODsuit.
  components:
  - type: ModModule
    complexity: 0
    allowFlags: Inactive
    removable: false
    requiredParts:
    - head


- type: entity
  parent: ModsuitModuleBulwark
  id: ModsuitModuleBulwarkLocked
  name: superglued MOD bulwark module
  description: Layers upon layers of shock dampening plates, just to stop you from getting shoved into a wall by an angry mob. Good luck removing this one.
  components:
  - type: ModModule
    complexity: 0
    idlePower: 0.2
    removable: false
    requiredParts:
    - shoes
