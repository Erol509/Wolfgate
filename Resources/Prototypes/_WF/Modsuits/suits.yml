# The Modsuit Itself, This is just a Deathsquad modsuit, but reskined for CC Officials
- type: entity
  parent: [ ClothingModsuitStandard, BaseWFModsuitSyndicateContraband ]
  id: ClothingModsuitContractor
  name: Contractor modsuit control unit
  description: The main controller for a Contractor modsuit.
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/contractor.rsi
    - type: ModSuit
      theme: ModThemeContractor
      parts:
        head: ClothingModsuitHelmetContractor
        gloves: ClothingModsuitGauntletsContractor
        outerClothing: ClothingModsuitChestplateContractor
        shoes: ClothingModsuitBootsContractor
      startingModules:
      - ModsuitModuleStorageCompact
      - ModsuitModuleFlashlight
      - ModsuitModuleMagboots
      inbuiltModules:
      - ModsuitModuleBuiltinSecHud
      - ModsuitModuleBuiltinMedHud
      - ModsuitModuleBuiltinFlashProtection
      - ModsuitModuleBuiltinInsulation
      - ModsuitModuleBuiltinAutoInjector
      - ModsuitModuleBuiltinChameleon
      - ModsuitModuleBuiltinInstrument
    - type: ItemSlots
      slots:
        mod-core:
          name: modsuit-core-slot-name
          startingItem: ModsuitCoreStandardAntique
          whitelist:
            components:
            - ModCore
    - type: ChameleonClothing
      slot: [back]
      default: ClothingModsuitContractor
    - type: UserInterface
      interfaces:
        enum.ChameleonUiKey.Key:
          type: ChameleonBoundUserInterface
        enum.ModSuitUiKey.Key:
          type: ModSuitBoundUserInterface
    - type: ExplosionResistance
      damageCoefficient: 0.1
 
- type: entity
  parent: [ClothingModsuitGauntletsStandard, BaseWFModsuitSyndicateContraband]
  id: ClothingModsuitGauntletsContractor
  name: Contractor modsuit gauntlets
  description: A pair of gauntlets made for the Contractor modsuit.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/contractor.rsi
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        gloves:
        - state: equipped-HAND-sealed
        - state: equipped-HAND-sealed-unshaded
          shader: unshaded
        gloves-vox:
        - state: equipped-HAND-sealed-vox
        - state: equipped-HAND-sealed-unshaded-vox
          shader: unshaded

- type: entity
  parent: [ClothingModsuitHelmetStandard, BaseWFModsuitSyndicateContraband]
  id: ClothingModsuitHelmetContractor
  name: Contractor modsuit helmet
  description: A state-of-the-art helmet designed by the Syndicate for the Contractor modsuit. It includes a built-in HUD.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/contractor.rsi
    - type: PointLight
      color: "#18f324"
    - type: Armor # mostly the same stats as HoS modsuit
      modifiers:
        coefficients:
          Blunt: 0.55
          Slash: 0.55
          Piercing: 0.5
          Heat: 0.55
          Caustic: 0.5
          Radiation: 0.0
    - type: FireProtection
      reduction: 0.2
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        head-hydrakin:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-feroxi:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-vulpkanin:
        - state: equipped-HEAD-sealed-vulpkanin
        head-resomi:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-vox:
        - state: equipped-HEAD-sealed-vox
        - state: equipped-HEAD-sealed-unshaded-vox
          shader: unshaded
    - type: ActivatableUI
      inHandsOnly: false
      singleUser: true
      requireActiveHand: false
      verbText: verb-instrument-openui
      key: enum.InstrumentUiKey.Key
    - type: UserInterface
      interfaces:
        enum.InstrumentUiKey.Key:
          type: InstrumentBoundUserInterface
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide
    - type: ModSealedComponents
      components:
      - type: Instrument
        program: 62
      - type: SwappableInstrument
        instrumentList:
          "Synth": {62: 0}
          "Friend": {2: 0}
          "Overdriven": {29: 0}
          "Bass": {33: 0}
          "Rock": {29: 0}
          "Acoustic": {24: 0}
          "Flute": {73: 0}
          "Sax": {66: 0}
      - type: BreathMask
      - type: PressureProtection
        highPressureMultiplier: 0.3
        lowPressureMultiplier: 1000
      - type: TemperatureProtection
        heatingCoefficient: 0.01
        coolingCoefficient: 0.01
      - type: IdentityBlocker
      - type: IngestionBlocker
    - type: Clothing
      clothingVisuals:
        head-feroxi:
        - state: equipped-HEAD
        head-hydrakin:
        - state: equipped-HEAD

- type: entity
  parent: [ClothingModsuitChestplateStandard, BaseWFModsuitSyndicateContraband]
  id: ClothingModsuitChestplateContractor
  name: Contractor modsuit chestplate
  description: A state of the art chestplate designed by the Syndicate for the Contractor modsuit. It incorporates powered servos to reduce the equipment load.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/contractor.rsi
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1
    - type: Armor # mostly the same stats as HoS modsuit
      modifiers:
        coefficients:
          Blunt: 0.5
          Slash: 0.5
          Piercing: 0.45
          Heat: 0.5
          Caustic: 0.5
          Radiation: 0
    - type: ExplosionResistance
      damageCoefficient: 0.4
    - type: StaminaDamageResistance
      coefficient: 0.7
    - type: FireProtection
      reduction: 0.8
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        outerClothing-resomi:
        - state: equipped-OUTERCLOTHING-sealed
        outerClothing:
        - state: equipped-OUTERCLOTHING-sealed
        outerClothing-vox:
        - state: equipped-OUTERCLOTHING-sealed-vox
    - type: ModSealedComponents
      components:
      - type: PressureProtection
        highPressureMultiplier: 0.3
        lowPressureMultiplier: 1000
      - type: TemperatureProtection
        coolingCoefficient: 0.01
        heatingCoefficient: 0.01

- type: entity
  parent: [ClothingModsuitBootsStandard, BaseWFModsuitSyndicateContraband]
  id: ClothingModsuitBootsContractor
  name: Contractor modsuit boots
  description: A state-of-the-art pair of magboots for the Contractor modsuit. So long as the suit is powered, these will not slow the wearer down.
  categories: [HideSpawnMenu]
  components:
    - type: Appearance
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/contractor.rsi
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        shoes:
        - state: equipped-FEET-sealed
        - state: equipped-FEET-sealed-unshaded
          shader: unshaded
        shoes-vox:
        - state: equipped-FEET-sealed-vox
        - state: equipped-FEET-sealed-unshaded-vox
          shader: unshaded
    - type: ModifyStandingUpTime
      multiplier: .5
    - type: ClothingSpeedModifier
      walkModifier: 1.1
      sprintModifier: 1.1

