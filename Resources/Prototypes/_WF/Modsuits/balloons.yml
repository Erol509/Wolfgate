# WOLFGATE(Modsuits): balloons spawned by the balloon blower module, sprited from tgstation.

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseWFModsuitBalloon
  components:
  - type: Sprite
    sprite: _WF/Modsuits/balloons.rsi
  - type: Item
    size: Small
  - type: Damageable
    damageContainer: Inorganic
  - type: Tag
    tags:
    - Balloon

- type: entity
  parent: BaseWFModsuitBalloon
  id: RedBalloon
  name: red balloon
  components:
  - type: Sprite
    state: red

- type: entity
  parent: BaseWFModsuitBalloon
  id: GreenBalloon
  name: green balloon
  components:
  - type: Sprite
    state: green

- type: entity
  parent: BaseWFModsuitBalloon
  id: BlueBalloon
  name: blue balloon
  components:
  - type: Sprite
    state: blue
