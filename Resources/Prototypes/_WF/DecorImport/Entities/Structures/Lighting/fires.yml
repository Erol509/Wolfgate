- type: entity
  abstract: true
  parent: [ BaseUrbanProp, BaseUrbanIgnitable ]
  id: BaseUrbanFire

- type: entity
  abstract: true
  parent: BaseUrbanFire
  id: BaseUrbanCampfire
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseUrbanCampfire
  id: AuroraCampfire
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Lighting/fires_aurora.rsi
    offset: 0,0.25
    layers:
    - state: campfire
  - type: FireVisuals
    sprite: _WF/DecorImport/Structures/Lighting/fires_aurora.rsi
    normalState: campfire_lit
    lightColor: "#FF9A3C"
    lightRadiusPerStack: 0.83
    maxLightRadius: 4
    lightEnergyPerStack: 0.20
    maxLightEnergy: 1.6

- type: entity
  parent: BaseUrbanFire
  id: AuroraFireBarrel
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Lighting/fires_aurora.rsi
    offset: 0,0.25
    layers:
    - state: fire_barrel
  - type: FireVisuals
    sprite: _WF/DecorImport/Structures/Lighting/fires_aurora.rsi
    normalState: fire_barrel_lit
    lightColor: "#FF9A3C"
    lightRadiusPerStack: 0.83
    maxLightRadius: 4
    lightEnergyPerStack: 0.20
    maxLightEnergy: 1.6

- type: entity
  parent: BaseUrbanProp
  id: AuroraBarrelGrill
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Lighting/fires_aurora.rsi
    offset: 0,0.25
    state: barrel_grill

- type: entity
  parent: BaseUrbanFire
