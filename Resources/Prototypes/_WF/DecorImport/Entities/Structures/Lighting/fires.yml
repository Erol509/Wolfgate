    state: bonfire_stones

- type: entity
  parent: BaseUrbanFire
  id: DarkPackWallTorch
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Lighting/torch.rsi
    layers:
    - state: torch
  - type: FireVisuals
    sprite: _WF/DecorImport/Structures/Lighting/torch.rsi
    normalState: torch_lit
    lightColor: "#FF9A3C"
    lightRadiusPerStack: 0.83
    maxLightRadius: 4
    lightEnergyPerStack: 0.13
    maxLightEnergy: 1.4

- type: entity
  parent: BaseUrbanCampfire
  id: DarkPackBonfire
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/fires.rsi
    offset: "0,0.25"
    layers:
    - state: bonfire
  - type: Physics
    canCollide: false
  - type: FireVisuals
    sprite: _WF/DecorImport/Structures/Decoration/fires.rsi
    normalState: bonfire_on_fire
    lightColor: "#FF9A3C"
    lightRadiusPerStack: 1.50
    maxLightRadius: 6
    lightEnergyPerStack: 0.20
    maxLightEnergy: 1.6

- type: entity
  parent: DarkPackBonfire
  id: DarkPackCampfire
  components:
  - type: Sprite
    layers:
    - state: campfire
  - type: FireVisuals
    sprite: _WF/DecorImport/Structures/Decoration/fires.rsi
    normalState: campfire_on_fire
    lightColor: "#FF9A3C"
    lightRadiusPerStack: 0.83
    maxLightRadius: 4
    lightEnergyPerStack: 0.20
    maxLightEnergy: 1.6

- type: entity
  parent: [ BaseUrbanProp, BaseUrbanToggleLight ]
  id: DarkPackBrazier
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Lighting/brazier.rsi
    layers:
    - state: brazier
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: ItemToggle
    activated: false
    onUse: false
  - type: PointLight
    enabled: false
    radius: 5
    energy: 3
    color: "#ffa35c"
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: brazier_lit }
          False: { state: brazier }
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
