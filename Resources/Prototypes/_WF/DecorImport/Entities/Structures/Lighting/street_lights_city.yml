    sprite: _WF/DecorImport/Structures/Lighting/streetlights.rsi
    offset: 0,0.5
  - type: PointLight
    radius: 8
    energy: 1

- type: entity
  parent: BaseCMStreetLight
  id: CMStreetLightIndustrial
  components:
  - type: Sprite
    layers:
    - state: street_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.ToggleableVisuals.Layer:
          True: { state: street_on }
          False: { state: street_off }
  - type: PointLight
    color: "#D2E3EC"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          CMStreetLightIndustrialBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

