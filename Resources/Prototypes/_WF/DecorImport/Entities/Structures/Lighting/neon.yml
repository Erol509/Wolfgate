- type: entity
  abstract: true
  parent: [ BaseUrbanWallSign, BaseUrbanToggleLight ]
  id: BasePolarisNeonSmall
  components:
  - type: Sprite
    noRot: false
    sprite: _WF/DecorImport/Structures/Lighting/neonsigns.rsi
  - type: PointLight
    radius: 2
    energy: 0.7

- type: entity
  parent: BasePolarisNeonSmall
  id: PolarisNeonCafe
  components:
  - type: Sprite
    layers:
    - state: cafesign_off
      map: [ "enum.ToggleableVisuals.Layer" ]
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: cafesign_on }
          False: { state: cafesign_off }
  - type: PointLight
    color: "#FF8A3A"

- type: entity
  parent: BasePolarisNeonSmall
  id: PolarisNeonBlank
  components:
  - type: Sprite
    layers:
    - state: sign_off
      map: [ "enum.ToggleableVisuals.Layer" ]
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: sign_on }
          False: { state: sign_off }
  - type: PointLight
    color: "#8AD8FF"
