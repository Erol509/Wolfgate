- type: entity
  parent: PoweredLightPostSmall
  id: CoyoteFloorLamp
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Lighting/lamps.rsi
    layers:
    - state: flamp1
      map: [ "enum.PoweredLightLayers.Base" ]
  - type: PointLight
    radius: 4
    energy: 1.2
    color: "#FFD8A8"
  - type: PoweredLightVisuals
    spriteStateMap:
      empty: flamp-empty
      off: flamp0
      on: flamp1
      broken: flamp-broken
      burned: flamp-burned
