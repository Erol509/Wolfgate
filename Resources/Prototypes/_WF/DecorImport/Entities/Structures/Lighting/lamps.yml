- type: entity
  abstract: true
  parent: [ BaseUrbanProp, BaseUrbanToggleLight ]
  id: BaseCoyoteLamp
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Lighting/lamps.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.4,0.2,0.2"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: PointLight
    radius: 4
    energy: 1.2
    color: "#FFD8A8"

- type: entity
  parent: BaseCoyoteLamp
  id: CoyoteTorchiere
  components:
  - type: Sprite
    layers:
    - state: torchere
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: torchere-on }
          False: { state: torchere }

- type: entity
  parent: BaseCoyoteLamp
  id: CoyoteTorchiereBlue
  suffix: Blue
  components:
  - type: Sprite
    layers:
    - state: blue_torchere
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: blue_torchere-on }
          False: { state: blue_torchere }
  - type: PointLight
    color: "#A8E0FF"

- type: entity
  parent: BaseCoyoteLamp
  id: CoyoteTableLamp
  components:
  - type: Sprite
    drawdepth: SmallObjects
    layers:
    - state: table_lamp
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: table_lamp-on }
          False: { state: table_lamp }
  - type: Physics
    canCollide: false
  - type: PointLight
    radius: 3
    color: "#A8E0FF"

