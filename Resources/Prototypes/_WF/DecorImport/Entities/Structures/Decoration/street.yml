- type: entity
  parent: CrateGeneric
  id: DarkPackDumpster
  components:
  - type: Icon
    sprite: _WF/DecorImport/Structures/Decoration/crates32x32.rsi
    state: garbage
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/crates32x32.rsi
    layers:
    - state: garbage
      map: ["enum.StorageVisualLayers.Base"]
    - state: garbage
      map: ["enum.StorageVisualLayers.Door"]
      visible: false
  - type: EntityStorageVisuals
    stateBaseClosed: garbage
    stateBaseOpen: garbageopen
    stateDoorOpen: null
    stateDoorClosed: null
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: GenericTrashItems
        prob: 0.75

