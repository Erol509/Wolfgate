- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: BaseCMPhoneBox
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/phonebox.rsi
    noRot: true
    offset: 0.65625,0.5
    layers:
    - state: phonebox_off_empty_closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: phonebox_off_full_closed
      map: ["occupied"]
      visible: false
  - type: Icon
    sprite: _WF/DecorImport/Structures/Decoration/phonebox.rsi
    state: phonebox_off_empty_closed
  - type: InteractionOutline
  - type: Anchorable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: ResistLocker
  - type: EntityStorage
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
  - type: Appearance
  - type: EntityStorageVisuals
    stateDoorOpen: phonebox_off_open
    stateDoorClosed: phonebox_off_empty_closed
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.HasContents:
        occupied:
          True: { visible: true }
          False: { visible: false }
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:WeightedSpawnEntityBehavior
        weightedEntityTable: CMPhoneBoxWrecks
        spawnOffset: 0
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseCMPhoneBox
  id: CMPhoneBox
  components:
  - type: Sprite
    layers:
    - state: phonebox_on_empty_closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: phonebox_on_full_closed
      map: ["occupied"]
      visible: false
  - type: Icon
    state: phonebox_on_empty_closed
  - type: EntityStorageVisuals
    stateDoorOpen: phonebox_on_open
    stateDoorClosed: phonebox_on_empty_closed
  - type: PointLight
    radius: 2.5
    energy: 0.8
    softness: 1
    color: "#BFF5FF"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          CMPhoneBoxUnlit:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

