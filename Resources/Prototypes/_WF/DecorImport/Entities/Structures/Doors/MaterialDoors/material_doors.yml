- type: entity
  parent: DecorImportMaterialDoorBase
  id: GoonIomoonSealedDoor
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Doors/MaterialDoors/ancientdoor_goon.rsi
  - type: Door
    clickOpen: false
    openingAnimationTime: 1.25
    closingAnimationTime: 1.25
    openTimeOne: 0.6
    openTimeTwo: 0.65
    closeTimeOne: 0.65
    closeTimeTwo: 0.6
  - type: DoorSignalControl
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Open
    - Close
    - Toggle
  - type: DeviceLinkSource
    ports:
    - DoorStatus
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

