- type: entity
  abstract: true
  parent: BaseMaterialDoorNavMap
  id: DecorImportMaterialDoorBase
  components:
  - type: IconSmooth
    key: walls
    mode: NoSprite

- type: entity
  abstract: true
  id: BaseDecorImportWoodDoor
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: WFBulletImpactWood
  - type: Construction
    graph: DoorGraph
    node: woodDoor
  - type: Door
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  abstract: true
  id: BaseDecorImportMetalDoor
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
  - type: Construction
    graph: DoorGraph
    node: metalDoor
  - type: Door
    openSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
    closeSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BaseMaterialDoorNavMap
  id: CMDoorAncientTempleDoor
  components:
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Doors/MaterialDoors/ancient_temple_door.rsi
  - type: Door
    openingAnimationTime: 1.7
    closingAnimationTime: 1.7
    openTimeOne: 1.13
    openTimeTwo: 0.57
    closeTimeOne: 0.57
    closeTimeTwo: 1.13
    openSound:
      path: /Audio/_WF/DecorImport/cmss13/runedsanddoor.ogg
    closeSound:
      path: /Audio/_WF/DecorImport/cmss13/runedsanddoor.ogg

- type: entity
