  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Doors/MaterialDoors/hunter_door_cm.rsi
    layers:
    - state: door_closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    openSpriteState: door_open
    closedSpriteState: door_closed
    openingSpriteState: door_opening
    closingSpriteState: door_closing
    openingAnimationTime: 0.6
    closingAnimationTime: 0.6
    openTimeOne: 0.4
    openTimeTwo: 0.2
    closeTimeOne: 0.2
    closeTimeTwo: 0.4
    openSound:
      path: /Audio/_WF/DecorImport/cmss13/airlock.ogg
    closeSound:
      path: /Audio/_WF/DecorImport/cmss13/airlock.ogg
  - type: Damageable
    damageModifierSet: StructuralMetallic

