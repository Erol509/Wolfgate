- type: entity
  parent: TableBase
  id: CoyoteTableSnooker
  suffix: top
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/Tables/games.rsi
    noRot: true
    granularLayersRendering: true
    enableOverrideDir: true
    overrideDir: South
    layers:
    - state: nv_pooltable
      renderingStrategy: Default
    snapCardinals: false
  - type: Icon
    sprite: _WF/DecorImport/Structures/Furniture/Tables/games.rsi
    state: nv_pooltable
  - type: IconSmooth
    key: CoyoteTableSnooker
    base: state
    mode: NoSprite
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: StaticPrice
    price: 12
  - type: Construction
    graph: DecorBuildCoyoteTableSnooker
    node: built
  # Pool module: the six pieces share one game, kept on the bottom left piece.
  - type: WFPoolTable
    multiTile: true
  - type: UserInterface
    interfaces:
      enum.WFPoolUiKey.Key:
        type: PoolBoundUserInterface
        interactionRange: 6

- type: entity
  parent: CoyoteTableSnooker
  id: CoyoteTableSnookerBottom
  suffix: bottom
  components:
  - type: Sprite
    overrideDir: North

