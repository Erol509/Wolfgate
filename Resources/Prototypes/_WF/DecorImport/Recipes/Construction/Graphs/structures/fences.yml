- type: constructionGraph
  id: DecorCutCoyoteFence
  start: intact
  graph:
  - node: intact
    entity: CoyoteFenceStraight
    edges:
    - to: medium
      steps:
      - tool: Cutting
        doAfter: 2
  - node: medium
    entity: CoyoteFenceHoleMedium
    edges:
    - to: large
      steps:
      - tool: Cutting
        doAfter: 2
    - to: intact
      steps:
      - material: MetalRod
        amount: 1
        doAfter: 2
  - node: large
    entity: CoyoteFenceHoleLarge
    edges:
    - to: medium
      steps:
      - material: MetalRod
        amount: 1
        doAfter: 2

