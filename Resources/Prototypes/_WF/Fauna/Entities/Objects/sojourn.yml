# Meats

- type: entity
  parent: FoodMeatRawBase
  id: SojournFoodMeatPrimal
  components:
  - type: Sprite
    sprite: _WF/Fauna/Objects/Sojourn/primal_meat.rsi
    state: icon
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 25
        - ReagentId: Fat
          Quantity: 25
  - type: SliceableFood
    count: 3
    slice: FoodMeatCutlet
  - type: Construction
    graph: MeatSteak
    node: start
    defaultTarget: meat steak

- type: entity
  parent: FoodMeatRawBase
  id: SojournFoodMeatPork
  components:
  - type: Sprite
    sprite: _WF/Fauna/Objects/Sojourn/pork.rsi
    state: icon
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 8
        - ReagentId: Fat
          Quantity: 8
  - type: SliceableFood
    count: 4
    slice: FoodMeatBacon
  - type: Construction
    graph: MeatSteak
    node: start
    defaultTarget: meat steak

- type: entity
