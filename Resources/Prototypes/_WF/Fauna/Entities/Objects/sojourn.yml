# Dreaming King loot: Wolfgate stand-ins for the /obj/random/psi weapons and tools.
- type: entity
  parent: MarkerBase
  id: SojournSpawnerPsiLoot
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Objects/Tools/crowbar.rsi
      state: icon
  - type: RandomSpawner
    offset: 0.2
    prototypes:
    - Katana
    - Sledgehammer
    - Chainsaw
    - Machete
    - ButchCleaver
    - WeaponBrassKnuckles
    - Multitool
    - Shovel
    - Screwdriver
    - WelderIndustrial
    - Crowbar
    - Wrench
