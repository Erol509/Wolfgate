- type: entity
  abstract: true
  id: FaunaArenaButtonBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    canCollide: false
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/switch.rsi
    layers:
    - state: base
    - state: button
    - state: button-unshaded
      shader: unshaded

- type: entity
  parent: FaunaArenaButtonBase
  id: FaunaArenaButtonPrevious
  components:
  - type: FaunaArenaButton
    action: Previous
    delay: 0.1

- type: entity
  parent: FaunaArenaButtonBase
  id: FaunaArenaButtonNext
  components:
  - type: FaunaArenaButton
    action: Next
    delay: 0.1

- type: entity
  parent: FaunaArenaButtonBase
  id: FaunaArenaButtonFight
  components:
  - type: FaunaArenaButton
    action: Fight
  - type: Sprite
    layers:
    - state: base
    - state: off
    - state: off-unshaded
      shader: unshaded

- type: entity
  parent: FaunaArenaButtonBase
  id: FaunaArenaButtonRestock
  components:
  - type: FaunaArenaButton
    action: Restock
  - type: Sprite
    layers:
    - state: base
    - state: on
    - state: on-unshaded
      shader: unshaded
