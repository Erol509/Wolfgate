# Monsters converted from CitadelRP: skallax, rak, mole, fey fauna and the derelict horrors.

- type: entity
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: CitadelRPMobSkallaxYoung
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    sprite: _WF/Fauna/Mobs/CitadelRP/skallax.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: skallax_young
  - type: DamageStateVisuals
    states:
      Alive:
        Base: skallax_young
      Dead:
        Base: skallax_young_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_WF/Fauna/CitadelRP/slice.ogg
    angle: 0
    attackRate: 1.25
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 22
  - type: MovementSound
    sound:
      path: /Audio/_WF/Fauna/Polaris/spider_loop.ogg
  - type: FaunaGroupRetaliate
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 2

- type: entity
  parent: CitadelRPMobSkallaxYoung
  id: CitadelRPMobSkallaxWorker
