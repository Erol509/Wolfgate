# CHOMPStation space critters. Feeding one its food splits it, its evolve key turns it into the evolved form.

- type: entity
  abstract: true
  parent: FaunaMobSpaceBase
  id: CHOMPMobSpaceCritterBase
  components:
  - type: NPCRetaliation
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - Passive

# Sting ray of fire that heats the air around it, slowly at first, then fiercely past 200 C.
- type: entity
  parent: CHOMPMobSpaceCritterBase
  id: CHOMPMobSolarRay
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/CHOMP/space_critters.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: solarray
  - type: DamageStateVisuals
    states:
      Alive:
        Base: solarray
      Dead:
        Base: solarray-dead
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    armorPenetration: 0.3
    damage:
      types:
        Heat: 12
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [ Touch, Ingestion ]
    reactions:
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        damage:
          types:
            Poison: 1
  - type: Butcherable
    spawned:
    - id: CHOMPFoodMeatRay
      amount: 8
    - id: CHOMPMaterialWisp
      amount: 4
  - type: FaunaAirTemperature
    power: 25000
    target: 5273.15
    boostFrom: 473.15
    boostPower: 2500000
  - type: FaunaFeed
    foodStacks:
    - PlasmaOre
    evolveStacks:
    - Uranium
    evolveInto: CHOMPMobGalaxyRay

