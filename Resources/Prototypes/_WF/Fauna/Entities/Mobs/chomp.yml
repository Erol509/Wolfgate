# Ant hole. Every 15 minutes five ants of the ported kinds crawl out.
- type: entity
  parent: BaseStructure
  id: CHOMPAntHill
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _WF/Fauna/Objects/CHOMP/tribal_gear.rsi
    state: hole
    drawdepth: FloorObjects
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TimedSpawner
    prototypes:
    - CHOMPMobTyrAntBronze
    - CHOMPMobTyrAntCopper
    - CHOMPMobTyrAntQuartz
    - CHOMPMobTyrAntAgate
    - CHOMPMobTyrAntPainite
    - CHOMPMobTyrAntDiamond
    - CHOMPMobTyrAntVerdantium
    - CHOMPMobTyrAntUranium
    - CHOMPMobTyrAntMhydro
    - CHOMPMobTyrAntGraphite
    - CHOMPMobTyrAntSilver
    chance: 1
    intervalSeconds: 900
    minimumEntitiesSpawned: 5
    maximumEntitiesSpawned: 5
