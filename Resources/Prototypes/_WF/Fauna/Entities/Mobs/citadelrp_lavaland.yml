      state: curseblob
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CitadelRPEffectCurseBlob:
            min: 1
            max: 1
      - !type:DoActsBehavior
