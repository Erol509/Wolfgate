    sprite: _WF/Fauna/Mobs/CitadelRP/goldgrub.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goldgrub
    - map: [ "aggro" ]
      state: goldgrub_alert
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goldgrub
      Dead:
        Base: goldgrub_dead
  - type: GenericVisualizer
    visuals:
      enum.FaunaAggroVisuals.Aggro:
        enum.DamageStateVisualLayers.Base:
          True: { visible: false }
          False: { visible: true }
        aggro:
          True: { visible: true }
          False: { visible: false }
  - type: FaunaAggroCry
  - type: MobThresholds
    thresholds:
      0: Alive
      45: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 45
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          GoldOre1:
            min: 1
            max: 3
          SilverOre1:
            min: 0
            max: 2
          UraniumOre1:
            min: 0
            max: 1
          DiamondOre1:
            min: 0
            max: 1
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/punch1.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 0
  - type: FaunaRockHide
    exempt:
      components:
      - GatheringProjectile
  - type: Reflect
    reflects: [ Energy ]
    reflectProb: 1
  - type: FaunaDigAmbush
    hole: ShiptestAntlionBurrow
    fleeHealth: 1
  - type: FaunaCorpseEater
    whitelist:
      tags:
      - Ore
  - type: NpcFactionMember
    factions:
    - Passive
  - type: NPCRetaliation
  - type: FactionException
  - type: HTN
    rootTask:
      task: CitadelRPGoldgrubCompound

# Runs from attackers, otherwise eats ore off the floor.
- type: htnCompound
  id: CitadelRPGoldgrubCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargets
    - !type:HTNPrimitiveTask
      operator: !type:PickFleePointOperator
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
  - tasks:
    - !type:HTNCompoundTask
      task: FaunaEatItemCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: entity
  parent: [ FaunaMobConstructBase, FlyingMobBase ]
