# Lavaland creatures converted from CitadelRP (tg for the basilisk, goldgrub, gutlunch and dwarf legion).

- type: entity
  parent: [ MobLavalandGoliath, FaunaMobCore ]
  id: CitadelRPMobGoliathCalf
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    sprite: _WF/Fauna/Mobs/CitadelRP/goliath_calf.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath_baby
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath_baby
      Dead:
        Base: goliath_baby_dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.4
    baseSprintSpeed: 1.4
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/punch1.ogg
    angle: 0
    attackRate: 1.25
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 6
        Slash: 6
  - type: NPCUseActionOnTarget
    actionId: ActionGoliathCalfTentacle
  - type: HTN
    constantlyReplan: true
    rootTask:
      task: FaunaHostileFleeDyingCompound
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true
  - type: FaunaGroupRetaliate
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_WF/Fauna/VG/heavysmash.ogg
  - type: Speech
    allowedEmotes: [ CitadelRPEmoteGoliath ]
  - type: AutoEmote
    emotes: [ CitadelRPAutoEmoteGoliath ]
  - type: SolutionContainerManager
    solutions:
      udder:
        maxVol: 50
  - type: Udder
    reagentId: Ammonia
    quantityPerUpdate: 7.5
    growthDelay: 40
  - type: FaunaGrowth
    growInto: MobLavalandGoliath
    minDelay: 180
    maxDelay: 220
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 1
    - id: MaterialGoliathHide1
      amount: 2
    - id: ShiptestMaterialSinew
      amount: 2
    - id: MaterialBones1
      amount: 2

- type: entity
  parent: ActionGoliathTentacle
  id: ActionGoliathCalfTentacle
  components:
  - type: EntityWorldTargetAction
    raiseOnUser: true
    icon:
      sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath_tentacle_spawn
    iconOn:
      sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath_tentacle_wiggle
    sound:
      path: /Audio/Weapons/slash.ogg
    event: !type:GoliathSummonTentacleAction
      extraSpawns: 2
    useDelay: 15
    range: 4

- type: entity
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: CitadelRPMobGutlunch
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/CitadelRP/gutlunch.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: gutlunch
  - type: MobThresholds
    thresholds:
      0: Alive
      20: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PopupBehavior
        popup: fauna-citadelrp-gutlunch-death
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:SpillBehavior
        solution: food
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
      udder:
        maxVol: 50
  - type: Udder
    reagentId: Cream
    quantityPerUpdate: 3.5
    growthDelay: 30
  - type: FaunaRockHide
    exempt:
      components:
      - GatheringProjectile
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 0
  - type: NpcFactionMember
    factions:
    - Passive
  - type: NPCRetaliation
  - type: FactionException
  - type: HTN
    rootTask:
      task: FaunaFleeCompound
  - type: InteractionPopup
    successChance: 0.8
    interactSuccessString: petting-success-generic
    interactFailureString: petting-failure-generic

# Male gutlunch: smaller, in one of three colours.
