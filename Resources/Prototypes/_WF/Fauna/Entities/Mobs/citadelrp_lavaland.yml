    animation: WeaponArcPunch
    damage:
      types:
        Heat: 10
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound

# Shape the curse blob leaves when it dies.
- type: entity
  id: CitadelRPEffectCurseBlob
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/CitadelRP/curseblob.rsi
    state: curseblob
    drawdepth: Effects
  - type: TimedDespawn
    lifetime: 3.2

