# VOREStation (Virgo) space fauna, alien animals and the snowbull.

- type: entity
  abstract: true
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat ]
  id: FaunaMobSpaceBase
  components:
  - type: InputMover
  - type: MobMover
  - type: CombatMode
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MobState
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        9
  - type: Tag
    tags:
    - DoorBumpOpener

# Territorial kin of the space carp, it knocks its prey off balance.
- type: entity
  parent: FaunaMobSpaceBase
  id: VirgoMobShark
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Virgo/shark.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: shark
  - type: DamageStateVisuals
    states:
      Alive:
        Base: shark
      Dead:
        Base: shark_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      125: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    attackRate: 0.45
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 22
  - type: FaunaMeleeEffect
    chance: 0.1
    slow: 4
    popup: fauna-virgo-shark-knock
  - type: Butcherable
    spawned:
    - id: FoodMeatFish
      amount: 10

# Harmless drifter that only buffets what attacks it, then loses interest.
- type: entity
  parent: FaunaMobSpaceBase
  id: VirgoMobRay
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Virgo/ray.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: ray
  - type: DamageStateVisuals
    states:
      Alive:
        Base: ray
      Dead:
        Base: ray_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      125: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    attackRate: 0.55
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 7
  - type: FaunaMeleeEffect
    chance: 0.66
    slow: 4
    dropTarget: true
    popup: fauna-virgo-ray-buffet
    dropPopup: fauna-virgo-ray-lose-interest
  - type: NPCRetaliation
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - Passive
  - type: Butcherable
    spawned:
    - id: FoodMeatFish
      amount: 5
  - type: Speech
    allowedEmotes: [ VirgoRayIdle ]
  - type: AutoEmote
    emotes: [ VirgoRayIdle ]

# Ice-world bull that charges whatever threatens it.
- type: entity
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: VirgoMobSnowbull
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Virgo/snowbull.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: snowbull
    - map: [ "charge" ]
      state: snowbull-charge
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: snowbull
      Dead:
        Base: snowbull-dead
  - type: GenericVisualizer
    visuals:
      enum.FaunaChargeVisuals.Charging:
        charge:
          True: { visible: true }
          False: { visible: false }
        enum.DamageStateVisualLayers.Base:
          True: { visible: false }
          False: { visible: true }
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 17
  - type: FaunaCharge
    shake: 1.5
    range: 8
    windup: 1
    windupPopup: fauna-virgo-snowbull-prepare
    damage:
      types:
        Blunt: 21
    knockdown: 5
    throw: 1
    structureDamage:
      types:
        Structural: 20
  - type: FaunaAggroCry
    popup: fauna-virgo-snowbull-huff
  - type: FaunaGroupRetaliate
  - type: FaunaAbilities
    abilities:
    - action: VirgoActionSnowbullCharge
      minRange: 3
      maxRange: 8
      hold: 1
  - type: NPCRetaliation
    attackMemoryLength: 40
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - Passive
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 4
    - id: PolarisMaterialAnimalHide
      amount: 6

- type: entity
  parent: DS13ActionBase
  id: VirgoActionSnowbullCharge
  components:
  - type: EntityTargetAction
    useDelay: 10
    range: 8
    checkCanAccess: false
    sound:
      path: /Audio/_WF/Fauna/Virgo/snowbull_charge.ogg
    event: !type:FaunaChargeActionEvent

# Translucent space predator that drinks its prey's hunger and buds when full.
- type: entity
  parent: FaunaMobSpaceBase
  id: VirgoMobSpaceJellyfish
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Virgo/space_jellyfish.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: space_jellyfish
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: space_jellyfish-eyes
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: space_jellyfish
        BaseUnshaded: space_jellyfish-eyes
      Dead:
        Base: space_jellyfish_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 3.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_WF/Fauna/Virgo/tap.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 2
  - type: FaunaHungerDrain
  - type: FaunaHitAndRun
  - type: MobCollision
    fixtureId: none
  - type: Speech
    allowedEmotes: [ VirgoJellyfishIdle ]
  - type: AutoEmote
    emotes: [ VirgoJellyfishIdle ]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          VirgoFoodJellyfishCore:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: FoodMeatBase
  id: VirgoFoodJellyfishCore
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Virgo/jellyfish_core.rsi
    state: jellyfish_core
  - type: FlavorProfile
    flavors:
    - sweet
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Nutriment
          Quantity: 50

# Pulsing mass of darkness that throws smaller ghosts at its prey. Only lasers and energy hurt it.
- type: entity
  parent: FaunaMobSpaceBase
  id: VirgoMobSpaceGhost
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Virgo/space_ghost.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: space_ghost
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: space_ghost-eyes
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: space_ghost
        BaseUnshaded: space_ghost-eyes
      Dead:
        Base: space_ghost_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: FaunaEnergyOnly
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 1
  - type: SolutionContainerManager
    solutions:
      melee:
        reagents:
        - ReagentId: SpaceDrugs
          Quantity: 20
  - type: MeleeChemicalInjector
    transferAmount: 3
    solution: melee
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: SpaceDrugs
        Quantity: 1
  - type: FaunaAbilities
    abilities:
    - action: VirgoActionSpookyGhost
      maxRange: 7
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: DeleteOnTrigger
  - type: FaunaDeathSpawn
    popup: fauna-virgo-ghost-fade
    spawns:
    - id: DiamondOre1
    - id: Ectoplasm
      prob: 0.03

- type: entity
  parent: DS13ActionBase
  id: VirgoActionSpookyGhost
  components:
  - type: InstantAction
    useDelay: 7
    event: !type:InstantSpawnSpellEvent
      prototype: VirgoMobSpookyGhost
      posData: !type:TargetInFront

