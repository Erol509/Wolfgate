# Huge fire-breathing dragon that charges from afar, spins its tail when crowded and rages below half health.
- type: entity
  parent: SimpleSpaceMobBase
  id: VirgoMobLargeDragon
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: FaunaVirgoLargeDragon
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 100
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 900
      behaviors:
      - !type:GibBehavior { }
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Virgo/large_dragon.rsi
    layers:
    - map: [ "dead" ]
      state: dead
      visible: false
    - map: [ "under" ]
      state: underSmooth
    - map: [ "body" ]
      state: bodyScaled
    - map: [ "ears" ]
      state: earsNormal
    - map: [ "mane" ]
      state: maneShaggy
    - map: [ "horns" ]
      state: hornsCurved
    - map: [ "eyes" ]
      state: eyesNormal
      shader: unshaded
    - map: [ "flame" ]
      state: flame
      shader: unshaded
      visible: false
    - map: [ "rage" ]
      state: rage
      visible: false
  - type: RandomSprite
    getAllGroups: true
    available:
    - under:
        underSmooth: VirgoDragonColors
        underPlated: VirgoDragonColors
    - body:
        bodySmooth: VirgoDragonColors
        bodyScaled: VirgoDragonColors
    - mane:
        maneNone: VirgoDragonColors
        maneShaggy: VirgoDragonColors
        maneDorsalfin: VirgoDragonColors
  - type: GenericVisualizer
    visuals:
      enum.MobStateVisuals.State:
        dead:
          Alive: { visible: false }
          Critical: { visible: false }
          Dead: { visible: true }
        under:
          Alive: { visible: true }
          Critical: { visible: true }
          Dead: { visible: false }
        body:
          Alive: { visible: true }
          Critical: { visible: true }
          Dead: { visible: false }
        ears:
          Alive: { visible: true }
          Critical: { visible: true }
          Dead: { visible: false }
        mane:
          Alive: { visible: true }
          Critical: { visible: true }
          Dead: { visible: false }
        horns:
          Alive: { visible: true }
          Critical: { visible: true }
          Dead: { visible: false }
        eyes:
          Alive: { visible: true }
          Critical: { visible: true }
          Dead: { visible: false }
      enum.FaunaProjectileBurstVisuals.Windup:
        flame:
          True: { visible: true }
          False: { visible: false }
      enum.FaunaEnrageVisuals.Enraged:
        rage:
          True: { visible: true }
          False: { visible: false }
  - type: FaunaRandomTint
    palettes:
      horns: [ "#000000", "#151515", "#303030", "#606060", "#808080", "#AAAAAA", "#CCCCCC", "#EEEEEE", "#FFFFFF" ]
      ears: [ "#D0A090", "#C08070", "#A06050", "#E0B0A0", "#906050" ]
      eyes: [ "#FF3030", "#FFB000", "#30FF30", "#30A0FF", "#C040FF", "#FFFFFF" ]
    layers:
      horns: horns
      ears: ears
      eyes: eyes
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.25
    baseSprintSpeed: 3.25
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/slash.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 30
  - type: FaunaChargeLook
    lean: 0.25
  - type: FaunaCharge
    range: 7
    knockdown: 5
    windup: 2
    windupPopup: fauna-virgo-dragon-charge
    chargeSound:
      path: /Audio/_WF/Fauna/VG/spiderlunge.ogg
    damage:
      types:
        Blunt: 50
  - type: FaunaSlam
    arc: 360
    range: 2
    delay: 0.2
    knockdown: 1.5
    throw: 7
    emote: Spin
    damage:
      types:
        Blunt: 20
    hitSound:
      path: /Audio/Weapons/punchmiss.ogg
  - type: FaunaProjectileBurst
    projectile: VirgoProjectileDragonFlame
    spreadCount: 5
    spreadStep: 6
    windup: 2
    windupLight: true
    windupSound:
      path: /Audio/_WF/Fauna/Virgo/fireball.ogg
