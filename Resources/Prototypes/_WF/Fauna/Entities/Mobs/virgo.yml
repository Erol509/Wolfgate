  - type: FaunaShell
    shellModifierSet: FaunaStartreaderShell
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Blunt: 5
  - type: FaunaMeleeEffect
    chance: 0.15
    knockdown: 5
    skipDowned: true
    popup: fauna-virgo-startreader-trip
  - type: Butcherable
    spawned:
