  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true
  - type: Speech
    allowedEmotes: [ VirgoStartreaderIdle ]
  - type: AutoEmote
    emotes: [ VirgoStartreaderIdle ]

# Huge spider queen that keeps birthing short-lived broodlings, spits concentrated venom and bursts into spiders on death.
- type: entity
  parent: PolarisMobGiantSpiderBase
  id: VirgoMobGiantSpiderBroodmother
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 900
      behaviors:
      - !type:GibBehavior { }
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/spider_queen.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: spider_queen
  - type: DamageStateVisuals
    states:
      Alive:
        Base: spider_queen
      Dead:
        Base: spider_queen_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    armorPenetration: 0.15
    damage:
      types:
        Piercing: 32
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: Amatoxin
        Quantity: 1
  - type: MeleeChemicalInjector
    transferAmount: 1
    solution: melee
  - type: BasicEntityAmmoProvider
    proto: VirgoSpiderToxinShot
    capacity: 1
    count: 1
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    showExamineText: false
    rechargeSound: null
  - type: Gun
    recoil: 0
    fireRate: 0.5
    useKey: false
    showExamineText: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/pierce.ogg
  - type: FaunaBurrow
    closable: false
    interval: 6
    maxAlive: 8
    throwSpeed: 8
    prototypes:
    - VirgoMobGiantSpiderBroodlingHunter
    - VirgoMobGiantSpiderBroodlingLurker
    - VirgoMobGiantSpiderBroodlingTunneler
    - VirgoMobGiantSpiderBroodlingWebslinger
    - VirgoMobGiantSpiderBroodlingElectric
  - type: FaunaDeathSpawn
    popup: fauna-virgo-broodmother-burst
    spawns:
    - id: VirgoSpawnerBroodmotherDeathBrood
    - id: VirgoRoyalSpiderEgg
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 20

- type: entity
  parent: BaseBullet
  id: VirgoSpiderToxinShot
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Xenonids/Objects/Xeno/xeno_projectiles.rsi
    layers:
    - state: neurotoxin
      shader: unshaded
  - type: Projectile
    armorPenetration: 0.4
    damage:
      types:
        Caustic: 35
  - type: StaminaDamageOnCollide
    damage: 15
  - type: TimedDespawn
    lifetime: 3

# Eight picks from eleven giant spiders, for the broodmother's death. A hunter stands in for the plain guard.
- type: entity
  id: VirgoSpawnerBroodmotherDeathBrood
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    offset: 0.5
    table: !type:GroupSelector
      rolls: !type:ConstantNumberSelector
        value: 8
      children:
      - id: PolarisMobGiantSpiderFrost
      - id: PolarisMobGiantSpiderElectric
      - id: PolarisMobGiantSpiderHunter
      - id: PolarisMobGiantSpiderLurker
      - id: PolarisMobGiantSpiderPepper
      - id: PolarisMobGiantSpiderThermic
      - id: PolarisMobGiantSpiderTunneler
      - id: PolarisMobGiantSpiderWebslinger
      - id: PolarisMobGiantSpiderPhorogenic
      - id: PolarisMobGiantSpiderCarrier
      - id: PolarisMobGiantSpiderHunter

