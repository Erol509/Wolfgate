  id: VirgoMobStartreader
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1100
      behaviors:
      - !type:GibBehavior { }
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Virgo/startreader.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: startreader
    - map: [ "flipped" ]
      state: startreader_flipped
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: startreader
      Dead:
        Base: startreader_dead
  - type: GenericVisualizer
