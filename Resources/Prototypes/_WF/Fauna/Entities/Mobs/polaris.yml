      amount: 6

# Living players the hooligan crab can trail.
- type: utilityQuery
  id: PolarisNearbyPlayers
  query:
  - !type:ComponentQuery
    components:
    - type: Actor
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve

# Mauls whoever attacks it, otherwise trails the nearest player.
- type: htnCompound
  id: PolarisHooliganCrabCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: FaunaNearbyMaulTargets
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        brakeMaxVelocity: null
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
        targetState: Critical
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
      services:
      - !type:UtilityService
        id: MeleeService
        proto: FaunaNearbyMaulTargets
        key: Target
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: PolarisNearbyPlayers
        key: FollowEntity
        keyCoordinates: FollowTarget
    - !type:HTNCompoundTask
      task: FollowCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

