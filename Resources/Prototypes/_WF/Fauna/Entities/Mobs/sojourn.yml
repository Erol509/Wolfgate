# Sojourn Station planet fauna and big beasts.

- type: entity
  abstract: true
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: SojournMobBase
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true

# Armoured cold-terrain ambusher.
- type: entity
  parent: SojournMobBase
  id: SojournMobSamak
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Sojourn/samak.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: samak
  - type: DamageStateVisuals
    states:
      Alive:
        Base: samak
      Dead:
        Base: samak_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      130: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: FaunaSojournResist8
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 12
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 3
    - id: SojournWolfTooth
  - type: NpcFactionMember
    factions:
    - SojournSamak
  - type: Speech
    allowedEmotes: [ SojournEmoteSamak ]
  - type: AutoEmote
    emotes:
    - SojournAutoEmoteSamak
  - type: FaunaIdleSpeech
    chance: 0.025
    lines:
    - fauna-sojourn-samak-speech-1
    - fauna-sojourn-samak-speech-2

