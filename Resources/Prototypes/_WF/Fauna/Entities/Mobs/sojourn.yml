# Bites only what comes right next to it, with a toxic bite.
- type: entity
  parent: SojournMobBase
  id: SojournMobViper
  components:
  - type: WolfmedDamageCause
    cause: Bite
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _WF/Fauna/Mobs/Sojourn/viper.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: viper
  - type: DamageStateVisuals
    states:
      Alive:
        Base: viper
      Dead:
        Base: viper_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 6
  - type: SolutionContainerManager
    solutions:
      melee:
        reagents:
        - ReagentId: Toxin
          Quantity: 20
  - type: MeleeChemicalInjector
    transferAmount: 4
    solution: melee
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: Toxin
        Quantity: 1
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        3
      AggroVisionRadius: !type:Single
        3
      NavSmash: !type:Bool
        true
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 1
  - type: NpcFactionMember
    factions:
    - SojournPond
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer

