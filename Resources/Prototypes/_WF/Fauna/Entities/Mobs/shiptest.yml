# Planet creatures converted from Shiptest.

# Desert goliath: little health behind a tough hide. Grabs with tentacles up close and charges from further out.
- type: entity
  parent: [ MobGoliath, FaunaMobCore ]
  id: ShiptestMobGoliathWhitesands
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/goliath.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath
    - map: [ "preattack" ]
      state: goliath_preattack
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.FaunaTentacleVisuals.Ready:
        preattack:
          True: { visible: true }
          False: { visible: false }
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath
      Dead:
        Base: goliath_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ShiptestWhitesandsGoliath
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/punch1.ogg
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 16
  - type: NPCUseActionOnTarget
    actionId: ShiptestActionGoliathTentacle
  - type: FaunaChargeLook
    afterimage: "#FF0000"
  - type: FaunaCharge
    range: 7
    blockedStun: 10
    windup: 1
  - type: FaunaTentacleCooldown
  - type: FaunaRockHide
    projectileThreshold: 0
    throwThreshold: 10
  - type: PreventPulledWhileAlive
  - type: FaunaDeathSpawn
    spawns:
    - id: ShiptestGemRupee
      prob: 0.0025
    - id: ShiptestGemFrostDiamond
      prob: 0.0025
    - id: ShiptestGemVoid
      prob: 0.0025
    - id: ShiptestGemPhoron
      prob: 0.0025
  - type: FaunaAbilities
    abilities:
    - action: ShiptestActionGoliathCharge
      minRange: 3
      maxRange: 7
      hold: 1
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 2
    - id: MaterialBones1
      amount: 2
    - id: MaterialGoliathHide1
      amount: 2
    - id: SilverOre1
      amount: 10
    - id: ShiptestMaterialSinew
      amount: 2
    - id: ShiptestTrophyGoliathTentacle
      prob: 0.25

- type: entity
  parent: ShiptestMobGoliathWhitesands
  id: ShiptestMobGoliathWhitesandsAncient
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/goliath.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: ancient
    - map: [ "aggro" ]
      state: ancient_alert
      visible: false
    - map: [ "preattack" ]
      state: ancient_preattack
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: ancient
      Dead:
        Base: ancient_dead
  - type: GenericVisualizer
    visuals:
      enum.FaunaAggroVisuals.Aggro:
        enum.DamageStateVisualLayers.Base:
          True: { visible: false }
          False: { visible: true }
        aggro:
          True: { visible: true }
          False: { visible: false }
      enum.FaunaTentacleVisuals.Ready:
        preattack:
          True: { visible: true }
          False: { visible: false }
  - type: FaunaAggroCry
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ShiptestWhitesandsGoliathAncient
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.2
  - type: FaunaTentacleField
    tentacle: ShiptestEffectGoliathTentacle
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 2
    - id: MaterialBones1
      amount: 2
    - id: SilverOre1
      amount: 10
    - id: ShiptestMaterialSinew
      amount: 2
    - id: ShiptestTrophyElderTentacle
      prob: 0.75
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: FaunaLurkCompound
    blackboard:
      VisionRadius: !type:Single
        6
      AggroVisionRadius: !type:Single
        10

