# Desert basilisk: a shell takes every hit until it cracks, and drops two diamonds when it does.
- type: entity
  parent: [ CitadelRPMobBasilisk, FaunaMobCore ]
  id: ShiptestMobBasiliskWhitesands
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/basilisk.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: basilisk
    - map: [ "aggro" ]
      state: charge
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: basilisk
      Dead:
        Base: basilisk_dead
  - type: GenericVisualizer
    visuals:
      enum.FaunaBreakableShellVisuals.Stage:
        enum.DamageStateVisualLayers.Base:
          Whole: { state: basilisk }
          Cracked: { state: basilisk_cracked }
          Broken: { state: basilisk_broken }
          Dead: { state: basilisk_dead }
      enum.FaunaAggroVisuals.Aggro:
        aggro:
          True: { visible: true }
          False: { visible: false }
  - type: FaunaAggroCry
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 11
        Structural: 60
  - type: FaunaBreakableShell
    loot:
    - DiamondOre1
    - DiamondOre1
  - type: FaunaRockHide
    projectileThreshold: 0
  - type: NpcFactionMember
    factions:
    - ShiptestBasilisk
  - type: Butcherable
    spawned:
    - id: ShiptestMaterialSinew
      amount: 4
    - id: MaterialBones1
      amount: 2

# Lava-planet goldgrub: flees, sets the ground behind it alight and bursts into flames when it dies.
- type: entity
  parent: [ CitadelRPMobGoldgrub, FaunaMobCore ]
  id: ShiptestMobLavagrub
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/lavagrub.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: lavagrub
    - map: [ "aggro" ]
      state: lavagrub_alert
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: lavagrub
      Dead:
        Base: lavagrub_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      45: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ShiptestLavagrub
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 45
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          GoldOre1:
            min: 1
            max: 3
          SilverOre1:
            min: 0
            max: 2
          UraniumOre1:
            min: 0
            max: 1
          DiamondOre1:
            min: 0
            max: 1
  - type: FaunaFireTrail
    fire: ShiptestEffectTurfFire
  - type: FaunaRockHide
    projectileThreshold: 0
  - type: FaunaDigAmbush
    hole: ShiptestAntlionBurrow
    fleeHealth: 1
    fleeDelay: 10

- type: entity
  parent: ActionGoliathTentacle
  id: ShiptestActionGoliathTentacle
  components:
  - type: EntityWorldTargetAction
    raiseOnUser: true
    icon:
      sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath_tentacle_spawn
    sound:
      path: /Audio/Weapons/slash.ogg
    event: !type:GoliathSummonTentacleAction
      entityId: ShiptestEffectGoliathTentacle
    useDelay: 12
    range: 3

- type: entity
  parent: ShiptestActionGoliathTentacle
  id: ShiptestActionGruboidTentacle
  components:
  - type: EntityWorldTargetAction
    raiseOnUser: true
    icon:
      sprite: _WF/Fauna/Mobs/Shiptest/gruboid.rsi
      state: tentacle_wiggle
    sound:
      path: /Audio/Weapons/slash.ogg
    event: !type:GoliathSummonTentacleAction
      entityId: ShiptestEffectGruboidTentacle
    useDelay: 12
    range: 3

- type: entity
  parent: ShiptestActionGruboidTentacle
  id: ShiptestActionGruboidBabyTentacle
  components:
  - type: EntityWorldTargetAction
    raiseOnUser: true
    icon:
      sprite: _WF/Fauna/Mobs/Shiptest/gruboid.rsi
      state: tentacle_wiggle
    sound:
      path: /Audio/Weapons/slash.ogg
    event: !type:GoliathSummonTentacleAction
      entityId: ShiptestEffectGruboidTentacle
      extraSpawns: 0
    useDelay: 4
    range: 7

- type: entity
  parent: DS13ActionBase
  id: ShiptestActionGoliathCharge
  components:
  - type: EntityTargetAction
    useDelay: 12
    range: 7
    checkCanAccess: false
    event: !type:FaunaChargeActionEvent

- type: entity
  parent: EffectGoliathTentacleSpawn
  id: ShiptestEffectGoliathTentacle
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnOnDespawn
    prototype: ShiptestGoliathTentacle

- type: entity
  parent: GoliathTentacle
  id: ShiptestGoliathTentacle
  categories: [ HideSpawnMenu ]
  components:
  - type: StunOnContact
    blacklist:
      components:
      - MobState
  - type: DamageOnCollide
    damage:
      types:
        Blunt: 22
    whitelist:
      components:
      - MobState
  - type: SpawnOnDespawn
    prototype: ShiptestGoliathTentacleSnare

# Holds the legs of whoever stands where the tentacle rose, until they break free.
- type: entity
  id: ShiptestGoliathTentacleSnare
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: True
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        layer:
        - LowImpassable
  - type: Sprite
    sprite: Mobs/Aliens/Asteroid/goliath.rsi
    drawdepth: FloorObjects
    state: goliath_tentacle_wiggle
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Goliath
  - type: Ensnaring
    freeTime: 5
    breakoutTime: 5
    walkSpeed: 0.1
    sprintSpeed: 0.1
    staminaDamage: 0
    canMoveBreakout: true
    maxEnsnares: 1
  - type: TimedDespawn
    lifetime: 5
  - type: SpawnOnDespawn
    prototype: EffectGoliathTentacleRetract

- type: entity
  parent: EffectGoliathTentacleSpawn
  id: ShiptestEffectGruboidTentacle
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/gruboid.rsi
    state: tentacle_spawn
  - type: SpawnOnDespawn
    prototype: ShiptestGruboidTentacle

- type: entity
  parent: ShiptestGoliathTentacle
  id: ShiptestGruboidTentacle
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/gruboid.rsi
    layers:
    - state: tentacle_wiggle
  - type: SpawnOnDespawn
    prototype: ShiptestEffectGruboidTentacleRetract

- type: entity
  parent: EffectGoliathTentacleRetract
  id: ShiptestEffectGruboidTentacleRetract
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/gruboid.rsi
    state: tentacle_retract

# Burning ground left by a lavagrub. Sets alight whoever walks into it.
- type: entity
  id: ShiptestEffectTurfFire
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      ignition:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: IgniteOnCollide
    fireStacks: 1
    count: 5
  - type: IgnitionSource
    temperature: 700
    ignited: true
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/turf_fire.rsi
    drawdepth: FloorObjects
    state: red_small
  - type: PointLight
    radius: 1.5
    energy: 1.5
    color: "#FA9632"
  - type: TimedDespawn
    lifetime: 10

# Crystal-riddled ancient goliath: convulses, then sprays crystal shards that grow spires where they land. Spires
# also keep bursting out of the ground around it.
- type: entity
  parent: [ MobGoliath, FaunaMobCore ]
  id: ShiptestMobGoliathCrystal
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/crystal.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goliath
    - map: [ "preattack" ]
      state: goliath_preattack
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath
      Dead:
        Base: goliath_dead
  - type: GenericVisualizer
    visuals:
      enum.FaunaProjectileBurstVisuals.Windup:
        preattack:
          True: { visible: true }
          False: { visible: false }
        enum.DamageStateVisualLayers.Base:
          True: { visible: false }
          False: { visible: true }
  - type: MobThresholds
    thresholds:
      0: Alive
      180: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ShiptestGoliath
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.2
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/punch1.ogg
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 16
  - type: NPCUseActionOnTarget
    actionId: ShiptestActionCrystalTentacle
  - type: FaunaTentacleField
    tentacle: ShiptestEffectCrystalSpire
  - type: FaunaProjectileBurst
    projectile: ShiptestProjectileCrystalShard
    speed: 10
    spiralChance: 0.2
    windup: 1
    windupJitter: 4
    windupSound:
      path: /Audio/_WF/Fauna/Shiptest/crystal_magic.ogg
    spreadSound:
      path: /Audio/_WF/Fauna/Shiptest/crystal_bamf.ogg
    spiralSound:
      path: /Audio/_WF/Fauna/Shiptest/crystal_charge.ogg
    windupPopup: fauna-crystal-goliath-windup
    spreadPopup: fauna-crystal-goliath-spread
    spiralPopup: fauna-crystal-goliath-spiral
  - type: FaunaAbilities
    abilities:
    - action: ShiptestActionCrystalBurst
      maxRange: 9
      hold: 1
  - type: FaunaTentacleCooldown
  - type: FaunaRockHide
    projectileThreshold: 0
    throwThreshold: 10
  - type: PreventPulledWhileAlive
  - type: FaunaDeathSpawn
    spawns:
    - id: ShiptestGemRupee
      prob: 0.0025
    - id: ShiptestGemFrostDiamond
      prob: 0.0025
    - id: ShiptestGemVoid
      prob: 0.0025
    - id: ShiptestGemPhoron
      prob: 0.0025
  - type: Butcherable
    spawned:
    - id: FoodMeatGoliath
      amount: 2
    - id: MaterialBones1
      amount: 2
    - id: SilverOre1
      amount: 10
    - id: ShiptestMaterialSinew
      amount: 2
    - id: ShiptestStrangeCrystal
      amount: 2
    - id: ShiptestTrophyElderTentacle
      prob: 0.25

