# Shoots and fights in melee, otherwise eats ore off the floor.
- type: htnCompound
  id: ShiptestWatcherCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: InnateRangedCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: FaunaEatItemCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

