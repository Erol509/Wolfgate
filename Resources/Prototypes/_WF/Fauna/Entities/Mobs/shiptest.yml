      hold: 1
    - action: ShiptestActionWendigoBlink
      minRange: 2
      maxRange: 9
    - action: ShiptestActionWendigoScream
      maxRange: 7
      hold: 1.2
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_WF/Fauna/Shiptest/gravhit.ogg
  - type: FaunaCorpseEater
    delay: 1
    consume: true
    healTargetFraction: 0.5
    healGroup: Brute
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: FaunaCorpseEaterCompound
    blackboard:
      VisionRadius: !type:Single
        9
      AggroVisionRadius: !type:Single
        18
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 10

- type: entity
  id: ShiptestEffectSmallSmoke
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.5
  - type: Sprite
    drawdepth: Effects
    sprite: _WF/Fauna/Mobs/Shiptest/smoke.rsi
    state: smoke
    noRot: true
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: DS13ActionBase
  id: ShiptestActionWendigoStomp
  components:
  - type: EntityTargetAction
    useDelay: 10
    range: 4
    checkCanAccess: false
    event: !type:FaunaSlamActionEvent

- type: entity
  parent: DS13ActionBase
  id: ShiptestActionWendigoBlink
  components:
  - type: EntityTargetAction
    useDelay: 10
    range: 9
    checkCanAccess: false
    event: !type:FaunaBlinkActionEvent

- type: entity
  parent: DS13ActionBase
  id: ShiptestActionWendigoScream
  components:
  - type: InstantAction
    useDelay: 6
    sound:
      path: /Audio/Effects/demon_dies.ogg
    event: !type:FaunaShoutActionEvent

# Lava-planet puffer. Harmless until it spots prey, then puffs up into a nearly invincible biter that chews through
# walls. Shrinks back after a while and has to rest before it can puff up again.
- type: entity
  parent: SimpleSpaceMobBase
  id: ShiptestMobFugu
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Shiptest/fugu.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "body" ]
      state: fugu
    - map: [ "inflated" ]
      state: inflated
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: fugu
      Dead:
        Base: dead
  - type: GenericVisualizer
    visuals:
      enum.FaunaInflateVisuals.Inflated:
        body:
          True: { visible: false }
          False: { visible: true }
        inflated:
          True: { visible: true }
          False: { visible: false }
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ShiptestFugu
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/punch1.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 0
  - type: FaunaInflate
    modifierSet: ShiptestFuguInflated
    popup: fauna-shiptest-fugu-inflate
    damage:
      types:
        Piercing: 17.5
        Structural: 60
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: ShiptestFuguCompound
    blackboard:
      VisionRadius: !type:Single
        5
      AggroVisionRadius: !type:Single
        9
  - type: Butcherable
    spawned:
    - id: FoodMeatFish
      amount: 2
  - type: FaunaDeathSpawn
    spawns:
    - id: ShiptestFuguGland

# Keeps its distance while deflated and fights once inflated.
- type: htnCompound
  id: ShiptestFuguCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargets
      preconditions:
      - !type:FaunaInflatedPrecondition
        inflated: false
    - !type:HTNPrimitiveTask
      operator: !type:PickFleePointOperator
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
  - tasks:
    - !type:HTNCompoundTask
      task: SimpleHostileCompound

# Carnivorous plant that lashes up to four vines onto its prey and drags them in.
- type: entity
  parent: SimpleSpaceMobBase
  id: ShiptestMobVenusHumanTrap
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Fauna/Mobs/Shiptest/venus.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: venus
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 3.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 18
  - type: IgnoreKudzu
  - type: GhostRole
    makeSentient: true
    allowSpeech: false
    allowMovement: true
    name: fauna-shiptest-venus-ghost-role-name
    description: fauna-shiptest-venus-ghost-role-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgent
  - type: GhostTakeoverAvailable
  - type: FaunaVine
    beam: ShiptestVineBeam
    popup: fauna-shiptest-venus-vine
    yankAll: true
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound

- type: entity
  id: ShiptestVineBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/vines.rsi
    drawdepth: Effects
    layers:
    - state: vine
  - type: Physics
    canCollide: false
  - type: Beam
  - type: TimedDespawn
    lifetime: 2.1
  - type: Tag
    tags:
    - HideContextMenu

# Pulsating bud that sprouts thorny vines around it and grows into a venus human trap.
- type: entity
  id: ShiptestFlowerBud
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/vines.rsi
    layers:
    - state: flower_bud
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - MidImpassable
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TriggerOnSpawn
  - type: SpawnOnTrigger
    proto: ShiptestThornVinePattern
  - type: TimedDespawn
    lifetime: 120
  - type: SpawnOnDespawn
    prototype: ShiptestMobVenusHumanTrap

- type: entity
  id: ShiptestThornVinePattern
  categories: [ HideSpawnMenu ]
  components:
  - type: FaunaBlastPattern
    effect: ShiptestThornVine
    shape: Cross
    radius: 2
    cross: Diagonal

- type: entity
  id: ShiptestThornVine
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/Shiptest/vines.rsi
    drawdepth: FloorObjects
    layers:
    - state: vine
  - type: Clickable
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
