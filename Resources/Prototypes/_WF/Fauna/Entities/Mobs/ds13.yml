# Necromorphs converted from DS13-2.0. They have no crit and pry doors open. The ubermorph is very tough and regenerates.

- type: entity
  abstract: true
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: DS13MobNecromorphBase
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Sprite
    drawdepth: Mobs
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: FaunaNecromorph
  - type: Stamina
    critThreshold: 100000
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 13
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 3
  - type: FlashImmunity
  - type: FaunaHurt
    sound:
      collection: DS13NecromorphPain
  - type: FaunaMeleeEffect
    chance: 0
    missChance: 0.1
    missPopup: fauna-melee-miss
    altChance: 0.09
    altDamage:
      types:
        Piercing: 13
  - type: Vocal
    sounds:
      Male: DS13Necromorph
      Female: DS13Necromorph
      Unsexed: DS13Necromorph
    screamAction: null
  - type: AutoEmote
    emotes:
    - DS13AutoEmoteSpeech
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavPry: !type:Bool
        true

- type: entity
  parent: DS13MobNecromorphBase
  id: DS13MobBrute
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 710
      behaviors:
      - !type:GibBehavior { }
  - type: Sprite
    sprite: _WF/Fauna/Mobs/DS13/brute.rsi
    layers:
    - state: brute_l_leg
    - state: brute_r_leg
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: brute_chest
    - state: brute_head
    - state: brute_l_arm
    - state: brute_r_arm
  - type: MobThresholds
    thresholds:
      0: Alive
      510: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: FaunaNecromorphBrute
  - type: CMArmor
    frontalArmor: 50
    sideArmor: 20
  - type: RMCStunResistance
    resistance: 3
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2
    baseSprintSpeed: 2.2
  - type: MeleeWeapon
    soundHit:
      collection: DS13BruteAttack
    attackRate: 0.4
    animation: WeaponArcSmash
    damage:
      types:
        Blunt: 26
  - type: MeleeThrowOnHit
    distance: 3
    speed: 8
  - type: SoundOnDeath
    sound:
      collection: DS13BruteDeath
  - type: FaunaHurt
    sound:
      collection: DS13BrutePain
  - type: FootstepModifier
    footstepSoundCollection:
      collection: DS13BruteFootsteps
  - type: FaunaSlam
    damage:
      types:
        Blunt: 25
    range: 3
    arc: 90
    delay: 2
    knockdown: 3
    telegraph: DS13EffectBruteSlamTelegraph
    structureDamage:
      types:
        Structural: 150
    hitSound:
      path: /Audio/_WF/Xenonids/Effects/meteorimpact.ogg
  - type: FaunaCharge
    range: 6
    throw: 2
    windup: 1
    windupPopup: fauna-brimdemon-charge
    shake: 1.5
    structureDamage:
      types:
        Structural: 150
  - type: FaunaShout
    effect: CMEffectScreech
    jitter: 1.5
  - type: FaunaAbilities
    abilities:
    - action: DS13ActionBruteSlam
      maxRange: 2.5
      hold: 2
    - action: DS13ActionCharge
      minRange: 3
      maxRange: 7
    - action: DS13ActionBioBomb
      minRange: 3
      maxRange: 10
      hold: 1.25
    - action: DS13ActionBruteShout

- type: entity
  parent: RMCEffectXenoTelegraphRed
  id: DS13EffectBruteSlamTelegraph
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2

