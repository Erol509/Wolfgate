# Creatures converted from /vg/station.

# Every attack calls up a gingerbomination instead of hitting.
- type: entity
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: VGMobGingerbroodmother
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 500
      behaviors:
      - !type:GibBehavior { }
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/gingerbroodmother.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: gingerbroodmother
  - type: DamageStateVisuals
    states:
      Alive:
        Base: gingerbroodmother
      Dead:
        Base: gingerbroodmother_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.5
    baseSprintSpeed: 0.5
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
  - type: Gun
    recoil: 0
    fireRate: 0.2
    selectedMode: SemiAuto
    showExamineText: false
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/pierce.ogg
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 0
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: VGMobGingerbominationMinion
    capacity: 1
    count: 1
  - type: SoundOnDeath
    sound: /Audio/_WF/Fauna/VG/stone_crumble.ogg
  - type: FaunaDeathSpawn
    popup: fauna-vg-gingerbroodmother-crumble
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: VGGingerbroodmotherCompound
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        9
  - type: Butcherable
    spawned:
    - id: VGFoodRoyalGingjelly

- type: entity
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: VGMobGingerbomination
  components:
  - type: WolfmedDamageCause
    cause: Melee
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/gingerbomination.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: gingerbomination
  - type: DamageStateVisuals
    states:
      Alive:
        Base: gingerbomination
      Dead:
        Base: gingerbomination_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 3.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 0
    attackRate: 0.5
    animation: WeaponArcThrust
    damage:
      types:
        Piercing: 12
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        8
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
  - type: Speech
    speechVerb: VGGingerbomination
  - type: FaunaIdleSpeech
    lines:
    - fauna-vg-gingerbomination-say-1
    - fauna-vg-gingerbomination-say-2
    chance: 0.005

- type: speechVerb
  id: VGGingerbomination
  name: fauna-vg-gingerbomination-verb-name
  speechVerbStrings:
  - fauna-vg-gingerbomination-verb-1
  - fauna-vg-gingerbomination-verb-2
  - fauna-vg-gingerbomination-verb-3

# The gingerbomination the broodmother fires as her attack.
- type: entity
  parent: VGMobGingerbomination
  id: VGMobGingerbominationMinion
  categories: [ HideSpawnMenu ]
  components:
  - type: Ammo
    muzzleFlash: null

- type: entity
  parent: FoodMeatBase
  id: VGFoodRoyalGingjelly
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/gingjelly.rsi
    state: icon
  - type: FlavorProfile
    flavors:
    - sweet
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 10
        - ReagentId: RoyalGingjelly
          Quantity: 5

- type: reagent
  id: RoyalGingjelly
  name: reagent-name-royal-gingjelly
  group: Toxins
  desc: reagent-desc-royal-gingjelly
  physicalDesc: reagent-physical-desc-sticky
  flavor: sweet
  color: "#C98B3A"
  metabolisms:
    Poison:
      metabolismRate: 0.5
      effects:
      - !type:Polymorph
        prototype: VGGingerbomination
        conditions:
        - !type:ReagentThreshold
          min: 1

- type: polymorph
  id: VGGingerbomination
  configuration:
    entity: VGMobGingerbomination
    forced: true
    inventory: Drop
    allowRepeatedMorphs: true

# Eats corpses to heal and enrages below half health.
- type: entity
