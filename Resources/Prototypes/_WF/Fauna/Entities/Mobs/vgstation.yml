  id: VGMobWendigoAlpha
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 700
      behaviors:
      - !type:GibBehavior { }
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/wendigo.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: wendigo
    - map: [ "enraged" ]
      state: wendigo_enraged
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: wendigo
      Dead:
        Base: wendigo_dead
  - type: GenericVisualizer
    visuals:
      enum.FaunaEnrageVisuals.Enraged:
        enraged:
          True: { visible: true }
          False: { visible: false }
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_WF/Fauna/VG/heavysmash.ogg
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 42
        Structural: 40
  - type: MeleeThrowOnHit
    distance: 10
    speed: 8
  - type: FaunaThrowChance
    chance: 0.25
  - type: FaunaEnrage
    speed: 1.25
    damage:
      types:
        Blunt: 67
        Structural: 80
  - type: FaunaIdleSpeech
    lines:
    - fauna-vg-wendigo-say-1
    - fauna-vg-wendigo-say-2
    - fauna-vg-wendigo-say-3
    - fauna-vg-wendigo-say-4
    chance: 0.075
  - type: FaunaCorpseEater
    heal: 17
    bite:
      types:
        Slash: 17
    sound: /Audio/Effects/bite.ogg
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: FaunaCorpseEaterCompound
    blackboard:
      VisionRadius: !type:Single
        12
      AggroVisionRadius: !type:Single
        12
      NavSmash: !type:Bool
        true
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 1

# Shoots webs that root, cocoons the dead and lays an egg cluster for each cocoon.
- type: entity
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: VGMobSpiderQueen
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 600
      behaviors:
      - !type:GibBehavior { }
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/spider_queen.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: spider_queen
  - type: DamageStateVisuals
    states:
      Alive:
        Base: spider_queen
      Dead:
        Base: spider_queen_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_WF/Fauna/VG/spiderlunge.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 35
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 30
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: ChloralHydrate
        Quantity: 1
  - type: FaunaMeleeProc
    chance: 0.1
    solution: melee
    transferAmount: 10
  - type: PassiveDamage
    allowedStates:
    - Alive
    damageCap: 500
    damage:
      groups:
        Brute: -1
        Burn: -1
  - type: Gun
    fireRate: 0.25
    recoil: 0
    selectedMode: SemiAuto
    showExamineText: false
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/pierce.ogg
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 4
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: VGSpiderWebShot
    capacity: 1
    count: 1
  - type: FaunaCorpseEater
    cocoon: VGSpiderCocoon
    spawn: VGSpiderEggCluster
    whitelist:
      components:
      - Item
    startPopup: fauna-cocoon-start
    donePopup: fauna-cocoon-done
  - type: Spider
    webPrototype: VGSpiderStickyWeb
  - type: IgnoreSpiderWeb
  - type: FaunaAbilities
    abilities:
    - action: ActionSpiderWeb
      maxRange: 10
  - type: NpcFactionMember
    factions:
    - SojournSpiders
  - type: HTN
    rootTask:
      task: VGSpiderQueenCompound
    blackboard:
      ChaseRange: !type:Single
        8
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 2
    - id: FoodMeatSpiderLeg
      amount: 8
  - type: Speech
    allowedEmotes: [ VGSpiderIdle ]
  - type: AutoEmote
    emotes: [ VGSpiderIdle ]

# Chases and bites when close, webs from where it stands while walking in, then cocoons corpses and loose items.
- type: htnCompound
  id: VGSpiderQueenCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: FaunaAdjacentMeleeCompound
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyMeleeTargets
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: ChaseRange
      operator: !type:NoOperator
    - !type:HTNCompoundTask
      task: BeforeMeleeAttackTargetCompound
  - preconditions:
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyGunTargets
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      operator: !type:FaunaGunOperator
        gun: !type:GunOperator
          targetKey: Target
      services:
      - !type:UtilityService
        id: RangedService
        proto: NearbyGunTargets
        key: Target
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: FaunaEatCorpseCompound
  - tasks:
    - !type:HTNCompoundTask
      task: FaunaEatItemCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

# Gun targets in sight, ignoring its own minions in the line of fire.
- type: utilityQuery
  id: VGGingerbroodmotherTargets
  query:
  - !type:NearbyHostilesQuery
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetIsCritCon
    curve: !type:InverseBoolCurve
  - !type:TurretTargetingCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetHealthCon
    curve: !type:PresetCurve
      preset: TargetHealth
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve
  - !type:TargetInLOSOrCurrentCon
    curve: !type:BoolCurve

# Only throws minions, never melees.
- type: htnCompound
  id: VGGingerbroodmotherCompound
  branches:
  - preconditions:
    - !type:GunAmmoPrecondition
      minPercent: 0.001
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: VGGingerbroodmotherTargets
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        stopOnLineOfSight: true
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:JukeOperator
        jukeType: AdjacentTile
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      operator: !type:FaunaGunOperator
        gun: !type:GunOperator
          targetKey: Target
      services:
      - !type:UtilityService
        id: RangedService
        proto: VGGingerbroodmotherTargets
        key: Target
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

# Roots whoever it hits until they break out. A miss leaves a sticky web where it lands.
- type: entity
  parent: BaseItem
  id: VGSpiderWebShot
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/web_shot.rsi
    state: web
  - type: Ammo
    muzzleFlash: null
  - type: ThrowingAngle
    angle: 0
  - type: EmitSoundOnLand
    sound: /Audio/_WF/Fauna/VG/hivehand_empty.ogg
  - type: Ensnaring
    freeTime: 2
    breakoutTime: 3
    walkSpeed: 0.1
    sprintSpeed: 0.1
    staminaDamage: 0
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: FaunaFactionPass
    factions:
    - SojournSpiders
  - type: Damageable
    damageContainer: Inorganic
  - type: DamageOnLand
    damage:
      types:
        Blunt: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: SpiderWeb
  id: VGSpiderStickyWeb
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/spider_effects.rsi
    layers:
    - state: stickyweb1
      map: [ "spiderWebLayer" ]
  - type: GenericVisualizer
    visuals:
      enum.SpiderWebVisuals.Variant:
        spiderWebLayer:
          1: { state: stickyweb1 }
          2: { state: stickyweb2 }

- type: entity
  parent: BaseStructure
  id: VGSpiderCocoon
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/spider_effects.rsi
    layers:
    - state: cocoon_large1
      map: [ "random" ]
  - type: RandomSprite
    available:
    - random:
        cocoon_large1: ""
        cocoon_large2: ""
        cocoon_large3: ""
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      cocoon: !type:Container
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Hatches 4 to 6 spiderlings once, after about two minutes.
- type: entity
  id: VGSpiderEggCluster
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/spider_effects.rsi
    state: eggs
    drawdepth: FloorObjects
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TimedDespawn
    lifetime: 120
  - type: SpawnOnDespawn
    prototype: VGSpiderHatching

- type: entity
  id: VGSpiderHatching
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    offset: 0.3
    table: !type:EntSelector
      id: VGMobSpiderling
      amount: !type:RangeNumberSelector
        range: 4, 6

- type: entity
  parent: [ BaseMobAsteroid, FaunaMobCore ]
  id: VGMobSpiderling
  components:
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 1
  - type: Sprite
    sprite: _WF/Fauna/Mobs/VG/spiderling.rsi
    layers:
    - state: spiderling
  - type: MobThresholds
    thresholds:
      0: Alive
      12: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: NpcFactionMember
    factions:
    - SojournSpiders
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [ Touch, Ingestion ]
    reactions:
    - reagents: [ PestKiller ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 12
  - type: FaunaGrowth
    growInto: PolarisMobGiantSpiderHunter
    chance: 0.75
    minDelay: 200
    maxDelay: 400

