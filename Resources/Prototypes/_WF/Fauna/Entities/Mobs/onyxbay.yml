# Lives 10 s and comes every 2 s, so a hoverhead keeps at most five.
- type: entity
  parent: [ BaseMobAsteroid, FlyingMobBase ]
  id: OnyxBayMobPsychokineticAnomaly
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/OnyxBay/hoverhead.rsi
    layers:
    - state: anomaly
      shader: unshaded
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
    angle: 0
    attackRate: 0.5
    animation: WeaponArcPunch
    damage:
      types:
        Heat: 2
  - type: Ammo
    muzzleFlash: null
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        10
      AggroVisionRadius: !type:Single
        10
  - type: TimedDespawn
    lifetime: 10

- type: entity
  parent: FoodHivelordRemains
  id: OnyxBayAnomalousCore
  components:
  - type: Sprite
    sprite: _WF/Fauna/Mobs/OnyxBay/hoverhead.rsi
    state: core
