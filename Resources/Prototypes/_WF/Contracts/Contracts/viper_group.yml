  tier: 3
  title: wf-contract-vg-convoy-raid
  briefing: wf-contract-vg-convoy-raid-brief
  reward: 50000, 62500
  deposit: 3000
  minutes: 60
  weight: 1.0
  minCrew: 2
  crewBonus: 0.25
