- type: wfContract
  id: WFContractVGPrizeHull
  contractor: WFContractorViperGroup
  category: Salvage
  tier: 3
  title: wf-contract-vg-prize-hull
  briefing: wf-contract-vg-prize-hull-brief
  reward: 40000, 50000
  deposit: 2500
  minutes: 75
  weight: 1.0
  minCrew: 2
  crewBonus: 0.25
  credits: 3
  creditEntity: TradeGoodShipComponents
  requires:
  - tag: WFTowRope
    name: wf-contract-requires-rope
  - entity: WFTetherInstaller
    name: wf-contract-requires-tether-installer
  objective: !type:WFContractTow
    minDistance: 3500
    maxDistance: 5500
    stationClearance: 2500
    infestation:
    - entity: MobSyndicateFootsoldier
      count: 1, 3
    wrecks:
    - /Maps/Salvage/medium-pirate.yml
    - /Maps/Salvage/small-syndicate.yml
    - /Maps/Salvage/hauling-shuttle.yml

