# ASF field research: science work for the Astraeus Solar Federation, posted on the Lantern Post's board and paid in
# thalers and Astraeus Reward Grants.

- type: wfContract
  id: WFContractAsfAnomalySurvey
  contractor: WFContractorAsfResearch
  category: Science
  tier: 1
  title: wf-contract-asf-anomaly-survey
  briefing: wf-contract-asf-anomaly-survey-brief
  reward: 8000, 11000
  minutes: 45
  crewBonus: 0.25
  weight: 1.5
  credits: 10
  creditEntity: WFAsfRewardGrant1
  objective: !type:WFContractSurvey
    count: 1, 2
    perAnomaly: 2500
    minDistance: 2500
    maxDistance: 4000
    stationClearance: 2000
    anomalies: [ AnomalyGravity, AnomalyElectricity, AnomalyIce, AnomalyFlora, AnomalyBluespace ]
    wrecks:
    - /Maps/Salvage/small-1.yml
    - /Maps/Salvage/small-2.yml
    - /Maps/Salvage/small-ai-survey-drone.yml

