- type: wfContract
  id: WFContractColonyPrefabs
  contractor: WFContractorColonyCouncil
  category: Hauling
  tier: 2
  title: wf-contract-colony-prefabs
  briefing: wf-contract-colony-prefabs-brief
  reward: 11000, 14000
  deposit: 1500
  minutes: 55
  weight: 1.2
  objective: !type:WFContractCourier
    package: WFContractFreightSupplies
    count: 3, 5
    from: Other
    to: Contractor
    destinations: [ WFContractorCaelPort ]
    perPackage: 1500
    perKilometre: 1250

- type: wfContract
  id: WFContractColonyLetters
  contractor: WFContractorColonyCouncil
  category: Delivery
  tier: 1
  title: wf-contract-colony-letters
  briefing: wf-contract-colony-letters-brief
  reward: 5500, 7500
  minutes: 60
  weight: 1.2
  objective: !type:WFContractMailRun
    package: WFContractParcel
    stops: 3, 4
    perStop: 1250
    perKilometre: 750

- type: wfContract
  id: WFContractColonySettlerEscort
  contractor: WFContractorColonyCouncil
  category: Escort
  tier: 2
  title: wf-contract-colony-settler-escort
  briefing: wf-contract-colony-settler-escort-brief
  reward: 18000, 23000
  deposit: 1500
  minutes: 60
  crewBonus: 0.25
  weight: 1
  objective: !type:WFContractEscort
    encounters: [ WFContractEscortLight ]
    destinations: [ WFContractorCaelPort, WFContractorSevastopol ]
    perKilometre: 1250

- type: wfContract
  id: WFContractColonyCarpNests
  contractor: WFContractorColonyCouncil
  category: Bounty
  tier: 2
  title: wf-contract-colony-carp-nests
  briefing: wf-contract-colony-carp-nests-brief
  reward: 18000, 24000
  deposit: 1000
  minutes: 55
  crewBonus: 0.25
  weight: 1
  objective: !type:WFContractClear
    minDistance: 2500
    maxDistance: 4500
    stationClearance: 2000
    targets:
      entity: WFContractCarpNest
      count: 2, 3
    infestation:
    - entity: MobCarpSalvage
      count: 2, 3
    wrecks:
    - /Maps/Salvage/cargo-1.yml
    - /Maps/Salvage/hauling-shuttle.yml
    - /Maps/Salvage/small-cargo.yml

