# Stellar Blessing Settlers' Council: colony work for TSF civilians, posted on the colony's own board.

- type: wfContract
  id: WFContractColonySeedDrive
  contractor: WFContractorColonyCouncil
  category: Supply
  tier: 1
  title: wf-contract-colony-seed-drive
  briefing: wf-contract-colony-seed-drive-brief
  reward: 6000, 8500
  minutes: 50
  weight: 1.5
  objective: !type:WFContractSupply
    premium: 1.5
    goods:
    - component: Seed
      name: wf-contract-goods-seeds
      count: 10, 15
      value: 30

- type: wfContract
  id: WFContractColonyRations
  contractor: WFContractorColonyCouncil
  category: Supply
  tier: 1
  title: wf-contract-colony-rations
  briefing: wf-contract-colony-rations-brief
  reward: 6000, 8500
  minutes: 45
  weight: 1.5
  objective: !type:WFContractSupply
    premium: 1.5
    goods:
    - entity: DrinkWaterBottleFull
      count: 10, 15
    - entity: FoodBreadPlain
      count: 6, 10

- type: wfContract
  id: WFContractColonyMedical
  contractor: WFContractorColonyCouncil
  category: Supply
  tier: 1
  title: wf-contract-colony-medical
  briefing: wf-contract-colony-medical-brief
  reward: 7000, 9500
  minutes: 50
  weight: 1.2
  objective: !type:WFContractSupply
