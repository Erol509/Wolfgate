# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: BaseStructure
  id: RMCPlanter
  # WOLFGATE(Streets): in the spawn menu's Streets group
  categories: [ WFStreets, WFStreetsFurniture ]
  components:
  - type: Sprite
    noRot: false
    snapCardinals: false
    sprite: _RMC14/Structures/Furniture/hybrisa_planter.rsi
    offset: 0,0.5
    state: planter
  - type: Appearance
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.8"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PlaceableSurface
    placeCentered: true
    isPlaceable: false
  - type: Icon
    sprite: _RMC14/Structures/Furniture/hybrisa_planter.rsi
    state: planter
  # WOLFGATE(Streets): a vehicle drives through it
  - type: VehicleSmashable
# WOLFGATE END
