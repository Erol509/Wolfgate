# WOLFGATE(DecorImport) START: ported from RMC-14
- type: entity
  parent: [BaseStructureDynamic, StructureWheeled]
  id: RMCJanitorialCartWreck
  name: old janicart
  description: Doesn't look like it'll do much cleaning any more.
  components:
    - type: Sprite
      noRot: true
      sprite: _RMC14/Objects/Misc/Janitorial/cart_wreck.rsi
      state: cart
    - type: Rotatable
    - type: InteractionOutline
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.3
          density: 250
          layer:
          - MobLayer
          mask:
          - MobMask
    - type: Damageable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 400
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:EmptyAllContainersBehaviour
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
    - type: Appearance
# WOLFGATE END
