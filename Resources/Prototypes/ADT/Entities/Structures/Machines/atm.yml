# WOLFGATE(DecorImport) START: ported from ADT
- type: entity
  id: ADTATMOutdoor
  parent: BaseMachinePowered
  name: outdoor ATM
  description: An outdoor ATM for all your monetary needs!
  components:
  - type: Sprite
    sprite: ADT/Structures/Machines/atm_outdoor.rsi
    snapCardinals: false
    drawdepth: SmallObjects
    layers:
    - state: "atm_off"
    - state: "atm"
      shader: unshaded
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      IdCardSlot: !type:ContainerSlot
  - type: Appearance
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  # WOLFGATE(DecorImport): ATM, its UI and ActivatableUIRequiresPower dropped, the ATM is decor here
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 200
    priority: Low
# WOLFGATE END
