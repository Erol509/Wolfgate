# WOLFGATE(Fauna) START: ported from ADT
- type: entity
  parent: SimpleMobBase
  id: ADTModAntlion
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: ADT/Mobs/Animals/antlion.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: antlion
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: antlion
      Critical:
        Base: antlion_dead
      Dead:
        Base: antlion_dead
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 1
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 7
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2.5
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-tarantula
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Voice/Arachnid/arachnid_click.ogg
  - type: Grammar
    attributes:
      proper: true
      gender: male
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot
  - type: LanguageKnowledge
    speaks:
    - Chittin
    understands:
    - Chittin
    - TauCetiBasic
# WOLFGATE END
