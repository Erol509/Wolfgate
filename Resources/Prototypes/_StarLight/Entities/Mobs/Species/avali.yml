# WOLFGATE(Species): BurnBodyBehavior here has no popupMessage field.
- type: entity
  save: false
  name: Urist McAvali
  parent: [ BaseMobSpeciesOrganic ]
  id: BaseMobAvali
  abstract: true
  components:
    - type: LanguageKnowledge
      speaks:
      - TauCetiBasic # WOLFGATE(Species): HardLight's GalacticCommon is TauCetiBasic here
      - Scratch
      understands:
      - TauCetiBasic
      - Scratch
    - type: Tag
      tags:
        - CanPilot
        - FootstepSound
        - DoorBumpOpener
        - AnomalyHost
        - Avali
    - type: Wagging # Hardlight
      action: ActionToggleAvaliWagging # Hardlight
    - type: HumanoidAppearance
      species: Avali
    - type: Hunger # on 2x more
      thresholds:
        Overfed: 250
        Okay: 200
        Peckish: 150
        Starving: 100
        Dead: 0
      baseDecayRate: 0.03
    - type: Thirst
    - type: PseudoItem
      storedOffset: 0,17
      shape:
        - 0,0,1,4
        - 0,2,3,4
        - 4,0,5,4
    - type: Icon
      sprite: _Starlight/Mobs/Species/Avali/parts.rsi
      state: full
    - type: Body
      prototype: Avali
      requiredLegs: 2
    - type: Inventory
      speciesId: avali
      displacements:
        jumpsuit:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Avali/displacement.rsi
              state: jumpsuit
        outerClothing:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Avali/displacement.rsi
              state: outerclothing
        shoes: # DM only for colored shoes!
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Avali/displacement.rsi
              state: shoes
        head:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Avali/displacement.rsi
              state: head
        hand:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Avali/displacement.rsi
              state: hand
        back:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Avali/displacement.rsi
              state: back
    - type: Butcherable
      butcheringType: Spike
      spawned:
        - id: FoodMeatChicken
          amount: 3
    - type: Speech
      speechVerb: Parrot # RMC did it right.
      speechSounds: MaleAvali
      allowedEmotes: ['Chirp', 'Hiss', 'Purr', 'Growl', 'Trill', 'Scree', 'Call', 'Squawk']
    - type: MobThresholds
      thresholds:
        0: Alive
        90: Critical
        180: Dead
    - type: Sprite
      scale: 0.91, 0.91
    - type: TemperatureSpeed
      thresholds:
        250: 0.9
        230: 0.8
        223: 0.6
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.35
          density: 95 #tiny
          restitution: 0.0
          mask:
            - MobMask
          layer:
            - MobLayer
    - type: Vocal
      sounds:
        Male: MaleAvali
        Female: FemaleAvali
        Unsexed: MaleAvali
    - type: MovementSpeedModifier
      baseWeightlessAcceleration: 1.6 # Avalis are specifically built to fly in low-g environments
      baseWeightlessFriction: 1
      baseWeightlessModifier: 1
    - type: Damageable
      damageContainer: Biological
      damageModifierSet: Avali
    # WOLFGATE(Avali) START: enable feather preening and regrowth for Avali
    - type: Preenable
      featherPrototype: AvaliFeather
    # WOLFGATE END
    # WOLFGATE(Wolfmed) START: D22, OD12: the Blunt gib moves to 1500 and the Heat body ash is removed, as on every other wound host
    # A wound host's body damage is the sum of its parts, so Blunt 400 came from routine limb damage and gibbed the
    # avali where a human only bled: a medical bounty that rolled 400 was deleted as it spawned. The living per-part
    # ceilings also sum past Heat 1500, so a long fire would have ashed the body, which OD12 rules out.
    - type: Destructible # HardLight: Avali now turn into fried chicken when ashed.
      thresholds:
      - trigger:
          !type:DamageTypeTrigger
          damageType: Blunt
          # damage: 400
          damage: 1500
        behaviors:
        - !type:GibBehavior { }
      # - trigger: # Frontier - Removed round remover
      #     !type:DamageTypeTrigger
      #     damageType: Heat
      #     damage: 1500
      #   behaviors:
      #   - !type:SpawnEntitiesBehavior
      #     spawnInContainer: true
      #     spawn:
      #       FoodMeatChickenFriedMystery:
      #         min: 2
      #         max: 5
      #   - !type:BurnBodyBehavior # HardLight: Parity with upstream changes to Vox.
      #   - !type:PlaySoundBehavior
      #     sound:
      #       collection: MeatLaserImpact
    # WOLFGATE END
    - type: DamageVisuals
      damageOverlayGroups:
        Brute:
          sprite: Mobs/Effects/brute_damage.rsi
          color: "#6C3BAA"
    - type: Bloodstream
      bloodReagent: AvaliBlood
    - type: MeleeWeapon
      soundHit:
        path: /Audio/Weapons/pierce.ogg
      angle: 30
      animation: WeaponArcClaw
      damage:
        types:
          Slash: 6.25
    - type: Temperature
      heatDamageThreshold: 310
      coldDamageThreshold: 223
      currentTemperature: 261
      specificHeat: 48
    - type: ThermalRegulator
      metabolismHeat: 400 # icebirb go brrr
      radiatedHeat: 100
      implicitHeatRegulation: 1500
      sweatHeatRegulation: 2000
      shiveringHeatRegulation: 2000
      normalBodyTemperature: 261
      thermalRegulationTemperatureThreshold: 1
    - type: Stasis
      enterStasisAction: ActionStasisEnter
      exitStasisAction: ActionStasisExit
      # WOLFGATE(Wolfmed) START: the Starlight teleport sound never shipped here, and the client logged an error every stasis.
      stasisEnterSound: /Audio/Effects/teleport_departure.ogg
      stasisExitSound: /Audio/Effects/teleport_arrival.ogg
      # WOLFGATE END
      # WOLFGATE(Avali) START: stasis mends at a quarter of the stock rate and rests twice as long
      # It also ends by itself and no longer softens a hit: wolfmed.stasis_max_seconds, wolfmed.stasis_damage_factor.
      stasisCooldown: 600
      stasisBluntHealPerSecond: 0.5
      stasisSlashingHealPerSecond: 0.5
      stasisPiercingHealPerSecond: 0.5
      stasisHeatHealPerSecond: 0.5
      stasisColdHealPerSecond: 0.5
      # WOLFGATE END
    # WOLFGATE(Avali) START: flight between z-levels, on the moth's numbers
    - type: CEZFlyer
      flightSpeed: 0.35
      flightMoveSpeedModifier: 0.35
      hoverStaminaDrain: 4
    - type: CEControllableFlight
      startFlightDoAfter: 2
    # WOLFGATE END
    - type: Carriable  # Hardlight change they can be carry now
# Chirp!

