- type: reagent
  id: Letoferol
  name: reagent-name-letoferol
  group: Special
  desc: reagent-desc-letoferol
  physicalDesc: reagent-physical-desc-necrotic
  flavor: acid
  color: "#a84387"
  worksOnTheDead: true
  metabolisms:
    Poison:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          max: 10
        - !type:OrganType
          type: Chimera
          shouldHave: false
        damage:
          types:
            Cellular: 0.5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 10
        - !type:OrganType
          type: Chimera
          shouldHave: false
        damage:
          types:
            Poison: 3
            Cellular: 4
      - !type:Polymorph
        prototype: LetoferolMutation
        conditions:
        # WOLFGATE(Chimera): a body that just fell out of a dead fleshbeast can't be turned straight back
        - !type:ChimeraTurnReady
        - !type:ReagentThreshold
          min: 10
        - !type:HasTag
          tag: Chimera
          invert: true
      - !type:PopupMessage
        conditions:
        - !type:OrganType
          type: Chimera
          shouldHave: false
        - !type:ReagentThreshold
          min: 4
        type: Local
        visualType: MediumCaution
        messages: [ "generic-reagent-effect-nauseous", "generic-reagent-effect-sick", "generic-reagent-effect-parched" ]
        probability: 0.2
      - !type:PopupMessage
        conditions:
        - !type:OrganType
          type: Chimera
          shouldHave: false
        - !type:ReagentThreshold
          min: 6
        type: Local
        visualType: LargeCaution
        messages: [ "generic-reagent-effect-slicing-insides" ]
        probability: 0.1
      - !type:Drunk
        boozePower: 15
        conditions:
        - !type:OrganType
          type: Chimera
          shouldHave: false
        - !type:ReagentThreshold
          min: 8
    # WOLFGATE(Synthetics) START: a synthetic chassis takes it too, shorting out while flesh grows over the frame
    WFContaminant:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          max: 15
        damage:
          types:
            Shock: 0.3
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 15
        damage:
          types:
            Shock: 1.5
      - !type:Polymorph
        prototype: LetoferolMutation
        conditions:
        - !type:ChimeraTurnReady
        - !type:ReagentThreshold
          min: 15
        - !type:HasTag
          tag: Chimera
          invert: true
      - !type:PopupMessage
        conditions:
        - !type:ReagentThreshold
          min: 4
        type: Local
        visualType: MediumCaution
        messages: [ "wf-synth-contaminant-1", "wf-synth-contaminant-2", "wf-synth-contaminant-3" ]
        probability: 0.2
    # WOLFGATE END

