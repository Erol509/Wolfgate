  name: TSF Volta Experimental Modsuit
  description: A modified sidegrade of the sapper modsuit model for TSFMC, featuring improved ballistic plates and explosion deflecting systems.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Back/Modsuits/tsfmc-volta.rsi
  - type: Storage # Extra space - Mono
    grid:
