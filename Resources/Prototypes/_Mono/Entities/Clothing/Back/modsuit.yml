- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitUSSPVaryag
  name: USSP Varyag Modsuit Core
  description: The power and life-support core of the Varyag modsuit.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Back/Modsuits/ussp-varyag.rsi
  # WOLFGATE(Modsuits) START: the native module system owns the suit parts
  # - type: ToggleableClothing
  #   clothingPrototypes:
  #     head: ClothingModsuitHelmetUSSPVaryag
  #     gloves: ClothingModsuitGauntletsUSSPVaryag
  #     outerClothing: ClothingModsuitChestplateUSSPVaryag
  #     shoes: ClothingModsuitBootsUSSPVaryag
  - type: ModSuit
    theme: ModThemeStandard
    parts:
      head: ClothingModsuitHelmetUSSPVaryag
      gloves: ClothingModsuitGauntletsUSSPVaryag
      outerClothing: ClothingModsuitChestplateUSSPVaryag
      shoes: ClothingModsuitBootsUSSPVaryag
  # WOLFGATE END

- type: entity
  parent: ClothingModsuitUSSPVaryag
  id: ClothingModsuitUSSPVaryagPowerCell
  suffix: High-Capacity Battery
  components:
  # WOLFGATE(Modsuits) START: a MOD core replaces the power cell
  # - type: ItemSlots
  #   slots:
  #     cell_slot:
  #       name: power-cell-slot-component-slot-name-default
  #       startingItem: PowerCellHigh
  #       whitelist:
  #         components:
  #           - PowerCell
  - type: ItemSlots
    slots:
      cell_slot:
        name: modsuit-core-slot-name
        startingItem: ModsuitCoreStandardHighCapacity
        whitelist:
          components:
          - ModCore
  # WOLFGATE END

