- type: entity
  id: ShipMissileBase
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: ShipWeaponProjectile
  - type: Fixtures
    fixtures:
      hit:
        shape: !type:PhysShapeCircle
          radius: 4
        layer:
        - BulletImpassable # Mono - ProjectileGridPhase will take care of collisions with same ship shots
        - Opaque
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Missile
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: AmbientSound
    volume: 5
    range: 20
    sound:
      path: /Audio/_Mono/Weapons/Guns/Missiles/engine_rocket_01.ogg

- type: damageModifierSet
  id: Missile
  coefficients:
    Blunt: 0.7
    Slash: 30 # I only use this for flak shrapnel, so it can work on missiles without it being too OP for ships.
    Piercing: 0.7
    Shock: 1.2
    Structural: 0.5
  flatReductions:
    Blunt: 5
    Heat: 5

# VESPERA

- type: entity
  id: MissileProjectile50mmHE
  name: ASM-50 50mm Mini Missile
  parent: ShipMissileBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 20
        Blunt: 20
        Heat: 30
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/mini_rocket.rsi
    layers:
    - state: mini-rocket
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectSmall
  - type: RadarBlip
    radarColor: "#FCBA03"
    scale: 1
    shape: hexagon
  - type: TimedDespawn
    lifetime: 5
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 8
    intensitySlope: 3
    maxIntensity: 5
    tileBreakScale: 3
  - type: GatheringProjectile
  - type: MiningGatheringSoft
  - type: MiningGatheringHard
  # WOLFGATE(ShipMissiles) START: the carrier only seeks; WFMissileFlightSystem flies the missile
  # Upstream carrier, which flew the missile itself:
  # - type: TargetSeeking
  #   acceleration: 140
  #   detectionRange: 1200
  #   scanArc: 15
  #   launchSpeed: 150
  #   maxSpeed: 300
  #   trackDelay: 0.1
  - type: TargetSeeking
    acceleration: 0
    launchSpeed: 0
    turnRate: 0
    trackingAlgorithm: Direct
    maxSpeed: 300
    detectionRange: 1200
    scanArc: 15
    trackDelay: 0.1
  - type: WFMissileFlight
    launchSpeed: 150
    boostAccel: 260
    boostTime: 1.6
    maxSpeed: 300
    lateralAccel: 120
    divertBudget: 80
    divertCap: 60
    notchBand: 6
    notchMemory: 1
    memoryTime: 1.5
    launchTransient: 0.5
    launchTurnMultiplier: 3
    launchDamping: 0.1
    launchAcquireCone: 60
    launchAcquireRange: 1200
    launchOffBoresight: 120
    snapFraction: 1
  # WOLFGATE END
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

