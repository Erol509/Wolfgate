- type: species
  id: IPC
  name: species-name-ipc
  roundStart: true
  prototype: MobIPC
  sprites: MobIPCSprites
  markingLimits: MobIPCMarkingLimits
  dollPrototype: MobIPCDummy
  skinColoration: Hues
  minAge: 1
  maxAge: 240
  oldAge: 50
  youngAge: 50
  maleFirstNames: IpcFirst
  femaleFirstNames: IpcFirst
  lastNames: IpcLast
  naming: FirstDashLast
  sexes:
  - Unsexed
  # WOLFGATE(Biotype): a machine by default
  biotype: Synthetic

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobIPCSprites
  sprites:
    Head: MobIPCHead
    Snout: MobHumanoidAnyMarking # WOLFGATE(Species): snout markings had no layer to draw on
    Eyes: MobHumanoidAnyMarking # WOLFGATE(Species): eye markings had no layer to draw on
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    TailBehind: MobHumanoidAnyMarking # WOLFGATE(Genitals): split tail layers ported from HardLight/Floof
    TailOversuit: MobHumanoidAnyMarking # WOLFGATE(Genitals): split tail layers ported from HardLight/Floof
    Hair: MobHumanoidAnyMarking # WOLFGATE(Species): was MobHumanoidMarkingMatchSkin; hair colour is the player's pick
    Chest: MobIPCTorso
    UndergarmentTop: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    UndergarmentBottom: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Genital: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Penis: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    Breasts: MobHumanoidAnyMarking # WOLFGATE(Genitals): underwear/genital layers ported from HardLight
    LArm: MobIPCLArm
    RArm: MobIPCRArm
    LHand: MobIPCLHand
    RHand: MobIPCRHand
    LLeg: MobIPCLLeg
    RLeg: MobIPCRLeg
    LFoot: MobIPCLFoot
    RFoot: MobIPCRFoot
    Wings: MobHumanoidAnyMarking

- type: markingPoints
  id: MobIPCMarkingLimits
  points:
    # WOLFGATE(Species) START: chassis parts get their own budget, the body categories are for markings
    # The parts used to fill Head, Chest, Legs and Arms, so any other marking there swapped a body part out.
    # Head:
    #   points: 1
    #   required: true
    #   defaultMarkings: [ MobIPCHeadDefault ]
    # Chest:
    #   points: 1
    #   required: true
    #   defaultMarkings: [ MobIPCTorsoDefault ]
    # Legs:
    #   points: 4
    #   required: true
    #   defaultMarkings: [ MobIPCLLegDefault, MobIPCLFootDefault, MobIPCRLegDefault, MobIPCRFootDefault ]
    # Arms:
    #   points: 4
    #   required: true
    #   defaultMarkings: [ MobIPCLArmDefault, MobIPCLHandDefault, MobIPCRArmDefault, MobIPCRHandDefault ]
    # HeadSide:
    #   points: 1
    #   required: false
    Chassis:
      points: 10
      required: true
      defaultMarkings: [ MobIPCHeadDefault, MobIPCTorsoDefault, MobIPCLArmDefault, MobIPCLHandDefault, MobIPCRArmDefault, MobIPCRHandDefault, MobIPCLLegDefault, MobIPCLFootDefault, MobIPCRLegDefault, MobIPCRFootDefault ]
    Head:
      points: 4 # WOLFGATE(Species): was 3, more marking slots
      required: false
    Snout:
      points: 1
      required: false
    Chest:
      points: 8 # WOLFGATE(Species): was 3, more marking slots
      required: false
    Legs:
      points: 16 # WOLFGATE(Species): was 8, more marking slots
      required: false
    Arms:
      points: 16 # WOLFGATE(Species): was 8, more marking slots
      required: false
    HeadSide:
      points: 2
      required: false
    # WOLFGATE END
    Wings:
      points: 1
      required: false

- type: humanoidBaseSprite
  id: MobIPCMarkingFollowSkin
  markingsMatchSkin: true
  layerAlpha: 0.5

