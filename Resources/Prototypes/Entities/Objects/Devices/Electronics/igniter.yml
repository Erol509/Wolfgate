- type: entity
  parent: BaseItem
  id: Igniter
  name: igniter
  description: Creates a spark when activated by a signal.
  components:
  - type: Sprite
    sprite: _WG/Resprites/Funkystation/Objects/Devices/igniter.rsi # WOLFGATE(Resprites): funky resprite batch
    state: icon
  - type: IgnitionSource
    temperature: 800
  - type: IgniteOnTrigger
  # WOLFGATE(InteractionParticles) START: igniters spark when triggered
  - type: ESSparkOnTrigger
  # WOLFGATE END
  - type: TriggerOnSignal
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: UseDelay # prevent sound spam
  - type: Tag
    tags:
    - Igniter
