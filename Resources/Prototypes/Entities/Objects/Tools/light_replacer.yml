- type: entity
  parent: [BaseItem, RecyclableItemDeviceSmall] # Frontier: added RecyclableItemDeviceSmall
  name: light replacer
  id: LightReplacer
  description: An item which uses magnets to easily replace broken lights. Refill By adding more lights into the replacer.
  components:
  - type: Sprite
    sprite: _WG/Resprites/Funkystation/Objects/Specific/Janitorial/light_replacer.rsi # WOLFGATE(Resprites): funky resprite batch
    state: icon
  - type: Item
    sprite: _WG/Resprites/Funkystation/Objects/Specific/Janitorial/light_replacer.rsi # WOLFGATE(Resprites): funky resprite batch
  - type: LightReplacer
    contents:
    - id: LightTube
      amount: 8
    - id: LightBulb
      amount: 5
  - type: StaticPrice
    price: 100
  - type: ContainerContainer
    containers:
      light_replacer_storage: !type:Container

- type: entity
  parent: LightReplacer
  id: LightReplacerEmpty
  suffix: Empty
  components:
  - type: LightReplacer
    contents:
    - id: LightTube
      amount: 0
