- type: entity
  id: InflatableWallStack
  parent: [BaseItem, RecyclableItemPlasticSmall] # Frontier: added RecyclableItemPlasticSmall
  name: inflatable barricade
  description: A folded membrane which rapidly expands into a large cubical shape on activation.
  suffix: Full
  components:
    - type: Stack
      stackType: InflatableWall
      count: 10
    - type: Sprite
      sprite: _WG/Resprites/Funkystation/Objects/Misc/inflatables.rsi # WOLFGATE(Resprites): funky resprite batch
      state: item_wall
    - type: Item
      sprite: _WG/Resprites/Funkystation/Objects/Misc/inflatables.rsi # WOLFGATE(Resprites): funky resprite batch
      size: Small
    - type: SpawnAfterInteract
      prototype: InflatableWall
      doAfter: 1
      removeOnInteract: true
    - type: Clickable
    - type: ConstructionMaterials # Frontier
