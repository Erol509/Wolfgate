- type: entity
  parent: [BaseItem, RecyclableItemPlasticSmall] # Frontier: added RecyclableItemPlasticSmall
  id: HandLabeler
  name: hand labeler
  description: A hand labeler, used to label items and objects.
  components:
    - type: Sprite
      sprite: _WG/Resprites/Funkystation/Objects/Tools/hand_labeler.rsi # WOLFGATE(Resprites): funky bureaucracy, chair, light and intercom resprites
      state: hand_labeler
    - type: Item
      sprite: _WG/Resprites/Funkystation/Objects/Tools/hand_labeler.rsi # WOLFGATE(Resprites): funky bureaucracy, chair, light and intercom resprites
      storedRotation: -90
    - type: UseDelay
      delay: 2.0
    - type: ActivatableUI
      key: enum.HandLabelerUiKey.Key
      inHandsOnly: true
    - type: UserInterface
      interfaces:
        enum.HandLabelerUiKey.Key:
          type: HandLabelerBoundUserInterface
    - type: HandLabeler
      whitelist:
        components:
          - Item
        tags:
          - Structure
    - type: StaticPrice
      price: 10