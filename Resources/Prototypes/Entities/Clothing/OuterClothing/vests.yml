#Hazard vest
- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterVestHazard
  name: hi-viz vest
  description: A high-visibility vest used in work zones.
  components:
  # WOLFGATE(Genitals) START: anatomy coverage
  - type: GenitalCoverage
    regions: Chest
  # WOLFGATE END
  - type: Sprite
    sprite: _WG/Resprites/Funkystation/Clothing/OuterClothing/Vests/hazard.rsi # WOLFGATE(Resprites): funky resprite batch
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _WG/Resprites/Funkystation/Clothing/OuterClothing/Vests/hazard.rsi # WOLFGATE(Resprites): funky resprite batch
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
  - type: Tag
    tags:
    - HiViz

