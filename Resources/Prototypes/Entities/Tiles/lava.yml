- type: entity
  id: FloorLavaEntity
  name: lava
  description: Don't jump in. It's not worth it, no matter how funny it is.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TileEmission
    color: "#FF4500"
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:FlammableReaction
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _WF/Resprites/Wizden/Tiles/TileEntities/liquid-lava.rsi # WOLFGATE(Resprites): Changed from "Tiles/Planet/lava.rsi" to "_WF/Resprites/Wizden/Tiles/TileEntities/liquid-lava.rsi" to match the new sprite.
    drawdepth: BelowFloor
  - type: Icon
    sprite: _WF/Resprites/Wizden/Tiles/TileEntities/liquid-lava.rsi # WOLFGATE(Resprites): Changed from "Tiles/Planet/lava.rsi" to "_WF/Resprites/Wizden/Tiles/TileEntities/liquid-lava.rsi" to match the new sprite.
    state: full
  - type: IconSmooth
    key: lava # WOLFGATE(Resprites): Changed from "floor" to "lava" to match the new sprite.
    base: water # WOLFGATE(Resprites): Changed from "lava" to "water" to match the new sprite.
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: Tag
    tags:
      - HideContextMenu
      - UnavoidableTrap # Mono - TrapAvoider shouldn't make you immune to this.
  - type: PlacementReplacement # WOLFGATE(Resprites): Added this component to ensure the tile overlay is replaced when this entity is placed.
    key: tileOverlay # WOLFGATE(Resprites): Added this component to ensure the tile overlay is replaced when this entity is placed.
