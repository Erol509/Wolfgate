- type: entity
  id: OperatingTable
  parent: [Bed, ConstructibleMachine]
  name: operating table
  description: Used for advanced medical procedures. # Shitmed
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
    noRot: true
  - type: Icon
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
  - type: OperatingTable
  # WOLFGATE(Surgery): the table itself hosts the operating computer UI (and patient monitor)
  - type: OperatingComputer
    requiresPower: false
  - type: UserInterface
    interfaces:
      enum.OperatingComputerUiKey.Key:
        type: OperatingComputerBui
  # Begin Shitmed Changes
  - type: Machine
    board: OperatingTableCircuitboard
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 2
    ports:
    - OperatingTable
  # End Shitmed Changes
