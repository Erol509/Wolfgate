# Xeno Tails

- type: marking
  id: XenoTailCurl
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Reptilian, ProtoReptile]
  layering: # WOLFGATE(Genitals): the south frame draws behind the body, so the tail never covers anatomy
    xeno_curl_BEHIND: TailBehind
  colorLinks: # WOLFGATE(Genitals): both halves of a tail share one colour
    xeno_curl_BEHIND: xeno_curl_FRONT
