- type: species
  id: Synth
  name: species-name-synth
  roundStart: true
  prototype: MobSynth
  sprites: MobSynthSprites
  defaultSkinTone: "#ffffff"
  markingLimits: MobSynthMarkingLimits
  dollPrototype: MobSynthDummy
  skinColoration: Hues
  # WOLFGATE(Biotype): a machine by default
  biotype: Synthetic

- type: speciesBaseSprites
  id: MobSynthSprites
  sprites:
    TailBehind: MobHumanoidAnyMarking
    TailOversuit: MobHumanoidAnyMarking
    Head: MobSynthHead
    Hair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Genital: MobHumanoidAnyMarking
    Penis: MobHumanoidAnyMarking
    Breasts: MobHumanoidAnyMarking
    Chest: MobSynthTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobSynthEyes
    LArm: MobSynthLArm
    RArm: MobSynthRArm
    LHand: MobSynthLHand
    RHand: MobSynthRHand
    LLeg: MobSynthLLeg
    RLeg: MobSynthRLeg
    LFoot: MobSynthLFoot
    RFoot: MobSynthRFoot
    RArmExtension: MobHumanoidAnyMarking

- type: markingPoints
  id: MobSynthMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
    HeadTop:
      points: 2
      required: false
      defaultMarkings: [ SynthAntenna ]
    HeadSide:
      points: 2
      required: false
    Head:
      points: 4 # WOLFGATE(Species): was 3, more marking slots
      required: false
      defaultMarkings: [ SynthVisor ]
    Snout:
      points: 1
      required: true
      defaultMarkings: [ SynthSnout ]
    Chest:
      points: 8 # WOLFGATE(Species): was 3, more marking slots
      required: false
    Arms:
      points: 16 # WOLFGATE(Species): was 4, more marking slots
      required: false
    Legs:
      points: 16 # WOLFGATE(Species): was 4, more marking slots
      required: false
    Tail:
      points: 2
      required: false
      defaultMarkings: [ SynthTail ]
    UndergarmentTop:
      points: 3
      required: false
    UndergarmentBottom:
      points: 3
      required: false
    # WOLFGATE(Genitals): Genital marking points removed with the legacy genital markings (replaced by organ-based anatomy).

