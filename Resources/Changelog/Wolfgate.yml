    - type: Add
      message: >-
        Freighters now deliver what stations are owed. Stealing their cargo or
        destroying them leaves those stations short.
    - type: Add
      message: >-
        Raiders can now blockade a station, cutting off its imports. Destroy
        them to lift the blockade and get paid.
    - type: Add
      message: >-
        The Market app has new Sector and Materials tabs, showing what each
        station is short of and where to trade materials.
    - type: Add
      message: >-
        Ore and material prices at pallets and market consoles now depend on how
        much a station holds, and stations with materials produce more.
    - type: Add
      message: >-
        Medical, ammo, fission fuel, weapon part and ship component crates can
        now go into lathes. Blank medipens, researched ship ammo, uranium fuel
        rods, ASMGT turrets and many ship vouchers now need them.
    - type: Add
