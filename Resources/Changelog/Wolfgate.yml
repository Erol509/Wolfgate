  url: https://github.com/VanguardControl/Wolfgate/pull/509
- author: DriftingSkies
  changes:
    - type: Add
      message: >-
        Added contract boards to Caelestinus Central, at the centre of the plaza
        and beside each of the six dock arms. Stations across the sector post
        paid work there, open to everyone, Vagrants included.
    - type: Add
      message: >-
        Every contract board has a pickup pad beside it. Contract cargo is
        always left there, or on the nearest clear floor.
    - type: Add
      message: >-
        Every contract says who you're working for, and on behalf of which
        faction or company.
    - type: Add
      message: >-
        Delivery contracts: hand-carry sealed parcels, data cases, sample cases
        and diplomatic pouches to another station. Walk them aboard and they're
        signed for. Mail runs send one parcel to each of several stations in a
        single trip.
    - type: Add
      message: >-
        Hauling contracts: move sealed freight, medical, munitions, equipment,
        reactor-part, livestock and plasma crates between stations. They need a
        hold or a strong back.
    - type: Add
      message: >-
        Supply contracts: fill a manifest crate with the goods a station wants
        (building stock, medical supplies, hardware, rations, reactor fuel,
        anomaly cores, ship parts, seeds, circuit boards) and close it aboard
        their station.
    - type: Add
      message: >-
        Mining contracts: fill a manifest crate with ore, from iron and quartz
        quotas up to lithium, uranium, diamond and bluespace. Bulk orders like
        the motherlode and the annual quota give whole crews a long shift of
        mining.
    - type: Add
      message: >-
        Bounty contracts: hunt down a ship in open space, from an unarmed bail
        jumper or an unpaid repossession up to smuggler convoys, an evasive ace
        pilot and a warlord's flagship. The wreck it leaves is yours to claim.
    - type: Add
      message: >-
        Some bounties turn up a lead: take down a Reaver lieutenant and their
        warlord's bounty is held for your crew alone for a short while.
    - type: Add
      message: >-
        Clear carp nests out of wrecks, and board stopped smugglers to inspect
        their cargo past their armed crew.
    - type: Add
      message: >-
        Salvage contracts: find a wreck out in space and bring back its flight
        recorder, data core, cargo manifest or anomaly sample. Some wrecks are
        infested.
    - type: Add
      message: >-
        Tow contracts: drag a derelict hull to a station. You need a rope coil
        and a tether installer on you to take one.
    - type: Add
      message: >-
        Repair derelict nav beacons, and hold derelict terminals while they
        download as hostiles attack in waves.
    - type: Add
      message: >-
        Fleet salvage operations: scan a battle wreck's anomalies, recover its
        flight recorder and tow the hull home, all in one contract.
    - type: Add
      message: >-
        Science contracts: scan every anomaly aboard a derelict before one
        collapses, from quiet wrecks to infested hulks, xeno nests and twin
        derelicts. Recover live artifacts, which pay more for every node you
        unlock, and log survey points out in open space.
    - type: Add
      message: >-
        Escort contracts: meet a freighter at the rendezvous and see it safely
        to its destination. Raiders may be lying in wait.
    - type: Add
      message: Planetary contracts are listed on the board as coming soon.
    - type: Add
      message: >-
        Added the Contracts PDA app to track your crew's contracts, deadlines,
        objectives and where to go.
    - type: Add
      message: >-
        Contractors remember you between shifts. Finish work to raise your
        standing and unlock riskier, better-paid contracts. Failing, abandoning,
        or working against a contractor's interests lowers it.
    - type: Add
      message: >-
        Crews share contract slots and split the pay. Bigger crews can hold more
        contracts at once, and crew work pays more for each crewmate in the
        sector, so shares don't shrink. The board shows each member's share
        before you take a contract.
    - type: Add
      message: >-
        Crew contracts need a crew of two to four in the sector, and pay each
        member more than solo work.
    - type: Add
      message: >-
        Bounty targets and wrecks show who has claimed them on radar, and your
        crew get a waypoint to your target. Firing on someone else's claimed
        target costs you standing, unless you're on the same side.
    - type: Add
      message: >-
        Added faction contract boards by the docks of the Halcyon (TSF), Camelot
        (USSP) and Helios (PDV), with members-only patrols, war materiel,
        ammunition drives, convoys, ore requisitions and salvage. They pay in
        thalers and faction currency. Only PDV-board contracts send you to
        Helios.
    - type: Tweak
      message: Encounter ransom demands now ask for thalers.
