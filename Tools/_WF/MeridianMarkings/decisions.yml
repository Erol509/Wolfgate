# Calls made by eye on the review sheets (port.py --review), where the comparison in dedupe.py could
# not settle a marking by itself. Keyed by SS13 typepath; a body marking adds #<part>.
#
# same: the repository already has this marking, as the id on the right. Mostly art another fork
#       edited after taking it from the same SS13 source, or cut into colour layers differently.
# new:  kept although the comparison calls it the same as an existing marking.

