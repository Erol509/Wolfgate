# Config for modules.py; see AGENTS.md, Modularity and Documenting changes.

# Modules that live outside _WF: path globs of their files (** crosses folders, * doesn't) and their README.
external:
  Symphony:
    readme: Content.Server/Symphony/README.md
    paths:
      - Content.*/Symphony/**
      - "**/*.Symphony.cs"
      - Resources/Locale/en-US/symphony/**
  Traits:
    readme: Content.Server/_DV/Traits/README.md
    paths:
      - Content.Client/_DV/Traits/**
      - Content.Server/_DV/Traits/**
      - Content.Shared/_DV/Traits/**
      - Content.Shared/_DV/CCVars/DCCVars.cs
      - Content.Shared/_Mono/Traits/Conditions/InCompanyCondition.cs
      - Content.Server/_Mono/Traits/Effects/LanguageTraitEffects.cs
      - Content.IntegrationTests/Tests/_DV/TraitSystemTest.cs
      - Resources/Locale/en-US/_DV/traits/**
      - Resources/Locale/en-US/_Mono/traits/traits-ui.ftl
      - Resources/Prototypes/_DV/Traits/**
      - Resources/Prototypes/_Mono/Traits/physical.yml
      - Resources/Prototypes/_Mono/Traits/speech.yml
      - Resources/Prototypes/_EinsteinEngines/Traits/categories.yml
      - Resources/Prototypes/_EinsteinEngines/Traits/languages.yml
      - Resources/Prototypes/_NF/Traits/categories.yml
      - Resources/Prototypes/_NF/Traits/disabilities.yml
      - Resources/Prototypes/_NF/Traits/quirks.yml
      - Resources/Prototypes/_NF/Traits/speech.yml

# Edits outside _WF that can't hold a WOLFGATE marker: JSON, images, audio, rich-text .txt and map files.
# Each entry has a path (a file, a folder or a glob), the module it serves (null for a standalone edit) and a reason.
unmarked:
  - path: .config/dotnet-tools.json
    module: null
    reason: dotnet-ef local tool manifest (pinned 10.0.12) for generating EF migrations.
  - path: Resources/ServerInfo/Rules.txt
    module: null
    reason: Rules rebranded from Monolith to Wolfgate (intro and section headings), with the rule and age update (#19).
  - path: Resources/Textures/Mobs/Customization/Markings/Genital/
    module: Genitals
    reason: Genital shape and pregnant belly sprites; Wolfgate-only RSIs at an upstream path.
  - path: Resources/Textures/Mobs/Customization/undergarments.rsi/
    module: Genitals
    reason: Undergarment marking sprites; Wolfgate-only RSI at an upstream path.
  - path: "Resources/Audio/Machines/robotscream_*.ogg"
    module: Species
    reason: Silicon scream sounds (SiliconScreams); Wolfgate-only files at an upstream path.
  - path: Resources/Audio/Voice/Resomi/resomi_whistle.ogg
    module: Species
    reason: Resomi whistle emote sound, ported from HardLight.
  - path: Resources/Audio/Voice/Shadekin/shadekin_cry.ogg
