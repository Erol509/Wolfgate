name: No submodule update checker

on:
  pull_request:
    # WOLFGATE(Ci): rerun when labels change so an Engine Update label clears the check
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths:
      - 'RobustToolbox'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  this_aint_right:
    name: Submodule update in pr found
    runs-on: ubuntu-latest
    steps:
      - name: Fail
        # WOLFGATE(Ci): deliberate engine bumps carry the Engine Update label
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'Engine Update') }}
        run: exit 1
